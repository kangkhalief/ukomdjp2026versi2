 hak", "Penitipan BKP sementara"], "c": 1, "e": "Pemakaian sendiri dan/atau pemberian cuma-cuma termasuk definisi penyerahan BKP (huruf d). Penyerahan secara konsinyasi sudah tidak lagi masuk definisi penyerahan sejak UU Cipta Kerja.", "p": 1, "topic": "Penyerahan BKP", "id": "pemeriksaan_q_43"}, {"q": "Tarif PPN atas Ekspor BKP, Ekspor JKP, dan Ekspor BKP Tidak Berwujud, baik sebelum maupun sesudah 1 April 2022, adalah...", "o": ["10%", "11%", "12%", "0%"], "c": 3, "e": "Tarif PPN atas seluruh jenis kegiatan ekspor (BKP, JKP, BKPTB) tetap 0%, baik sebelum maupun sesudah perubahan tarif normal dari 10% ke 11%.", "p": 1, "topic": "Tarif PPN", "id": "pemeriksaan_q_44"}, {"q": "Pemungutan PPN dan PPnBM menganut prinsip akrual, artinya terutangnya pajak terjadi pada saat...", "o": ["Pembayaran diterima penuh", "Penyerahan BKP/JKP, meskipun pembayaran belum diterima", "Faktur Pajak diterbitkan", "SPT Masa dilaporkan"], "c": 1, "e": "Prinsip akrual PPN: terutangnya pajak terjadi pada saat penyerahan BKP/JKP, meskipun pembayaran atas penyerahan tersebut belum diterima atau belum sepenuhnya diterima.", "p": 1, "topic": "Saat Terutang PPN", "id": "pemeriksaan_q_45"}, {"q": "Faktur Pajak WAJIB dibuat PKP pada saat-saat berikut, KECUALI...", "o": ["Saat penyerahan BKP/JKP", "Saat penerimaan pembayaran sebelum penyerahan", "Saat laporan keuangan tahunan diaudit", "Saat ekspor BKP/JKP"], "c": 2, "e": "Faktur Pajak dibuat pada saat penyerahan, penerimaan pembayaran (jika sebelum penyerahan), penerimaan pembayaran termin, ekspor, atau saat lain menurut PMK — bukan saat audit laporan keuangan.", "p": 1, "topic": "Faktur Pajak", "id": "pemeriksaan_q_46"}, {"q": "Dokumen tertentu yang dipersamakan dengan Faktur Pajak, jika dibuat melewati jangka waktu berapa bulan sejak seharusnya dibuat, dianggap tidak membuat dokumen tertentu sehingga PPN tidak dapat dikreditkan?", "o": ["1 bulan", "2 bulan", "3 bulan", "6 bulan"], "c": 2, "e": "Dokumen tertentu yang dibuat melewati jangka waktu 3 bulan sejak seharusnya dibuat dianggap tidak membuat dokumen tertentu, sehingga PPN yang tercantum tidak dapat dikreditkan.", "p": 1, "topic": "Faktur Pajak", "id": "pemeriksaan_q_47"}, {"q": "Persyaratan material Faktur Pajak mensyaratkan bahwa Faktur Pajak harus...", "o": ["Diisi secara benar, lengkap, dan jelas", "Berisi keterangan yang sebenarnya/sesungguhnya mengenai penyerahan BKP/JKP", "Dicetak dengan tinta berwarna", "Ditandatangani oleh direktur utama"], "c": 1, "e": "Persyaratan material berkaitan dengan substansi (keterangan sebenarnya mengenai transaksi), sedangkan \"diisi benar, lengkap, jelas\" adalah persyaratan formal.", "p": 1, "topic": "Faktur Pajak", "id": "pemeriksaan_q_48"}, {"q": "Pajak Masukan yang dapat namun belum dikreditkan pada Masa Pajak yang sama dapat dikreditkan pada Masa Pajak berikutnya paling lama...", "o": ["1 Masa Pajak", "2 Masa Pajak", "3 Masa Pajak sejak berakhirnya Masa Pajak saat Faktur Pajak dibuat", "6 Masa Pajak"], "c": 2, "e": "Sesuai Pasal 9 ayat (9) UU PPN, PM yang belum dikreditkan dapat dikreditkan paling lama 3 Masa Pajak setelah berakhirnya Masa Pajak saat Faktur Pajak dibuat, sepanjang belum dibebankan sebagai biaya/dikapitalisasi.", "p": 1, "topic": "Pengkreditan PM", "id": "pemeriksaan_q_49"}, {"q": "Pengkreditan Pajak Masukan TIDAK berlaku bagi pengeluaran untuk perolehan BKP/JKP yang...", "o": ["Dibeli secara tunai", "Tidak mempunyai hubungan langsung dengan kegiatan usaha", "Dibeli dari PKP lain", "Memiliki nilai di atas Rp1 juta"], "c": 1, "e": "Pasal 9 ayat (8) huruf b UU PPN mengecualikan pengkreditan PM atas perolehan BKP/JKP yang tidak mempunyai hubungan langsung dengan kegiatan usaha.", "p": 1, "topic": "PM Tidak Dapat Dikreditkan", "id": "pemeriksaan_q_50"}, {"q": "Pajak Masukan yang ditagih dengan penerbitan ketetapan pajak dapat dikreditkan oleh PKP sebesar...", "o": ["Jumlah pokok PPN dalam ketetapan, dengan syarat telah dilunasi dan tidak dilakukan upaya hukum", "Seluruh jumlah ketetapan termasuk sanksi", "50% dari jumlah ketetapan", "Tidak dapat dikreditkan sama sekali"], "c": 0, "e": "PM yang ditagih dengan ketetapan pajak dapat dikreditkan sebesar jumlah pokok PPN dalam ketetapan, dengan syarat ketetapan telah dilunasi dan tidak dilakukan upaya hukum.", "p": 1, "topic": "Pengkreditan PM", "id": "pemeriksaan_q_51"}, {"q": "Pemeriksa Pajak adalah pegawai negeri sipil di lingkungan DJP atau tenaga ahli yang ditunjuk oleh Direktur Jenderal Pajak, diatur dalam...", "o": ["PMK 15/2025 dan PERMENPAN 66/2021", "UU KUP Pasal 29", "PER-18/PJ/2025", "SE-15/PJ/2018"], "c": 0, "e": "Definisi Pemeriksa Pajak diatur dalam PMK 15/2025, sedangkan unsur kegiatan tugas Jabatan Fungsional Pemeriksa Pajak (pengujian kepatuhan & penegakan hukum) diatur dalam PERMENPAN 66/2021.", "p": 0, "topic": "Pemeriksa Pajak", "id": "pemeriksaan_q_52"}, {"q": "Berdasarkan Pasal 2 PMK 15/2025, tujuan Pemeriksaan terbagi menjadi 2 kategori, yaitu...", "o": ["Pemeriksaan Lengkap dan Pemeriksaan Terfokus", "Menguji Kepatuhan dan Tujuan Lain", "Pemeriksaan Rutin dan Pemeriksaan Khusus", "Pemeriksaan Kantor dan Pemeriksaan Lapangan"], "c": 1, "e": "Pasal 2 PMK 15/2025 membagi tujuan Pemeriksaan menjadi 2: Menguji Kepatuhan dan Tujuan Lain, yang kemudian berkaitan dengan tipe pemeriksaan (Lengkap/Terfokus/Spesifik).", "p": 0, "topic": "Tujuan Pemeriksaan", "id": "pemeriksaan_q_53"}, {"q": "Tipe Pemeriksaan Lengkap mencakup...", "o": ["Satu atau beberapa pos dalam SPT secara sederhana", "Satu atau beberapa pos dalam SPT secara mendalam", "Seluruh pos dalam SPT dan/atau SPOP secara mendalam", "Hanya pos PPN"], "c": 2, "e": "Pemeriksaan Lengkap mencakup seluruh pos dalam SPT dan/atau SPOP secara mendalam, berbeda dengan Pemeriksaan Terfokus (satu/beberapa pos mendalam) dan Spesifik (satu/beberapa pos sederhana).", "p": 0, "topic": "Tipe Pemeriksaan", "id": "pemeriksaan_q_54"}, {"q": "Manakah yang termasuk kriteria Pemeriksaan untuk menguji kepatuhan menurut Pasal 4 PMK 15/2025?", "o": ["Pemberian NPWP secara jabatan", "Pengembalian Lebih Bayar Pasal 17B KUP", "Penyelesaian keberatan", "Pengumpulan bahan penyusunan norma"], "c": 1, "e": "Pengembalian LB Pasal 17B KUP adalah kriteria pemeriksaan untuk menguji kepatuhan (huruf a); sementara pemberian NPWP jabatan, penyelesaian keberatan, dan pengumpulan bahan norma adalah kriteria pemeriksaan untuk tujuan lain.", "p": 0, "topic": "Kriteria Pemeriksaan", "id": "pemeriksaan_q_55"}, {"q": "Kriteria pemeriksaan untuk tujuan lain yang bersifat khusus PBB antara lain...", "o": ["Penentuan tempat terutang PPN", "Pendaftaran Objek PBB secara jabatan dan Pencabutan SKT Objek PBB", "Pengujian fasilitas perpajakan", "Penyelesaian prosedur persetujuan bersama"], "c": 1, "e": "Pendaftaran Objek PBB secara jabatan (huruf e) dan Pencabutan SKT Objek PBB (huruf f) adalah kriteria tujuan lain yang khusus berkaitan dengan PBB.", "p": 0, "topic": "Kriteria Pemeriksaan", "id": "pemeriksaan_q_56"}, {"q": "Jangka waktu pengujian Pemeriksaan Lengkap paling lama adalah...", "o": ["1 bulan", "3 bulan", "5 bulan", "10 hari kerja"], "c": 2, "e": "Jangka waktu pengujian: Pemeriksaan Lengkap paling lama 5 bulan, Terfokus 3 bulan, Spesifik 1 bulan, dan Data Konkret 10 hari kerja.", "p": 0, "topic": "Jangka Waktu Pemeriksaan", "id": "pemeriksaan_q_57"}, {"q": "Jangka waktu pengujian pemeriksaan dapat diperpanjang 4 bulan khusus untuk...", "o": ["WP yang mengajukan restitusi", "WP Grup/WP Transfer Pricing", "WP yang tidak kooperatif", "WP UMKM"], "c": 1, "e": "Jangka waktu pengujian dapat diperpanjang 4 bulan khusus untuk WP Grup atau WP yang bertransaksi dengan pihak yang mempunyai hubungan istimewa (Transfer Pricing).", "p": 0, "topic": "Jangka Waktu Pemeriksaan", "id": "pemeriksaan_q_58"}, {"q": "Data Konkret yang menjadi dasar pemeriksaan berdasarkan PER-18/PJ/2025 terdiri dari 3 jenis, yaitu...", "o": ["Faktur Pajak, Bukti Potput PPh, dan Bukti Transaksi/Data Perpajakan", "SPT, SPOP, dan Laporan Keuangan", "Data CRM, Data Analisis Risiko, dan Data Eksternal", "SP2DK, SPHPP, dan LHP2DK"], "c": 0, "e": "PER-18/PJ/2025 mendefinisikan Data Konkret sebagai: (a) Faktur Pajak yang disetujui namun belum/tidak dilaporkan dalam SPT PPN, (b) Bukti Potput PPh yang belum/tidak dilaporkan, (c) Bukti Transaksi/Data Perpajakan untuk menghitung kewajiban WP.", "p": 0, "topic": "Data Konkret", "id": "pemeriksaan_q_59"}, {"q": "Pemeriksaan Khusus berdasarkan analisis risiko disebut juga...", "o": ["Audit based on data", "Risk-based audit", "Pemeriksaan rutin", "Pemeriksaan data konkret"], "c": 1, "e": "Pemeriksaan khusus berdasarkan analisis risiko disebut risk-based audit, berbeda dengan pemeriksaan khusus berdasarkan data konkret yang disebut audit based on data.", "p": 0, "topic": "Jenis Pemeriksaan", "id": "pemeriksaan_q_60"}, {"q": "Pemeriksaan Rutin merupakan pemeriksaan yang dilakukan sehubungan dengan...", "o": ["Indikasi ketidakpatuhan berdasarkan data konkret", "Pemenuhan hak dan/atau pelaksanaan kewajiban perpajakan WP", "Analisis risiko kepatuhan", "Permintaan aparat penegak hukum"], "c": 1, "e": "Pemeriksaan Rutin dilakukan sehubungan dengan pemenuhan hak dan/atau pelaksanaan kewajiban perpajakan Wajib Pajak, berbeda dengan Pemeriksaan Khusus yang berbasis data konkret atau analisis risiko.", "p": 0, "topic": "Jenis Pemeriksaan", "id": "pemeriksaan_q_61"}, {"q": "Standar Umum Pemeriksaan mensyaratkan Pemeriksa Pajak memiliki, KECUALI...", "o": ["Pendidikan dan/atau pelatihan teknis yang cukup", "Integritas dan independensi dalam melaksanakan tugas", "Keterampilan sebagai Pemeriksa Pajak", "Jabatan struktural minimal eselon III"], "c": 3, "e": "Standar Umum Pemeriksaan mensyaratkan pendidikan/pelatihan teknis, keterampilan, serta integritas dan independensi — tidak mensyaratkan jabatan struktural tertentu.", "p": 0, "topic": "Standar Pemeriksaan", "id": "pemeriksaan_q_62"}, {"q": "Standar Pelaporan Hasil Pemeriksaan mensyaratkan bahwa Laporan Hasil Pemeriksaan disusun berdasarkan...", "o": ["Instruksi atasan", "Kertas kerja Pemeriksaan", "Permintaan Wajib Pajak", "Hasil rapat internal"], "c": 1, "e": "Standar Pelaporan Hasil Pemeriksaan mensyaratkan LHP disusun berdasarkan kertas kerja Pemeriksaan, memuat pelaksanaan, simpulan, dan usulan Pemeriksa Pajak.", "p": 0, "topic": "Standar Pemeriksaan", "id": "pemeriksaan_q_63"}, {"q": "Metode, Teknik, dan Prosedur Pemeriksaan memiliki pengertian berbeda. Manakah pasangan definisi yang TEPAT?", "o": ["Metode = cara pengumpulan bukti; Teknik = langkah rinci berupa perintah", "Teknik = cara-cara pengumpulan bukti, pengujian, dan/atau pembuktian; Prosedur = langkah rinci tertulis berupa perintah", "Prosedur = gabungan Metode Langsung dan Tidak Langsung", "Metode = serangkaian langkah dalam suatu Teknik"], "c": 1, "e": "Teknik adalah cara-cara pengumpulan bukti, pengujian, dan/atau pembuktian yang dikembangkan Pemeriksa Pajak; Prosedur adalah serangkaian langkah dalam suatu Teknik, berupa petunjuk rinci tertulis dalam bentuk perintah.", "p": 0, "topic": "Metode Teknik Prosedur", "id": "pemeriksaan_q_64"}, {"q": "Enam pendekatan dalam Metode Tidak Langsung meliputi semua berikut, KECUALI...", "o": ["Transaksi Tunai dan Bank", "Pertambahan Kekayaan Bersih", "Penghitungan Biaya Hidup", "Wawancara langsung dengan manajemen"], "c": 3, "e": "6 pendekatan Metode Tidak Langsung: transaksi tunai & bank, sumber & penggunaan dana, pertambahan kekayaan bersih, penghitungan rasio, penghitungan biaya hidup, dan satuan/volume — wawancara bukan termasuk pendekatan Metode Tidak Langsung (itu Teknik Metode Langsung).", "p": 0, "topic": "Metode Tidak Langsung", "id": "pemeriksaan_q_65"}, {"q": "Dalam Alur Proses Pemeriksaan, setelah SPHP disampaikan kepada WP, WP diberi hak menyampaikan tanggapan tertulis dalam jangka waktu...", "o": ["5 hari kerja", "30 hari kerja (PAHP & Pelaporan) / 10 hari kerja untuk Dakon", "4 bulan", "12 bulan"], "c": 1, "e": "Jangka waktu PAHP & Pelaporan paling lama 30 hari kerja sejak SPHP disampaikan (10 hari kerja untuk Pemeriksaan Data Konkret) sampai tanggal LHP.", "p": 0, "topic": "Alur Proses Pemeriksaan", "id": "pemeriksaan_q_66"}, {"q": "Pembukuan menurut Pasal 1 angka 29 UU KUP adalah proses pencatatan yang ditutup dengan menyusun...", "o": ["SPT Tahunan", "Laporan keuangan berupa neraca dan laporan laba rugi", "Nota perhitungan pajak", "Laporan audit independen"], "c": 1, "e": "Pembukuan adalah proses pencatatan teratur yang ditutup dengan menyusun laporan keuangan berupa neraca dan laporan laba rugi untuk periode Tahun Pajak tersebut.", "p": 0, "topic": "Pembukuan", "id": "pemeriksaan_q_67"}, {"q": "Buku, catatan, dan dokumen dasar pembukuan wajib disimpan di Indonesia selama...", "o": ["5 tahun", "10 tahun", "7 tahun", "Selamanya"], "c": 1, "e": "Buku, catatan, dokumen termasuk hasil pengolahan data elektronik wajib disimpan selama 10 tahun di Indonesia.", "p": 0, "topic": "Pembukuan", "id": "pemeriksaan_q_68"}, {"q": "Ketentuan Pembukuan mensyaratkan diselenggarakan dengan prinsip taat asas dan menggunakan...", "o": ["Stelsel akrual atau stelsel kas", "Hanya stelsel kas", "Hanya stelsel akrual", "Metode campuran tanpa batasan"], "c": 0, "e": "Ketentuan Pembukuan mensyaratkan taat asas dengan Stelsel Akrual atau Stelsel Kas, dicatat dalam huruf Latin, angka Arab, mata uang Rupiah, bahasa Indonesia atau bahasa asing yang diizinkan.", "p": 0, "topic": "Pembukuan", "id": "pemeriksaan_q_69"}, {"q": "Salah satu kewajiban Wajib Pajak yang diperiksa menurut Pasal 13 ayat (3) PP Nomor 50 Tahun 2022 adalah...", "o": ["Membayar biaya pemeriksaan", "Memperlihatkan dan/atau meminjamkan buku, catatan, atau dokumen yang berhubungan dengan penghasilan", "Menunjuk pengacara", "Hadir di pengadilan pajak"], "c": 1, "e": "WP yang diperiksa wajib memperlihatkan/meminjamkan buku/catatan/dokumen, memberi kesempatan memasuki tempat/ruang, dan memberikan data/informasi/keterangan yang diperlukan.", "p": 0, "topic": "Kewajiban WP Diperiksa", "id": "pemeriksaan_q_70"}, {"q": "Contoh keterangan tertulis yang dapat diminta Pemeriksa dari WP meliputi, KECUALI...", "o": ["Surat pernyataan tidak diaudit oleh kantor akuntan publik", "Surat pernyataan tentang kepemilikan harta", "Surat pernyataan tentang perkiraan biaya hidup", "Transkrip rekaman CCTV kantor WP"], "c": 3, "e": "Keterangan tertulis mencakup surat pernyataan tidak diaudit, kesesuaian fotokopi dokumen, kepemilikan harta, dan perkiraan biaya hidup — bukan rekaman CCTV.", "p": 0, "topic": "Keterangan Tertulis dan Lisan", "id": "pemeriksaan_q_71"}, {"q": "Kewajiban merahasiakan data pembukuan/pencatatan WP ditiadakan untuk keperluan...", "o": ["Pemasaran produk", "Pemeriksaan pajak sesuai Pasal 29 ayat (4) UU KUP", "Audit internal perusahaan", "Kepentingan pihak ketiga umum"], "c": 1, "e": "Pasal 29 ayat (4) UU KUP meniadakan kewajiban merahasiakan data/dokumen WP untuk keperluan pemeriksaan, guna mencegah dalih kerahasiaan menghalangi pemeriksaan.", "p": 0, "topic": "Peniadaan Kewajiban Merahasiakan", "id": "pemeriksaan_q_72"}, {"q": "Pengungkapan Ketidakbenaran Pengisian SPT oleh WP sesuai Pasal 8 ayat (4) UU KUP dapat dilakukan WP dengan syarat...", "o": ["DJP belum menyampaikan SPHP", "Pemeriksaan belum dimulai sama sekali", "WP sudah menerima SKP", "Keberatan sudah diajukan"], "c": 0, "e": "Walaupun DJP telah melakukan pemeriksaan, dengan syarat DJP belum menyampaikan SPHP, WP dapat mengungkapkan ketidakbenaran pengisian SPT dalam laporan tersendiri dan pemeriksaan tetap dilanjutkan.", "p": 0, "topic": "Pengungkapan Ketidakbenaran SPT", "id": "pemeriksaan_q_73"}, {"q": "Surat Ketetapan Pajak Nihil (SKPN) diterbitkan dalam hal...", "o": ["Jumlah kredit pajak sama dengan jumlah pajak terutang, atau pajak tidak terutang dan tidak ada kredit/pembayaran pajak", "Terdapat kelebihan pembayaran pajak", "Terdapat kekurangan pembayaran pajak", "WP mengajukan permohonan restitusi"], "c": 0, "e": "SKPN (Pasal 17A UU KUP) diterbitkan jika jumlah kredit pajak/pembayaran sama dengan jumlah pajak terutang, atau pajak tidak terutang dan tidak ada kredit pajak/pembayaran.", "p": 0, "topic": "SKPN", "id": "pemeriksaan_q_74"}, {"q": "Upaya hukum administratif dalam penyelesaian sengketa perpajakan yang dapat diajukan berkali-kali adalah...", "o": ["Keberatan", "Pembetulan", "Pengurangan dan Pembatalan", "Prosedur Persetujuan Bersama"], "c": 1, "e": "Pembetulan (Pasal 16 UU KUP) dapat diajukan berkali-kali, berbeda dengan Pengurangan/Pembatalan (maksimal 2 kali, selain Pasal 36(1) huruf d) dan Prosedur Persetujuan Bersama (maksimal 1 kali).", "p": 0, "topic": "Upaya Hukum", "id": "pemeriksaan_q_75"}, {"q": "Prosedur Persetujuan Bersama (MAP) dapat diajukan oleh pihak-pihak berikut, KECUALI...", "o": ["WP dalam negeri", "Direktur Jenderal Pajak", "Pejabat berwenang negara/yurisdiksi mitra P3B", "Pengadilan Pajak"], "c": 3, "e": "MAP diajukan oleh WP dalam negeri, Dirjen Pajak, pejabat berwenang negara mitra P3B, atau WNI melalui Dirjen Pajak terkait perlakuan diskriminatif — bukan oleh Pengadilan Pajak.", "p": 0, "topic": "Prosedur Persetujuan Bersama", "id": "pemeriksaan_q_76"}, {"q": "Objek Gugatan ke Pengadilan Pajak antara lain pelaksanaan Surat Paksa, dengan jangka waktu pengajuan...", "o": ["14 hari sejak tanggal pelaksanaan penagihan", "30 hari sejak tanggal pelaksanaan penagihan", "3 bulan sejak tanggal pelaksanaan penagihan", "12 bulan sejak tanggal pelaksanaan penagihan"], "c": 0, "e": "Jangka waktu Gugatan terhadap pelaksanaan penagihan pajak adalah 14 hari sejak tanggal pelaksanaan penagihan, sedangkan untuk objek gugatan lainnya 30 hari sejak diterimanya keputusan yang digugat.", "p": 0, "topic": "Gugatan", "id": "pemeriksaan_q_77"}, {"q": "Peninjauan Kembali (PK) ke Mahkamah Agung dapat diajukan paling banyak...", "o": ["1 kali", "2 kali", "3 kali", "Tanpa batas"], "c": 0, "e": "Permohonan PK sebagai upaya hukum luar biasa diajukan maksimal 1 kali sesuai Pasal 89 UU Pengadilan Pajak.", "p": 0, "topic": "Peninjauan Kembali", "id": "pemeriksaan_q_78"}, {"q": "Salah satu alasan pengajuan Peninjauan Kembali adalah...", "o": ["WP tidak puas dengan nominal pajak", "Putusan Pengadilan Pajak didasarkan pada kebohongan/tipu muslihat pihak lawan yang diketahui setelah putusan", "WP ingin mengulang proses persidangan", "Terdapat perubahan peraturan setelah putusan"], "c": 1, "e": "Salah satu dari 5 alasan PK adalah putusan Pengadilan Pajak didasarkan pada kebohongan atau tipu muslihat pihak lawan yang diketahui setelah perkara diputus, atau didasarkan bukti yang kemudian dinyatakan palsu oleh hakim pidana.", "p": 0, "topic": "Peninjauan Kembali", "id": "pemeriksaan_q_79"}, {"q": "WP yang ditunjuk sebagai Pihak Lain yang bertempat kedudukan di luar Daerah Pabean dan memilih melaksanakan kewajiban PPN PMSE menggunakan mata uang tertentu, wajib mengisi SPT Masa PPN menggunakan...", "o": ["Mata uang Rupiah saja", "Satuan mata uang dolar Amerika Serikat", "Mata uang negara asal", "Mata uang Euro"], "c": 1, "e": "WP yang ditunjuk sebagai Pihak Lain di luar Daerah Pabean dan memilih melaksanakan kewajiban PPN PMSE menggunakan dolar AS wajib mengisi SPT Masa PPN menggunakan satuan mata uang dolar Amerika Serikat.", "p": 0, "topic": "Mata Uang Dolar AS", "id": "pemeriksaan_q_80"}, {"q": "SPT yang digunakan WP untuk melaporkan perhitungan dan/atau pembayaran pajak, objek pajak, serta harta dan kewajiban terdiri dari 3 jenis, yaitu...", "o": ["SPT Masa, SPT Tahunan, dan SPOP", "SPT Masa dan SPT Tahunan saja", "SPOP dan SPT Masa saja", "SPT Elektronik dan SPT Manual"], "c": 0, "e": "Berdasarkan PMK 81/2024, jenis SPT terdiri dari SPT Masa (PPh, PPN, Bea Meterai, Pajak Karbon), SPT Tahunan (PPh 1 Tahun Pajak/Bagian Tahun Pajak, Pajak Karbon Tahunan), dan SPOP.", "p": 0, "topic": "Jenis dan Bentuk SPT", "id": "pemeriksaan_q_81"}, {"q": "Jangka waktu perpanjangan penyampaian SPT Tahunan PPh paling lama adalah...", "o": ["1 bulan sejak batas waktu penyampaian SPT Tahunan", "2 bulan sejak batas waktu penyampaian SPT Tahunan", "3 bulan sejak batas waktu penyampaian SPT Tahunan", "6 bulan sejak batas waktu penyampaian SPT Tahunan"], "c": 1, "e": "WP dapat memperpanjang jangka waktu penyampaian SPT Tahunan PPh paling lama 2 bulan sejak batas waktu penyampaian SPT Tahunan, dengan menyampaikan Pemberitahuan Perpanjangan.", "p": 0, "topic": "Perpanjangan SPT", "id": "pemeriksaan_q_82"}, {"q": "WP dapat membetulkan SPT dengan menyampaikan pernyataan tertulis, dengan syarat DJP belum melakukan...", "o": ["Penelitian SPT", "Pemeriksaan atau Pemeriksaan Bukti Permulaan secara terbuka", "Konfirmasi data", "Pengawasan"], "c": 1, "e": "Syarat pembetulan SPT: DJP belum melakukan Pemeriksaan atau Pemeriksaan Bukti Permulaan secara terbuka terhadap WP yang bersangkutan.", "p": 0, "topic": "Pembetulan SPT", "id": "pemeriksaan_q_83"}, {"q": "Pembetulan SPT yang menyebabkan rugi atau lebih bayar dapat dilakukan paling lama...", "o": ["1 tahun sebelum daluwarsa", "2 tahun sebelum daluwarsa", "3 tahun sebelum daluwarsa", "5 tahun sebelum daluwarsa"], "c": 1, "e": "Pembetulan SPT yang mengakibatkan rugi atau lebih bayar dapat dilakukan paling lama 2 tahun sebelum daluwarsa penetapan; selain itu dapat dilakukan sampai daluwarsa.", "p": 0, "topic": "Pembetulan SPT", "id": "pemeriksaan_q_84"}, {"q": "WP yang membetulkan SPT sehingga utang pajak menjadi lebih besar dikenai sanksi administrasi berupa bunga sesuai Pasal 8 UU KUP, dengan tarif...", "o": ["Suku bunga acuan + 5% dibagi 12", "Suku bunga acuan + 10% dibagi 12", "Suku bunga acuan + 15% dibagi 12", "Suku bunga acuan + 20% dibagi 12"], "c": 0, "e": "Sanksi bunga pembetulan SPT yang mengakibatkan utang pajak lebih besar dihitung dengan tarif suku bunga acuan ditambah 5%, dibagi 12.", "p": 0, "topic": "Sanksi Pembetulan SPT", "id": "pemeriksaan_q_85"}, {"q": "Objek Pajak Penghasilan menurut Pasal 4 ayat (1) UU PPh adalah...", "o": ["Hanya penghasilan dari pekerjaan", "Setiap tambahan kemampuan ekonomis yang diterima/diperoleh WP, dari Indonesia maupun luar Indonesia", "Hanya penghasilan dari usaha", "Hanya penghasilan berupa uang tunai"], "c": 1, "e": "Objek PPh adalah setiap tambahan kemampuan ekonomis yang diterima/diperoleh WP, baik berasal dari Indonesia maupun luar Indonesia, yang dapat dipakai untuk konsumsi atau menambah kekayaan.", "p": 0, "topic": "Objek PPh", "id": "pemeriksaan_q_86"}, {"q": "Manakah berikut yang TERMASUK dalam penghasilan yang DIKECUALIKAN dari objek pajak menurut Pasal 4 ayat (3) UU PPh?", "o": ["Penghasilan dari pekerjaan", "Hibah tertentu dan bantuan/sumbangan tertentu", "Penghasilan dari modal", "Penghasilan dari pengalihan harta"], "c": 1, "e": "Pasal 4 ayat (3) UU PPh mengecualikan antara lain bantuan/sumbangan tertentu, hibah tertentu, penerimaan asuransi tertentu, dividen tertentu (dengan syarat), dan imbalan bunga obligasi negara.", "p": 0, "topic": "Bukan Objek Pajak", "id": "pemeriksaan_q_87"}, {"q": "Timeline pelaporan pengukuhan PKP: jika WP wajib lapor PKP maksimal akhir tahun buku namun terlambat, maka mulai kewajiban PKP ditetapkan...", "o": ["Secara jabatan atau dianggap terlambat, mulai Masa Pajak pertama Tahun Buku berikutnya", "Sejak omzet melebihi Rp4,8 miliar", "Sejak awal tahun buku berjalan", "Sejak tanggal pendirian usaha"], "c": 0, "e": "Default mulai kewajiban PKP adalah Masa Pajak pertama Tahun Buku berikutnya; jika WP wajib lapor namun terlambat atau tidak lapor, pengukuhan dilakukan secara jabatan atau dianggap terlambat dengan mulai kewajiban yang sama.", "p": 0, "topic": "Timeline Pengukuhan PKP", "id": "pemeriksaan_q_88"}, {"q": "Kegiatan Membangun Sendiri (KMS) yang dikenai PPN menurut Pasal 16C UU PPN mensyaratkan luas bangunan minimal...", "o": ["100 m2", "150 m2", "200 m2", "500 m2"], "c": 2, "e": "KMS dikenai PPN jika luas bangunan minimal 200 m2, dilakukan tidak dalam kegiatan usaha/pekerjaan, hasilnya digunakan sendiri/pihak lain, diatur dalam PMK-61/PMK.03/2022.", "p": 0, "topic": "Kegiatan Membangun Sendiri", "id": "pemeriksaan_q_89"}, {"q": "PPN terutang atas Kegiatan Membangun Sendiri (KMS) dihitung dengan formula...", "o": ["11% x DPP penuh", "20% x 11% x Biaya Pembangunan (tidak termasuk tanah)", "0,5% x Peredaran Bruto", "10% x Nilai Bangunan"], "c": 1, "e": "PPN terutang atas KMS dihitung 20% x 11% x Biaya Pembangunan tidak termasuk harga tanah, dengan saat terutang mulai dibangun sampai selesai.", "p": 0, "topic": "Kegiatan Membangun Sendiri", "id": "pemeriksaan_q_90"}, {"q": "Jasa Maklon yang diekspor dapat dikenai PPN tarif 0% dengan salah satu syarat...", "o": ["Spesifikasi dan bahan baku disediakan oleh Penerima Ekspor JKP", "Jasa dilakukan di luar Daerah Pabean", "Bahan baku dibeli dari luar negeri", "Hasil produksi dijual di dalam negeri"], "c": 0, "e": "Salah satu syarat Jasa Maklon yang diekspor: spesifikasi dan bahan baku/bahan setengah jadi disediakan oleh Penerima Ekspor JKP, kepemilikan BKP hasil berada pada Penerima Ekspor JKP, dan BKP dikirim ke luar Daerah Pabean dengan mekanisme ekspor barang.", "p": 0, "topic": "Ekspor Jasa Kena Pajak", "id": "pemeriksaan_q_91"}, {"q": "Jenis Jasa Kena Pajak yang melekat pada barang tidak bergerak yang berada di luar Daerah Pabean, sebagaimana diatur PMK 32/PMK.010/2019, adalah...", "o": ["Jasa Maklon", "Jasa Konsultansi Konstruksi (pengkajian, perencanaan, perancangan bangunan di luar Daerah Pabean)", "Jasa teknologi informasi", "Jasa perawatan dan perbaikan"], "c": 1, "e": "Jasa Konsultansi Konstruksi meliputi pengkajian, perencanaan, dan perancangan bangunan/rencana bangunan yang berada di luar Daerah Pabean, termasuk kategori jasa yang melekat pada barang tidak bergerak.", "p": 0, "topic": "Ekspor Jasa Kena Pajak", "id": "pemeriksaan_q_92"}, {"q": "Jasa teknologi dan informasi yang dapat diekspor dengan tarif PPN 0% antara lain mencakup, KECUALI...", "o": ["Layanan analisis sistem komputer", "Layanan keamanan teknologi informasi (IT security)", "Layanan komputasi awan (cloud computing) dengan server berada di dalam Daerah Pabean", "Penjualan properti fisik di dalam negeri"], "c": 3, "e": "Penjualan properti fisik di dalam negeri bukan termasuk kategori jasa teknologi dan informasi yang dapat diekspor; jasa teknologi informasi mencakup layanan terkait sistem komputer, keamanan IT, hingga cloud computing.", "p": 0, "topic": "Jasa Teknologi dan Interkoneksi", "id": "pemeriksaan_q_93"}, {"q": "Agar kegiatan pelayanan JKP dikenai PPN tarif 0% sebagai ekspor jasa, harus didasarkan atas...", "o": ["Persetujuan lisan antara PKP dan Penerima Ekspor JKP", "Perikatan/perjanjian tertulis yang mencantumkan jenis, rincian kegiatan, dan nilai penyerahan JKP, disertai bukti pembayaran", "Faktur penjualan saja", "Surat keterangan domisili dari negara penerima"], "c": 1, "e": "Syarat ekspor JKP dikenai PPN 0%: didasarkan perikatan/perjanjian tertulis yang mencantumkan jenis, rincian kegiatan, dan nilai penyerahan JKP, serta terdapat pembayaran disertai bukti pembayaran yang sah.", "p": 0, "topic": "Syarat Ekspor JKP", "id": "pemeriksaan_q_94"}, {"q": "Rumus umum untuk menghitung Pajak Pertambahan Nilai menurut Pasal 8A ayat (1) UU PPN adalah...", "o": ["PPN = Tarif x DPP", "PPN = DPP / Tarif", "PPN = Peredaran Bruto x 0,5%", "PPN = Laba Kena Pajak x Tarif"], "c": 0, "e": "Formula umum penghitungan PPN sesuai Pasal 8A ayat (1) UU PPN adalah PPN = Tarif x Dasar Pengenaan Pajak (DPP).", "p": 0, "topic": "Formula PPN", "id": "pemeriksaan_q_95"}, {"q": "Pajak Masukan menurut Pasal 1 angka 24 UU PPN adalah PPN yang seharusnya sudah dibayar oleh PKP karena, KECUALI...", "o": ["Perolehan BKP dan/atau JKP", "Pemanfaatan BKP Tidak Berwujud/JKP dari luar Daerah Pabean", "Impor BKP", "Penjualan BKP kepada konsumen akhir"], "c": 3, "e": "Pajak Masukan timbul dari perolehan BKP/JKP, pemanfaatan BKP Tidak Berwujud/JKP dari luar Daerah Pabean, dan impor BKP — bukan dari penjualan (yang menimbulkan Pajak Keluaran).", "p": 0, "topic": "Pajak Masukan", "id": "pemeriksaan_q_96"}]}, "pengawasan": {"file": "pengawasan", "label": "Pengawasan", "ringkasan": [{"heading": "Penghapusan Wajib Pajak Badan — Batas Waktu Keputusan", "p": 1, "page": "hlm 259", "html": "<p>Permohonan penghapusan NPWP Wajib Pajak Badan harus diputuskan oleh Kepala KPP paling lama <strong>1 (satu) bulan</strong> setelah jangka waktu penyelesaian berakhir.</p><p><strong>Apabila jangka waktu tersebut terlampaui dan Kepala KPP tidak memberikan keputusan, permohonan penghapusan WP dianggap dikabulkan</strong> (deemed approval) dan Kepala KPP wajib menerbitkan Surat Keputusan Penghapusan NPWP paling lama 1 bulan setelah jangka waktu berakhir.</p>", "id": "pengawasan_r_0"}, {"heading": "PPN atas Kegiatan Membangun Sendiri (KMS) — Pengenaan Tanpa Pengurangan Biaya", "p": 1, "page": "hlm 443", "html": "<p>PMK 61/PMK.03/2022 menegaskan bahwa PPN KMS dikenakan <strong>tanpa pengurangan biaya-biaya administrasi</strong> dari total biaya membangun yang menjadi dasar pengenaan pajak.</p>", "id": "pengawasan_r_1"}, {"heading": "PPN KMS — Batas Waktu Penyetoran", "p": 1, "page": "hlm 443", "html": "<p>PPN atas Kegiatan Membangun Sendiri wajib disetor <strong>paling lambat pada akhir bulan berikutnya</strong> setelah berakhirnya masa pajak dibangunnya bangunan tersebut.</p>", "id": "pengawasan_r_2"}, {"heading": "PPN KMS — Pengecualian bagi Pihak yang Membangunkan untuk Pihak Lain", "p": 1, "page": "hlm 517", "html": "<p>PMK 61/PMK.03/2022 memberikan pengecualian dari kewajiban PPN KMS <strong>sepanjang pihak yang membangunkan memberikan data/informasi paling sedikit berupa identitas dan alamat pihak lain yang sesungguhnya membangun bangunan tersebut</strong> kepada DJP — tanggung jawab PPN KMS beralih ke pihak yang sebenarnya membangun.</p>", "id": "pengawasan_r_3"}, {"heading": "Fasilitas Tax Allowance — Bentuk Fasilitas dan Wajib Pajak yang Berhak", "p": 1, "page": "hlm 578 (Pasal 408, PMK 11/PMK.010/2020)", "html": "<p>Fasilitas Tax Allowance (PPh Pasal 31A UU PPh) berupa pengurangan penghasilan neto, penyusutan/amortisasi dipercepat, perpanjangan kompensasi kerugian, dan penurunan tarif PPh atas dividen bagi WPLN. Diberikan kepada WP Badan yang melakukan penanaman modal di bidang usaha tertentu dan/atau daerah tertentu yang mendapat prioritas tinggi secara nasional.</p>", "id": "pengawasan_r_4"}, {"heading": "Larangan Pemanfaatan Fasilitas Tax Allowance atas Aktiva", "p": 1, "page": "hlm 599 (Pasal 421, PMK 11/PMK.010/2020)", "html": "<p><strong>Aktiva tetap berwujud dan aktiva tak berwujud yang telah mendapatkan fasilitas Tax Allowance dilarang</strong> dialihkan/digunakan untuk tujuan selain yang diberikan fasilitas dalam jangka waktu tertentu — pelanggaran mengakibatkan fasilitas dicabut dan dikenakan sanksi.</p>", "id": "pengawasan_r_5"}, {"heading": "Larangan Serupa pada PMK 16/PMK.010/2020 (Tax Holiday)", "p": 1, "page": "hlm 609 (Pasal 429)", "html": "<p>Ketentuan larangan pengalihan aktiva tetap berwujud yang mendapat fasilitas berlaku serupa pada rezim <strong>Tax Holiday</strong> (PMK 16/PMK.010/2020) — konsisten dengan prinsip bahwa fasilitas fiskal terikat pada penggunaan aktiva sesuai tujuan pemberian fasilitas.</p>", "id": "pengawasan_r_6"}, {"heading": "Fasilitas Litbang — Pengecualian Kontrak Bagi Hasil/Kontrak Karya", "p": 1, "page": "hlm 614 (Pasal 434 & 437, PMK 153/PMK.010/2020)", "html": "<p>Fasilitas pengurangan penghasilan bruto untuk kegiatan penelitian dan pengembangan (litbang) <strong>tidak berlaku bagi Wajib Pajak badan dalam negeri yang menjalankan usaha berdasarkan kontrak bagi hasil, kontrak karya, atau perjanjian kerja sama pengusahaan pertambangan</strong> — karena rezim fiskal sektor tersebut sudah diatur tersendiri dalam kontrak/perjanjiannya.</p>", "id": "pengawasan_r_7"}, {"heading": "PMK-111/2025 — Ruang Lingkup Pengawasan (WP Terdaftar)", "p": 1, "page": "hlm 628 (Pasal 3)", "html": "<p>Pasal 3 PMK-111/2025 menegaskan ruang lingkup pengawasan kepatuhan mencakup kolom <strong>\"WP Terdaftar\"</strong> sebagai salah satu sasaran utama pengawasan kepatuhan — dibedakan dari pengawasan ekstensifikasi atas WP yang belum terdaftar. (Detail alur SP2DK/PMK-111 dibahas lebih lanjut pada materi Pengawasan bagian Ekstensifikasi.)</p>", "id": "pengawasan_r_8"}, {"heading": "NPWP dan Fungsinya (Pasal 1 & 2 UU KUP)", "p": 0, "html": "<p>NPWP adalah nomor identitas WP dalam administrasi perpajakan (Pasal 1 angka 6 UU KUP). Setiap WP yang memenuhi persyaratan subjektif dan objektif wajib mendaftarkan diri ke KPP sesuai wilayah tempat tinggal/kedudukan (Pasal 2 ayat (1) UU KUP).</p>", "id": "pengawasan_r_9"}, {"heading": "NPWP Wanita Kawin, Anak Belum Dewasa, dan Warisan Belum Terbagi", "p": 0, "html": "<p>Wanita kawin tidak dapat mendaftarkan NPWP sendiri kecuali hidup berpisah berdasarkan putusan hakim, melakukan pemisahan harta/penghasilan tertulis, atau menghendaki pemisahan kewajiban perpajakan. Anak belum dewasa (&lt;18 tahun) menggunakan NPWP orang tua. Warisan Belum Terbagi (WBT) menggunakan NPWP dari WP OP yang meninggalkan warisan; jika belum memiliki NPWP, wakil WBT wajib mendaftarkan diri.</p>", "id": "pengawasan_r_10"}, {"heading": "Pengukuhan dan Pencabutan PKP", "p": 0, "html": "<p>Pengusaha (kecuali pengusaha kecil dengan omzet ≤ Rp4,8 miliar/tahun) wajib melaporkan usahanya untuk dikukuhkan sebagai PKP. Pencabutan pengukuhan PKP dapat terjadi karena permohonan WP, secara jabatan, atau karena hasil pemeriksaan/penelitian — Dirjen Pajak harus memberi keputusan atas permohonan pencabutan dalam 6 bulan sejak permohonan lengkap diterima.</p>", "id": "pengawasan_r_11"}, {"heading": "Jangka Waktu Pendaftaran NPWP & Pengukuhan PKP", "p": 0, "html": "<p>OP: paling lama akhir bulan berikutnya setelah penghasilan melebihi PTKP, atau 1 bulan setelah mulai usaha/pekerjaan bebas. Badan: paling lama 1 bulan setelah pendirian. Instansi Pemerintah: sebelum melakukan pemotongan/pemungutan. PKP: akhir bulan berikutnya setelah omzet melebihi Rp4,8 miliar.</p>", "id": "pengawasan_r_12"}, {"heading": "NIK sebagai NPWP", "p": 0, "html": "<p>Pasal 2 ayat (1a) UU KUP: NPWP OP yang merupakan penduduk Indonesia menggunakan NIK. Berlaku sejak 14 Juli 2022 dan penerapan penuh mulai 1 Juli 2024 (PMK-112/PMK.03/2022 stdd PMK-136/PMK.03/2023). NPWP Badan/Instansi Pemerintah/OP bukan penduduk tetap 16 digit angka.</p>", "id": "pengawasan_r_13"}, {"heading": "Pembukuan dan Pencatatan (Pasal 28 UU KUP)", "p": 0, "html": "<p>Pembukuan: proses pencatatan teratur atas harta, kewajiban, modal, penghasilan, dan biaya yang ditutup dengan laporan keuangan (neraca & laba rugi). Pencatatan: data teratur tentang peredaran/penerimaan bruto sebagai dasar menghitung pajak terutang. WP OP yang berkegiatan usaha/pekerjaan bebas dan Badan wajib menyelenggarakan pembukuan, kecuali WP OP yang memilih NPPN atau memenuhi kriteria PMK 54/2021.</p>", "id": "pengawasan_r_14"}, {"heading": "Ketentuan Penyimpanan Dokumen Pembukuan", "p": 0, "html": "<p>Buku, catatan, dan dokumen dasar pembukuan/pencatatan wajib disimpan selama <strong>10 tahun</strong> di Indonesia, di tempat kegiatan/tempat tinggal WP OP atau tempat kedudukan WP Badan.</p>", "id": "pengawasan_r_15"}, {"heading": "Batas Waktu Pembayaran Pajak", "p": 0, "html": "<p>PPh Pasal 4(2)/15/21 dipotong: tanggal 10 bulan berikutnya. PPh Pasal 23/26/22 dipungut WP badan tertentu, PPh 4(2)/15 bayar sendiri, PPh 25: tanggal 15 bulan berikutnya. PPh 22 & PPN/PPnBM impor: bersamaan bea masuk atau 1 hari setelah pemungutan. STP/SKPKB/SKPKBT/SK Keberatan/dll: 1 bulan sejak diterbitkan (dapat diperpanjang maks. 2 bulan untuk WP usaha kecil/daerah tertentu).</p>", "id": "pengawasan_r_16"}, {"heading": "Sanksi Bunga atas Keterlambatan Pembayaran", "p": 0, "html": "<p>Sanksi bunga = Pajak Kurang Bayar × tarif bunga per bulan (suku bunga acuan + uplift factor 5%, dibagi 12) × jumlah bulan, dikenakan paling lama 24 bulan, dihitung sejak tanggal jatuh tempo sampai tanggal pembayaran (Pasal 9 ayat (2a)/(2b) UU KUP).</p>", "id": "pengawasan_r_17"}, {"heading": "Jenis dan Fungsi SPT", "p": 0, "html": "<p>SPT adalah surat untuk melaporkan penghitungan/pembayaran pajak, objek/bukan objek pajak, dan/atau harta-kewajiban. Jenis: SPT Masa (PPh 21/26, Unifikasi 4(2)/15/22/23/26, PPN, PPN Pemungut, Bea Meterai) dan SPT Tahunan (PPh satu Tahun Pajak / Bagian Tahun Pajak).</p>", "id": "pengawasan_r_18"}, {"heading": "Kewajiban Mengisi SPT: Benar, Lengkap, Jelas", "p": 0, "html": "<p>Benar = benar hitungan & penerapan ketentuan serta sesuai keadaan sebenarnya. Lengkap = memuat semua unsur objek pajak & unsur lain yang wajib dilaporkan. Jelas = melaporkan asal-usul/sumber objek pajak. SPT ditandatangani WP sendiri, wakil, atau kuasa (dengan surat kuasa khusus dilampirkan).</p>", "id": "pengawasan_r_19"}, {"heading": "Batas Waktu Penyampaian SPT", "p": 0, "html": "<p>SPT Tahunan PPh OP: 3 bulan setelah akhir Tahun Pajak. SPT Tahunan PPh Badan: 4 bulan setelah akhir Tahun Pajak. SPT Masa PPh (4(2)/15/21/26/22/25/23): 20 hari setelah akhir Masa Pajak. SPT Masa PPN: akhir bulan berikutnya. Bea Meterai: 15 hari setelah Masa Pajak berakhir.</p>", "id": "pengawasan_r_20"}, {"heading": "Pengecualian Kewajiban Penyampaian SPT", "p": 0, "html": "<p>SPT Tahunan & Masa PPh 25 bagi WP OP berpenghasilan di bawah PTKP; SPT Masa PPh 25 bagi WP OP tanpa usaha/pekerjaan bebas atau dengan angsuran nihil; SPT Masa PPh 21/26 Nihil selain Masa Desember; SPT Masa PPN Nihil bagi pemungut.</p>", "id": "pengawasan_r_21"}, {"heading": "SPT Dianggap Tidak Disampaikan", "p": 0, "html": "<p>SPT dianggap tidak disampaikan jika: tidak ditandatangani; tidak sepenuhnya dilampiri keterangan/dokumen yang disyaratkan; SPT Lebih Bayar disampaikan setelah 3 tahun sejak berakhirnya Masa/Tahun Pajak dan WP telah ditegur tertulis; atau SPT disampaikan setelah dilakukan pemeriksaan/diterbitkan SKP.</p>", "id": "pengawasan_r_22"}, {"heading": "Perpanjangan Penyampaian SPT Tahunan", "p": 0, "html": "<p>WP dapat memperpanjang jangka waktu penyampaian SPT Tahunan PPh paling lama 2 bulan sejak batas waktu, dengan menyampaikan pemberitahuan perpanjangan sebelum batas waktu berakhir, dilampiri penghitungan sementara pajak terutang, laporan keuangan sementara, dan SSP (jika ada kekurangan bayar).</p>", "id": "pengawasan_r_23"}, {"heading": "Sanksi Administrasi Telat/Tidak Lapor SPT (Pasal 7 ayat (1) UU KUP)", "p": 0, "html": "<p>Denda: SPT Masa PPN Rp500.000; SPT Masa lainnya Rp100.000; SPT Tahunan WP OP Rp100.000; SPT Tahunan WP Badan Rp1.000.000. Dikecualikan bagi WP OP meninggal tanpa warisan, WP OP tidak berusaha lagi, WNA yang sudah tidak tinggal di Indonesia, BUT yang tidak beroperasi lagi, dan WP yang terkena bencana/keadaan lain yang ditentukan Dirjen Pajak.</p>", "id": "pengawasan_r_24"}, {"heading": "Pembetulan SPT", "p": 0, "html": "<p>WP dapat membetulkan SPT dengan pernyataan tertulis sepanjang belum dilakukan pemeriksaan atau pemeriksaan bukti permulaan secara terbuka. Pembetulan yang menyatakan rugi/lebih bayar: paling lama 2 tahun sebelum daluwarsa. Pembetulan yang menambah utang pajak dikenai sanksi bunga Pasal 8 UU KUP.</p>", "id": "pengawasan_r_25"}, {"heading": "Konsep Dasar PPh", "p": 0, "html": "<p>PPh bersifat pajak pusat, pajak subjektif (memperhatikan subjek pajak), pajak langsung, dan progresif. Administrasi di Pemerintah Pusat dengan sistem self assessment (hitung/bayar/lapor sendiri) dan withholding (pihak ketiga memotong/memungut).</p>", "id": "pengawasan_r_26"}, {"heading": "Subjek Pajak PPh", "p": 0, "html": "<p>Pasal 2 UU PPh: Orang Pribadi, Warisan Belum Terbagi, Badan, dan BUT. SPDN OP: tinggal di Indonesia, >183 hari dalam 12 bulan, atau berniat tinggal di Indonesia dalam 1 Tahun Pajak. SPLN: tidak memenuhi kriteria SPDN. Badan SPDN: didirikan/berkedudukan di Indonesia.</p>", "id": "pengawasan_r_27"}, {"heading": "Non-Subjek Pajak PPh", "p": 0, "html": "<p>Pasal 3 UU PPh: Kantor Perwakilan Negara Asing; Pejabat Perwakilan Diplomatik/Konsulat (syarat: bukan WNI, tidak menerima penghasilan lain, ada perlakuan timbal balik); Organisasi Internasional dan pejabatnya (syarat serupa); serta unit tertentu badan pemerintah yang dibentuk berdasarkan UU, dibiayai APBN/APBD, dan diaudit aparat pengawasan fungsional negara.</p>", "id": "pengawasan_r_28"}, {"heading": "Objek Pajak PPh (Pasal 4 ayat (1))", "p": 0, "html": "<p>Penghasilan = tambahan kemampuan ekonomis yang diterima/diperoleh WP, berasal dari Indonesia/luar Indonesia, dapat dipakai untuk konsumsi/menambah kekayaan, dengan nama & bentuk apapun. Termasuk: laba usaha, keuntungan penjualan harta, bunga, dividen, royalti, sewa, hadiah, pembebasan utang, selisih kurs, dan tambahan kekayaan neto yang belum dikenai pajak.</p>", "id": "pengawasan_r_29"}, {"heading": "Karakteristik PPh Final & Penghasilan Bukan Objek Pajak", "p": 0, "html": "<p>PPh Final: tidak digabung dengan penghasilan tarif umum, tarif khusus, terutang setiap transaksi, biaya tidak dapat dikurangkan, tetap dikenakan walau rugi. Bukan objek pajak: bantuan/sumbangan/zakat, warisan, harta hibah, natura/kenikmatan tertentu, bagian laba koperasi/CV/firma, beasiswa tertentu, dan sisa lebih badan nirlaba pendidikan/litbang/keagamaan/sosial.</p>", "id": "pengawasan_r_30"}, {"heading": "Biaya Fiskal (Deductible) dan Non-Fiskal (Non-Deductible)", "p": 0, "html": "<p>Pasal 6 UU PPh: biaya 3M (mendapatkan, menagih, memelihara penghasilan) dapat dikurangkan, termasuk penyusutan/amortisasi, iuran dana pensiun, kerugian penjualan harta, biaya litbang, dan sumbangan bencana/litbang/pendidikan tertentu. Pasal 9 UU PPh: tidak dapat dikurangkan antara lain pembagian laba/dividen, biaya kepentingan pribadi, PPh, sanksi administrasi, dan jumlah yang melebihi kewajaran (terkait transaksi hubungan istimewa).</p>", "id": "pengawasan_r_31"}, {"heading": "Kompensasi Kerugian (Pasal 6 ayat (2))", "p": 0, "html": "<p>Kerugian suatu usaha/kegiatan dalam satu Tahun Pajak dikompensasikan dengan penghasilan lain (kompensasi horizontal), kecuali kerugian dari penghasilan final/non-objek dan kerugian di luar negeri. Kerugian fiskal dapat dikompensasikan selama 5 tahun berturut-turut sejak tahun berikutnya.</p>", "id": "pengawasan_r_32"}, {"heading": "Penyusutan dan Amortisasi (Pasal 11 & 11A)", "p": 0, "html": "<p>Berlaku atas harta berwujud (penyusutan, kecuali tanah berstatus hak milik/HGB/HGU/hak pakai) dan harta tak berwujud (amortisasi) yang masa manfaatnya >1 tahun. Metode: garis lurus (wajib untuk bangunan) atau saldo menurun (untuk bukan bangunan). Bangunan permanen dan harta tak berwujud kelompok 4 dengan masa manfaat >20 tahun: WP dapat memilih masa manfaat 20 tahun atau masa manfaat sebenarnya sesuai pembukuan (berlaku sejak Tahun Pajak 2022).</p>", "id": "pengawasan_r_33"}, {"heading": "Fasilitas Pasal 31E — Pengurangan Tarif 50%", "p": 0, "html": "<p>WP Badan DN dengan peredaran bruto sampai Rp50 miliar mendapat fasilitas pengurangan tarif 50% dari tarif Pasal 17 ayat (1) huruf b, dikenakan atas Penghasilan Kena Pajak dari bagian peredaran bruto sampai Rp4,8 miliar. Fasilitas ini bukan pilihan (otomatis) dan berlaku untuk Subjek Pajak DN kecuali BUT.</p>", "id": "pengawasan_r_34"}, {"heading": "PTKP dan Notasi", "p": 0, "html": "<p>Besaran PTKP: Rp54.000.000 untuk diri WP; +Rp4.500.000 untuk WP kawin; +Rp54.000.000 untuk istri yang penghasilannya digabung; +Rp4.500.000 per tanggungan (maks. 3 orang). Notasi: TK (tidak kawin), K (kawin), K/I (kawin, penghasilan digabung), HB (hidup berpisah, khusus PPh 21).</p>", "id": "pengawasan_r_35"}, {"heading": "PPh Final UMKM 0,5% (PP 55/2022)", "p": 0, "html": "<p>Dikenakan atas penghasilan usaha WP dengan peredaran bruto tidak melebihi Rp4,8 miliar/tahun. Khusus WP OP: bagian peredaran bruto sampai Rp500 juta/Tahun Pajak tidak dikenai PPh (dihitung kumulatif). Jangka waktu pemanfaatan: OP 7 tahun, PT 3 tahun, CV/Firma/Koperasi/BUMDes 4 tahun. Tidak berlaku bagi WP yang memilih tarif umum, mendapat fasilitas Pasal 31A, BUT, atau CV/Firma jasa sejenis pekerjaan bebas yang dibentuk tenaga ahli.</p>", "id": "pengawasan_r_36"}, {"heading": "Natura dan Kenikmatan", "p": 0, "html": "<p>Natura (barang) dan kenikmatan (fasilitas/pelayanan) dari hubungan kerja merupakan objek pajak (taxable) kecuali: makanan/minuman bagi seluruh pegawai; natura/kenikmatan di daerah tertentu; natura/kenikmatan keharusan pekerjaan (K3, seragam); dari APBN/APBD/APBDesa; dan natura/kenikmatan dengan jenis/batasan tertentu sesuai PMK. Biaya natura/kenikmatan tetap dapat dibiayakan sepanjang untuk 3M.</p>", "id": "pengawasan_r_37"}, {"heading": "Norma Penghitungan Penghasilan Neto (NPPN)", "p": 0, "html": "<p>Digunakan bila tidak ada dasar penghitungan yang lebih baik (pembukuan lengkap) atau pembukuan diselenggarakan tidak benar. Hanya untuk WP OP dengan peredaran bruto &lt;Rp4,8 miliar, wajib memberitahukan dalam 3 bulan pertama Tahun Pajak (jika tidak, dianggap memilih pembukuan), dan wajib menyelenggarakan pencatatan penghasilan bruto.</p>", "id": "pengawasan_r_38"}, {"heading": "Subjek PPN: Pengusaha, PKP, dan Pengusaha Kecil", "p": 0, "html": "<p>Pengusaha Kena Pajak (PKP) adalah pengusaha yang melakukan penyerahan BKP/JKP terutang PPN. Pengusaha Kecil: penyerahan BKP/JKP dalam 1 tahun buku ≤ Rp4,8 miliar, tidak wajib PKP. Sejak PMK-164/2023, saat terbit SPPKP tidak selalu sama dengan saat mulai kewajiban pungut/setor/lapor — WP dapat memilih saat mulai kewajiban atau default mulai Masa Pajak pertama tahun buku berikutnya (dengan grace period).</p>", "id": "pengawasan_r_39"}, {"heading": "Objek PPN (Pasal 4 ayat (1))", "p": 0, "html": "<p>Dikenakan atas: penyerahan BKP/JKP di dalam Daerah Pabean, impor BKP, pemanfaatan BKP Tidak Berwujud/JKP dari luar Daerah Pabean, ekspor BKP berwujud/tidak berwujud, dan ekspor JKP. PPN terutang = 11% × DPP (ekspor 0%).</p>", "id": "pengawasan_r_40"}, {"heading": "Kegiatan Membangun Sendiri (Pasal 16C) dan Penyerahan Aktiva Pasal 16D", "p": 0, "html": "<p>KMS: PPN dikenakan atas bangunan yang dibangun sendiri (bukan dalam kegiatan usaha) dengan luas minimal 200m², tarif 20% × 11% × biaya bangun (tidak termasuk tanah), Faktur Pajak kode 09. Pasal 16D: PPN atas penyerahan aktiva yang semula tidak untuk diperjualbelikan oleh PKP, kecuali atas aktiva yang Pajak Masukannya tidak dapat dikreditkan (Pasal 9 ayat (8) huruf b & c).</p>", "id": "pengawasan_r_41"}, {"heading": "Yang Termasuk & Tidak Termasuk Penyerahan BKP (Pasal 1A)", "p": 0, "html": "<p>Termasuk: jual beli, tukar menukar, leasing dengan hak opsi, penyerahan ke pedagang perantara/juru lelang, pemakaian sendiri/pemberian cuma-cuma, BKP sisa saat pembubaran perusahaan, penyerahan pusat-cabang, dan penyerahan berbasis syariah. Tidak termasuk: penyerahan ke makelar, untuk jaminan utang, pemusatan tempat pajak terutang, pengalihan dalam penggabungan/peleburan/pemekaran usaha dengan nilai buku, dan BKP sisa yang PM-nya tidak dapat dikreditkan.</p>", "id": "pengawasan_r_42"}, {"heading": "Bukan BKP dan Bukan JKP (Pasal 4A, sejak UU HPP)", "p": 0, "html": "<p>Bukan BKP sejak UU HPP hanya tersisa: makanan/minuman di hotel/restoran (objek pajak daerah) dan uang/emas batangan untuk cadangan devisa/surat berharga (barang tambang & kebutuhan pokok sudah dihapus dari daftar, kini jadi objek PPN). Bukan JKP tersisa hanya: jasa keagamaan, jasa kesenian & hiburan, jasa perhotelan, jasa pemerintahan umum, jasa penyediaan tempat parkir, dan jasa boga/katering (JKP lain yang sebelumnya dikecualikan kini dihapus dari daftar).</p>", "id": "pengawasan_r_43"}, {"heading": "Tarif PPN dan DPP", "p": 0, "html": "<p>Tarif umum 11% sejak 1 April 2022 (sebelumnya 10%), akan menjadi 12% paling lambat 1 Januari 2025; ekspor tetap 0%. DPP: Harga Jual, Penggantian, Nilai Impor, Nilai Ekspor, atau Nilai Lain (mis. pemakaian sendiri = harga jual dikurangi laba kotor; KMS = 20% dari biaya bangun).</p>", "id": "pengawasan_r_44"}, {"heading": "Saat dan Tempat Terutang PPN", "p": 0, "html": "<p>Prinsip akrual: PPN terutang saat penyerahan BKP/JKP meski pembayaran belum diterima. Jika pembayaran diterima sebelum penyerahan, terutang saat pembayaran. Untuk pemanfaatan BKPTB/JKP dari luar Daerah Pabean, terutang saat dimulainya pemanfaatan (mana yang lebih dulu: digunakan, dinyatakan utang, ditagih, atau dibayar). Tempat terutang: tempat tinggal/kedudukan PKP, kecuali impor (tempat BKP dimasukkan) dan pemusatan tempat terutang.</p>", "id": "pengawasan_r_45"}, {"heading": "Definisi, Fungsi, dan Kewajiban Pembuatan Faktur Pajak", "p": 0, "html": "<p>Faktur Pajak: bukti pungutan PPN yang dibuat PKP (Pasal 1 angka 23 UU PPN), berfungsi sebagai bukti pungutan, tanda pemungutan dari pembeli, dan sarana mengkreditkan PM. Wajib dibuat saat penyerahan BKP/JKP, saat penerimaan pembayaran (jika sebelum penyerahan), atau saat ekspor.</p>", "id": "pengawasan_r_46"}, {"heading": "Faktur Pajak Gabungan", "p": 0, "html": "<p>PKP dapat membuat 1 Faktur Pajak gabungan meliputi seluruh penyerahan ke pembeli yang sama dalam 1 bulan kalender, dibuat paling lama akhir bulan penyerahan. Tidak dapat dibuat atas penyerahan yang mendapat fasilitas PPN tidak dipungut/dibebaskan untuk kawasan tertentu.</p>", "id": "pengawasan_r_47"}, {"heading": "Dokumen Tertentu yang Dipersamakan dengan Faktur Pajak", "p": 0, "html": "<p>Contoh: bukti tagihan jasa telekomunikasi, Pemberitahuan Impor Barang, SSP untuk PPN lelang. Jika dibuat melewati 3 bulan sejak seharusnya dibuat, dianggap tidak membuat dokumen tertentu dan PPN di dalamnya tidak dapat dikreditkan.</p>", "id": "pengawasan_r_48"}, {"heading": "Persyaratan Formal & Material Faktur Pajak", "p": 0, "html": "<p>Formal: diisi benar, lengkap, jelas sesuai Pasal 13 ayat (5)/(6) UU PPN. Material: berisi keterangan yang sebenarnya mengenai penyerahan BKP/JKP. Kedua persyaratan ini juga menjadi syarat PM dapat dikreditkan (Pasal 9 ayat (2b) UU PPN).</p>", "id": "pengawasan_r_49"}, {"heading": "Pengkreditan Pajak Masukan — Prinsip & Saat Pengkreditan", "p": 0, "html": "<p>PM dikreditkan dengan PK dalam Masa Pajak yang sama. PM yang belum dikreditkan dapat dikreditkan di Masa Pajak berikutnya paling lama 3 Masa Pajak setelah berakhirnya Masa Pajak Faktur Pajak dibuat, sepanjang belum dibebankan sebagai biaya/dikapitalisasi.</p>", "id": "pengawasan_r_50"}, {"heading": "Kriteria PM Tidak Dapat Dikreditkan", "p": 0, "html": "<p>Pasal 9 ayat (8): PM atas BKP/JKP tanpa hubungan langsung dengan usaha; perolehan/pemeliharaan kendaraan sedan & station wagon (kecuali barang dagangan/sewa); Faktur Pajak tidak memenuhi syarat formal/tidak mencantumkan identitas pembeli; dan PM atas pemanfaatan BKPTB/JKP luar negeri yang Faktur Pajaknya tidak sesuai ketentuan.</p>", "id": "pengawasan_r_51"}, {"heading": "Pengkreditan PM Sebelum PKP Melakukan Penyerahan & Sebelum Dikukuhkan PKP", "p": 0, "html": "<p>Sebelum penyerahan: PM dapat dikreditkan sepanjang berhubungan langsung dengan penyerahan yang akan dilakukan; jika 3 tahun pertama belum ada penyerahan, PM menjadi tidak dapat dikreditkan (dibatalkan). Sebelum dikukuhkan PKP: menggunakan pedoman deemed PM sebesar 80% dari Pajak Keluaran yang seharusnya dipungut.</p>", "id": "pengawasan_r_52"}, {"heading": "Pengkreditan PM Hasil Pemeriksaan & Ketetapan Pajak", "p": 0, "html": "<p>PM yang ditemukan saat pemeriksaan (tidak dilaporkan dalam SPT) tetap dapat dikreditkan sesuai bukti Faktur Pajak yang dimiliki. PM yang ditagih dengan ketetapan pajak dapat dikreditkan sebesar jumlah pokok PPN dalam ketetapan, dengan syarat telah dilunasi dan tidak diajukan upaya hukum.</p>", "id": "pengawasan_r_53"}, {"heading": "Jenis SPT Masa PPN & Penyetoran", "p": 0, "html": "<p>1111 (PKP umum), 1111DM (PKP pedoman pengkreditan PM), 1107PUT (pemungut PPN selain instansi pemerintah & pihak lain Pasal 32A UU KUP). PPN disetor jika PK > PM, paling lama akhir bulan berikutnya dan sebelum SPT Masa PPN disampaikan.</p>", "id": "pengawasan_r_54"}, {"heading": "Klasifikasi Objek Pajak PBB dan Penetapan NJOP", "p": 0, "html": "<p>PMK-186/PMK.03/2019: Objek PBB diklasifikasikan menjadi sektor Perkebunan, Perhutanan, Pertambangan Migas, Pengusahaan Panas Bumi, Pertambangan Minerba, dan Sektor Lainnya (P5L: perikanan, jaringan pipa/kabel, jalan tol, fasilitas penyimpanan terapung). NJOP ditetapkan Menteri Keuangan berdasarkan hasil penilaian Penilai Pajak; klasifikasi diatur oleh Menteri Keuangan.</p>", "id": "pengawasan_r_55"}, {"heading": "Penetapan NJOP Tubuh Bumi Migas, Pabum, dan Minerba", "p": 0, "html": "<p>Tubuh bumi eksploitasi dinilai dengan Nilai Jual Pengganti = Pendapatan (minyak/gas, uap/listrik, atau bersih minerba) × Angka Kapitalisasi. Tahap eksplorasi ditetapkan sebesar NJOP bumi per m² untuk tubuh bumi eksplorasi (ditetapkan Dirjen Pajak), berbeda dengan tahap eksploitasi/operasi produksi yang dihitung dari pendapatan riil.</p>", "id": "pengawasan_r_56"}, {"heading": "Penyampaian SPOP dan Penerbitan SPPT PBB", "p": 0, "html": "<p>WP wajib menyampaikan/mengembalikan SPOP yang diisi jelas, benar, lengkap, dan dilampiri dokumen pendukung ke KPP; KPP menghitung NJOP dan PBB terutang untuk 1 Tahun Pajak dan menerbitkan SPPT. SPPT dapat diterbitkan ulang jika ada SK Pengurangan/Pembetulan/Keberatan atau Putusan Banding/Gugatan/PK — SPPT sebelumnya dinyatakan tidak berlaku dan SPPT hasil penerbitan kembali tidak dapat diajukan keberatan.</p>", "id": "pengawasan_r_57"}, {"heading": "Pelunasan SPPT dan STP PBB", "p": 0, "html": "<p>SPPT wajib dilunasi selambat-lambatnya 6 bulan sejak tanggal diterima WP. Jika tidak/kurang dibayar setelah jatuh tempo, KPP menerbitkan STP PBB.</p>", "id": "pengawasan_r_58"}, {"heading": "PMK-63/2021 (SIAP) — Pelaksanaan Hak/Kewajiban Secara Elektronik", "p": 0, "html": "<p>Mengatur pelaksanaan hak/kewajiban perpajakan secara elektronik dan nonelektronik melalui Akun WP pada Portal WP, penandatanganan Dokumen Elektronik dengan TTE tersertifikasi/tidak tersertifikasi/Kode Otorisasi DJP, serta kerja sama Menkeu dengan instansi lain untuk pemberian NPWP, KSWP, bupot elektronik, dan pembayaran/pelaporan elektronik.</p>", "id": "pengawasan_r_59"}, {"heading": "Penandatanganan Dokumen Elektronik oleh WP", "p": 0, "html": "<p>Dapat dilakukan oleh WP OP sendiri, wali/pengampu, atau pihak yang ditunjuk; bagi Badan/Instansi Pemerintah/WBT oleh wakil WP atau pihak yang ditunjuk wakil WP. Menggunakan TTE tersertifikasi (dari PSrE), TTE tidak tersertifikasi (Kode Otorisasi DJP), atau pertanyaan validasi identitas melalui Contact Center.</p>", "id": "pengawasan_r_60"}, {"heading": "Mata Uang Dolar AS dalam SPT", "p": 0, "html": "<p>WP Badan dengan izin pembukuan bahasa Inggris & mata uang USD wajib menyampaikan SPT PPh Badan dalam bahasa Indonesia (kecuali lampiran laporan keuangan) dengan satuan USD. Pihak Lain luar Daerah Pabean yang memilih PPN PMSE dalam USD juga mengisi SPT Masa PPN dalam USD.</p>", "id": "pengawasan_r_61"}, {"heading": "Kriteria WP Wajib SPT Tahunan Secara Elektronik", "p": 0, "html": "<p>WP Badan; SPT Lebih Bayar; telah/pernah menyampaikan SPT secara elektronik; terdaftar di KPP selain KPP Pratama; menggunakan jasa konsultan pajak; atau laporan keuangannya diaudit akuntan publik — wajib menyampaikan SPT Tahunan dalam bentuk Dokumen Elektronik.</p>", "id": "pengawasan_r_62"}, {"heading": "Penelitian Surat Pemberitahuan (PMK 243/2014)", "p": 0, "html": "<p>SPT diteliti meliputi: ditandatangani sesuai Pasal 3 ayat (1) UU KUP; bahasa/mata uang sesuai izin; dilampiri keterangan/dokumen lengkap; SPT LB disampaikan dalam 3 tahun dan telah ditegur tertulis; serta disampaikan sebelum pemeriksaan/pemeriksaan bukper/penerbitan SKP. SPT yang tidak memenuhi ketentuan (melalui pos/ekspedisi) dikembalikan & dianggap tidak disampaikan.</p>", "id": "pengawasan_r_63"}, {"heading": "Dianggap Tidak Disampaikan — SPT via Pos/Ekspedisi", "p": 0, "html": "<p>Khusus SPT via pos/ekspedisi, SPT dianggap tidak disampaikan jika: NPWP tidak valid, SPT sudah pernah disampaikan, isi amplop bukan SPT, 1 amplop berisi >1 SPT, tidak ada pembayaran untuk SPT kurang bayar, terdapat kesalahan hitung/jumlah bayar tidak sesuai, atau WP seharusnya wajib SPT elektronik.</p>", "id": "pengawasan_r_64"}, {"heading": "PPh Final Pengalihan Tanah & Bangunan (PMK 261/2016)", "p": 0, "html": "<p>Tarif: 0% untuk pengalihan ke pemerintah/BUMN/BUMD penugasan khusus serta rumah sederhana/rusun sederhana oleh WP usaha pokok PHTB; 1% untuk pengalihan ke pemerintah secara umum; 2,5% untuk PHTB lainnya. Dibayar sendiri sebelum akta ditandatangani (pengalihan ke selain pemerintah) atau dipungut Instansi Pemerintah sebelum membayar kepada OP/Badan (pengalihan ke pemerintah).</p>", "id": "pengawasan_r_65"}, {"heading": "Pengecualian PPh Final PHTB", "p": 0, "html": "<p>Tidak dikenakan atas: OP di bawah PTKP dengan nilai pengalihan &lt;Rp60.000.000 (bukan hasil pemecahan); hibah kepada keluarga sedarah garis lurus satu derajat/badan keagamaan/pendidikan/sosial/UMK; warisan; penggabungan/peleburan/pemekaran usaha dengan nilai buku; dan bangun guna serah/bangun serah guna BMN.</p>", "id": "pengawasan_r_66"}, {"heading": "PPh Final Pengalihan Real Estat ke DIRE/KIK (PMK 37/2017)", "p": 0, "html": "<p>Tarif 0,5% dari jumlah bruto nilai pengalihan Real Estat kepada Special Purpose Company (SPC) atau KIK dalam skema DIRE, bersifat final. Dibayar sendiri sebelum akta ditandatangani, dengan syarat tambahan memenuhi kelengkapan dokumen OJK dan Surat Keterangan Fiskal untuk mendapat tarif 0,5% tersebut.</p>", "id": "pengawasan_r_67"}, {"heading": "Pengertian Hubungan Istimewa", "p": 0, "page": "hlm 738", "html": "<p>Hubungan Istimewa (Pasal 2 PMK 172/2023) adalah keadaan <strong>ketergantungan atau keterikatan</strong> satu pihak dengan pihak lain, di mana satu/lebih pihak mengendalikan pihak lain atau tidak berdiri bebas. Disebabkan oleh:</p><ul><li><strong>Kepemilikan/penyertaan modal</strong>: penyertaan langsung/tidak langsung paling rendah 25%, atau hubungan dua WP dengan penyertaan 25% pada pihak ketiga yang sama</li><li><strong>Penguasaan</strong>: menguasai/dikuasai pihak lain (langsung/tidak langsung), berada di bawah penguasaan yang sama, melalui manajemen/teknologi, orang yang sama terlibat pengambilan keputusan, satu Grup Usaha, atau menyatakan diri memiliki hubungan istimewa</li><li><strong>Keluarga sedarah atau semenda</strong>: garis keturunan lurus dan/atau ke samping satu derajat</li></ul>", "id": "pengawasan_r_68"}, {"heading": "Prinsip Kewajaran dan Kelaziman Usaha (PKKU)", "p": 0, "page": "hlm 739", "html": "<p>PKKU (Pasal 3) <strong>wajib diterapkan</strong> WP dalam pelaksanaan hak dan kewajiban perpajakan terkait Transaksi yang Dipengaruhi Hubungan Istimewa. Tujuannya menentukan <strong>Harga Transfer wajar</strong>, dengan cara membandingkan kondisi dan indikator harga Transaksi Afiliasi dengan Transaksi Independen yang sebanding. Harga transfer memenuhi PKKU jika nilai indikator harganya <strong>sama dengan</strong> nilai indikator harga Transaksi Independen pembanding. Indikator harga dapat berupa harga transaksi, laba kotor, atau laba bersih operasi.</p>", "id": "pengawasan_r_69"}, {"heading": "Kewajiban Penerapan PKKU: Terpisah vs Digabungkan", "p": 0, "page": "hlm 741", "html": "<p>Pasal 4: Penerapan PKKU wajib dilakukan berdasarkan keadaan sebenarnya, pada saat Penentuan Harga Transfer dan/atau saat terjadinya transaksi, sesuai tahapan.</p><ul><li><strong>Terpisah</strong>: dilakukan untuk setiap jenis Transaksi Afiliasi secara sendiri-sendiri</li><li><strong>Digabungkan</strong>: jika dua/lebih jenis transaksi saling berkaitan dan mempengaruhi satu sama lain dalam penentuan Harga Transfer sehingga penerapan terpisah tidak andal/akurat</li></ul>", "id": "pengawasan_r_70"}, {"heading": "Enam Tahapan Penerapan PKKU", "p": 0, "page": "hlm 742", "html": "<p>Pasal 4 menetapkan 6 tahapan berurutan penerapan PKKU:</p><ol><li>Mengidentifikasi Transaksi Afiliasi dan Pihak Afiliasi</li><li>Melakukan analisis industri</li><li>Mengidentifikasi hubungan komersial/keuangan (analisis kondisi transaksi)</li><li>Melakukan analisis kesebandingan</li><li>Menentukan metode Penentuan Harga Transfer</li><li>Menerapkan metode dan menentukan Harga Transfer wajar</li></ol><p>Untuk Transaksi Afiliasi tertentu, wajib didahului dengan <strong>tahapan pendahuluan</strong>.</p>", "id": "pengawasan_r_71"}, {"heading": "Tahap 1: Identifikasi Transaksi dan Pihak Afiliasi", "p": 0, "page": "hlm 743", "html": "<p>Pasal 5: kegiatan mengidentifikasi (a) Transaksi Afiliasi yang dilakukan WP; (b) pihak-pihak yang terlibat; dan (c) bentuk hubungan istimewa.</p>", "id": "pengawasan_r_72"}, {"heading": "Tahap 2: Analisis Industri", "p": 0, "page": "hlm 743", "html": "<p>Pasal 6: mengidentifikasi faktor jenis produk, karakteristik industri &amp; pasar (pertumbuhan, segmentasi, siklus, teknologi, ukuran, prospek, rantai pasokan/nilai), pesaing, efisiensi &amp; lokasi WP, keadaan ekonomi (inflasi, pertumbuhan, suku bunga, kurs), regulasi, dan faktor lain. Hasilnya dipakai mengidentifikasi perbedaan kondisi saat analisis kesebandingan.</p>", "id": "pengawasan_r_73"}, {"heading": "Tahap 3: Analisis Kondisi Transaksi — 5 Faktor Kesebandingan", "p": 0, "page": "hlm 744", "html": "<p>Pasal 7: kondisi transaksi adalah karakteristik ekonomi yang relevan, terdiri dari 5 faktor:</p><ol><li><strong>Ketentuan Kontraktual</strong>: tertulis/tidak tertulis sesuai keadaan sebenarnya</li><li><strong>Fungsi, Aset, dan Risiko</strong>: aktivitas/tanggung jawab, aset berwujud/tidak berwujud/keuangan, dan dampak ketidakpastian yang ditanggung</li><li><strong>Karakteristik Produk</strong>: spesifik barang/jasa yang mempengaruhi harga</li><li><strong>Strategi Bisnis</strong>: strategi di pasar terbuka</li><li><strong>Keadaan Ekonomi</strong>: kondisi para pihak dan pasar bertransaksi</li></ol>", "id": "pengawasan_r_74"}, {"heading": "Tahap 4: Analisis Kesebandingan", "p": 0, "page": "hlm 745-747", "html": "<p>Pasal 8: menentukan kesebandingan Transaksi Independen dengan Transaksi Afiliasi. Suatu transaksi <strong>sebanding</strong> jika kondisinya sama/serupa, atau berbeda tetapi tidak mempengaruhi harga, atau berbeda tapi dapat disesuaikan secara memadai. Tahapannya: memahami karakteristik transaksi, mengidentifikasi calon pembanding, menentukan pihak yang diuji (fungsi/aset/risiko paling sederhana), identifikasi perbedaan kondisi, penyesuaian, dan menentukan pembanding terpilih.</p><p><strong>Hierarki pembanding</strong>: Pembanding Internal (transaksi WP dengan pihak independen) diutamakan di atas Pembanding Eksternal jika tingkat kesebandingan dan keandalan sama; jika tersedia beberapa pembanding eksternal setara, pembanding dari <strong>jurisdiksi yang sama</strong> dipilih.</p>", "id": "pengawasan_r_75"}, {"heading": "Tahap 5-6: Delapan Metode Penentuan Harga Transfer", "p": 0, "page": "hlm 748-752", "html": "<p>Pasal 9-10, 8 metode yang dapat digunakan:</p><ol><li><strong>CUP</strong> (Comparable Uncontrolled Price) — perbandingan harga pihak independen, sesuai untuk komoditas</li><li><strong>RPM</strong> (Resale Price Method) — harga penjualan kembali, untuk distributor/reseller</li><li><strong>CPM</strong> (Cost Plus Method) — biaya-plus, untuk pabrikan/penyedia jasa</li><li><strong>PSM</strong> (Profit Split Method) — pembagian laba, untuk transaksi dengan kontribusi unik & terintegrasi tinggi</li><li><strong>TNMM</strong> (Transactional Net Margin Method) — laba bersih transaksional</li><li><strong>CUT</strong> (Comparable Uncontrolled Transaction) — perbandingan transaksi independen</li><li><strong>Penilaian harta berwujud/tidak berwujud</strong></li><li><strong>Penilaian bisnis</strong></li></ol><p><strong>Hierarki pemilihan</strong>: jika CUP dan metode lain memiliki keandalan setara, <strong>CUP diutamakan</strong>; jika CPM, RPM, PSM, TNMM memiliki keandalan setara, <strong>CPM dan RPM diutamakan</strong> di atas PSM/TNMM.</p>", "id": "pengawasan_r_76"}, {"heading": "Metode Pembagian Laba (Profit Split Method)", "p": 0, "page": "hlm 753", "html": "<p>Pasal 11: pembagian laba gabungan dapat di tingkat laba kotor atau laba operasi bersih, ditentukan oleh tingkat integrasi fungsi, aset, dan risiko. Dua pendekatan:</p><ul><li><strong>Pendekatan berbasis kontribusi (contribution analysis)</strong>: laba gabungan dibagi berdasarkan faktor pembagi</li><li><strong>Pendekatan berbasis laba residu (residual analysis)</strong>: laba gabungan dipisah jadi (a) laba dari kontribusi masing-masing pihak yang dapat dibandingkan andal, dan (b) sisa laba gabungan (dapat positif/negatif) dibagi berdasarkan faktor pembagi</li></ul><p>Faktor pembagi harus bebas dari Transaksi Afiliasi, dapat diverifikasi, dan didukung data relevan.</p>", "id": "pengawasan_r_77"}, {"heading": "Penentuan Harga Transfer yang Wajar", "p": 0, "page": "hlm 754", "html": "<p>Pasal 12: nilai indikator harga Transaksi Independen dapat berupa <strong>titik kewajaran</strong> (arm's length point) atau <strong>rentang kewajaran</strong> (arm's length range).</p><ul><li>Titik kewajaran: dari pembanding dengan nilai indikator harga yang sama</li><li>Rentang kewajaran: dari pembanding dengan nilai berbeda — <strong>full range</strong> (minimum-maksimum) jika dari 2 pembanding; <strong>interquartile range</strong> (kuartil 1-3) jika dari 3+ pembanding</li></ul><p>Jika Harga Transfer tidak memenuhi PKKU, penentuan menggunakan titik kewajaran, titik paling tepat di rentang, atau median jika titik paling tepat tidak dapat ditentukan.</p>", "id": "pengawasan_r_78"}, {"heading": "Tahapan Pendahuluan untuk Transaksi Afiliasi Tertentu", "p": 0, "page": "hlm 757-764", "html": "<p>Pasal 13: untuk 7 jenis transaksi tertentu, PKKU wajib didahului tahapan pendahuluan berupa pembuktian, sebelum tahapan penerapan PKKU biasa:</p><ul><li><strong>Transaksi jasa</strong>: nyata diberikan & dibutuhkan, memberi manfaat ekonomis (benefit test), bukan shareholder activity, bukan passive association, bukan duplikasi, bukan manfaat insidental</li><li><strong>Harta tidak berwujud</strong>: eksistensi, jenis, nilai, pemilik legal & ekonomis, hak penggunaan, kontribusi DEMPE (development, enhancement, maintenance, protection, exploitation)</li><li><strong>Keuangan terkait pinjaman</strong>: sesuai substansi, dibutuhkan peminjam, memenuhi karakteristik pinjaman (jatuh tempo, kewajiban bayar kembali, kemampuan bayar, dll)</li><li><strong>Keuangan lainnya, pengalihan harta, restrukturisasi usaha, kesepakatan kontribusi biaya</strong>: masing-masing dengan pembuktian motif ekonomis, substansi, dan manfaat yang diharapkan (expected benefit)</li></ul><p>Jika WP <strong>tidak dapat membuktikan</strong> tahapan pendahuluan, transaksi tersebut dianggap <strong>tidak memenuhi PKKU</strong>.</p>", "id": "pengawasan_r_79"}, {"heading": "Penerapan PKKU atas WPDN yang Memenuhi Ketentuan BUT", "p": 0, "page": "hlm 765", "html": "<p>Pasal 14: jika transaksi WP yang ditentukan oleh pihak afiliasinya memenuhi ketentuan sebagai BUT, WP tersebut juga ditetapkan sebagai BUT. BUT wajib menyampaikan seluruh data/informasi terkait transaksi Pihak Afiliasi di luar negeri; jika tidak disampaikan, nilai transaksi ditentukan dengan menerapkan PKKU. Pemenuhan kewajiban WPDN sebelumnya diperhitungkan dalam pemenuhan kewajiban BUT.</p>", "id": "pengawasan_r_80"}, {"heading": "Proses Bisnis Pengawasan per PMK-111/2025", "p": 0, "page": "hlm 767", "html": "<p>PMK-111/2025 membagi proses bisnis Pengawasan menjadi 3 jalur:</p><ul><li><strong>WP Terdaftar</strong>: SP2DK, Surat Imbauan (pengukuhan PKP, pembayaran, pelaporan, angsuran, fasilitas, kewajiban formal), atau Surat Teguran (SPT terlambat, pelanggaran ketentuan)</li><li><strong>WP Belum Terdaftar</strong>: SP2DK → SPHPP (jalur Ekstensifikasi)</li><li><strong>Pengawasan Wilayah</strong>: Kegiatan Pengumpulan Data (pengamatan, wawancara, geotagging, pengambilan gambar)</li></ul>", "id": "pengawasan_r_81"}, {"heading": "Persandingan Alur PMK Pengawasan dan PMK Pemeriksaan", "p": 0, "page": "hlm 768", "html": "<p>Terdapat 2 jalur paralel (DPE = Digital/Elektronik, DPP = manual/konvensional):</p><ul><li><strong>Step 1</strong>: Surat Perintah Pengawasan → LHPtE/LHPt (mirip SP2 → S.Pemb Pemeriksaan)</li><li><strong>Step 2</strong>: SP2DKE/SP2DK dan SPHPP → Tanggapan WP → Undangan Pembahasan Akhir → BAP2DKE/BAP2DK → LHP2DKE/LHP2DK (bersanding dengan SPHP → Tanggapan → Undangan PAHP → Risalah/Ikhtisar PAHP → KKP → LHP pada jalur Pemeriksaan PMK-15/2025)</li></ul>", "id": "pengawasan_r_82"}, {"heading": "Ruang Lingkup Kegiatan Ekstensifikasi 2026", "p": 0, "page": "hlm 770", "html": "<p>Kegiatan Ekstensifikasi 2026 terfokus pada <strong>Aktivasi WP</strong>, mencakup 2 kategori:</p><ul><li><strong>WP Baru</strong>: melalui DPE (Daftar Prioritas Ekstensifikasi) dan KPD</li><li><strong>WP NA (Non-Aktif)</strong>: melalui NA TD (Non-Aktif Terdapat Data) dan KPD</li></ul>", "id": "pengawasan_r_83"}, {"heading": "Gambaran Umum Proses Bisnis Pengawasan WP Belum Ber-NPWP", "p": 0, "page": "hlm 768", "html": "<p>Terdiri 4 tahap: <strong>I. Perencanaan Ekstensifikasi</strong> (analisis data KM/CRM/BI via Komite Kepatuhan → DPE, risiko High/Medium → Analisis/Penelitian Potensi, risiko Low → Edukasi); <strong>II. Pelaksanaan</strong> (SP2DK → penyampaian → monitor tanggapan → SPHP → jika masih ada potensi → undangan pembahasan akhir → BAP2DK → LHP2DK); <strong>III. Tindak Lanjut</strong> (Probis Registrasi/Pemeriksaan/Intelijen Perpajakan); <strong>IV. Monitoring dan Evaluasi</strong> membentang di seluruh tahap.</p>", "id": "pengawasan_r_84"}, {"heading": "Penugasan Tim Ekstensifikasi", "p": 0, "page": "hlm 771", "html": "<p>Kepala Seksi Pengawasan meng-<em>assign case</em> ke Petugas Ekstensifikasi (2 orang) berdasarkan rekomendasi HRIS sesuai kompleksitas kasus. Kepala KPP menerbitkan Surat Perintah Pengawasan (SPP). Tim ekstensifikasi terdiri dari: Kepala Seksi Pengawasan (Supervisor), 1 AR pengampu/Kepala KP2KP (Ketua Tim), dan 1 AR lain dalam seksi yang sama (Anggota Tim).</p>", "id": "pengawasan_r_85"}, {"heading": "Penyusunan dan Penyampaian SP2DK", "p": 0, "page": "hlm 772", "html": "<p>SP2DK berisi: (1) penjelasan pelaksanaan kewajiban perpajakan, (2) permintaan penjelasan data/informasi DJP terkait Income, Cost, Asset, Liability, Equity, (3) jangka waktu <strong>14 hari kalender</strong> untuk tanggapan. SP2DK risiko tinggi disampaikan oleh Fungsional Penyuluh; risiko sedang/rendah oleh Tim Ekstensifikasi. Disampaikan melalui: Portal WP, Pos/Kurir, atau Visit (kunjungan) ke lokasi WP.</p>", "id": "pengawasan_r_86"}, {"heading": "Jangka Waktu Tanggapan WP atas SP2DK", "p": 0, "page": "hlm 775-777", "html": "<p>WP diberi waktu <strong>14 hari</strong> sejak peristiwa yang lebih dahulu terjadi (tanggal penerbitan/aktivasi akun WP, bukti kirim pos, atau penyampaian langsung) untuk menanggapi dengan memenuhi kewajiban dan/atau menyampaikan penjelasan. WP dapat mengajukan <strong>perpanjangan maksimal 7 hari</strong> secara tertulis, yang harus diterima KPP sebelum jangka waktu 14 hari berakhir. WP dapat menyampaikan tanggapan <strong>lebih dari 1 kali</strong>. Jika WP tidak setuju sebagian/seluruh data dalam SP2DK, penjelasan harus disertai bukti/dokumen pendukung.</p>", "id": "pengawasan_r_87"}, {"heading": "Penyusunan SPHPP (Surat Pemberitahuan Hasil Pengujian/Pengawasan)", "p": 0, "page": "hlm 781-783", "html": "<p>Tim Ekstensifikasi memonitor tanggapan WP lalu melakukan penelitian potensi pajak menggunakan <em>Examination Working Sheet</em> (EWS) untuk masa pajak maksimal <strong>5 tahun sebelum tahun berjalan</strong> pelaksanaan ekstensifikasi, mencakup akun pajak sesuai SPT, penghitungan versi WP vs petugas, dan selisih (nilai potensi). Hasilnya: (a) jika ada indikasi kewajiban dengan jumlah pajak → SPHPP + Surat Undangan Pembahasan; (b) jika tidak ada indikasi → SPHPP langsung menuju BAP2DK.</p>", "id": "pengawasan_r_88"}, {"heading": "Pembahasan dengan WP (Ekstensifikasi)", "p": 0, "page": "hlm 785", "html": "<p>Pembahasan dilakukan secara luring atau daring (video conference), dapat melibatkan pegawai DJP lain yang ditugaskan. WP dapat memberikan tanggapan atas penghitungan dan informasi lain disertai bukti/dokumen pendukung. Jika <strong>WP tidak hadir</strong>, pembahasan dianggap telah dilaksanakan dan kewajiban perpajakan yang masih harus dipenuhi WP dihitung sendiri oleh DJP. Hasil pembahasan dituangkan dalam BAP2DK.</p>", "id": "pengawasan_r_89"}, {"heading": "Penyusunan dan Penandatanganan BAP2DK", "p": 0, "page": "hlm 787-790", "html": "<p>BAP2DK berisi informasi penyampaian SP2DK, data profil WP, tanggapan WP, simpulan akhir, dan hasil penghitungan potensi. Ditandatangani WP dan AR/pegawai DJP. BAP2DK disampaikan via Akun WP, pos/kurir, atau langsung saat WP hadir pembahasan. Jika WP tidak bisa tanda tangan elektronik (TTE), WP mengirim kembali konsep BAP2DK yang sudah ditandatangani maksimal <strong>5 hari kerja</strong> sejak konsep dikirim; jika tidak dikembalikan, WP dianggap menghadiri pembahasan namun tidak bersedia menandatangani BAP2DK.</p>", "id": "pengawasan_r_90"}, {"heading": "Hasil Kegiatan P2DK dan Penyusunan LHP2DK", "p": 0, "page": "hlm 786, 791", "html": "<p>Hasil kegiatan P2DK dapat berupa: pemberian NPWP/NITKU secara jabatan, usulan pengukuhan PKP jabatan, pendaftaran objek PBB jabatan, pembatasan/pemblokiran layanan publik, usulan pemeriksaan, atau pengembangan &amp; analisis data (jika ada indikasi pidana perpajakan). LHP2DK memuat informasi profil WP, penyampaian SP2DK, hasil klarifikasi, indikasi kewajiban yang masih harus dibayar, tanggapan WP, dan rekomendasi tindak lanjut (case closed / usul IDLP / usul Pemeriksaan / pengukuhan PKP jabatan / pendaftaran PBB jabatan / input form KPD).</p>", "id": "pengawasan_r_91"}, {"heading": "Dasar Hukum dan Kriteria WP Non-Aktif", "p": 0, "page": "hlm 793-794", "html": "<p>Dasar hukum: UU 6/1983 s.t.d.d UU 7/2021 (HPP) dan <strong>PER-07/PJ/2025</strong>. Kriteria WP Non-Aktif (8 kriteria, a-h): WP OP usaha/pekerjaan bebas berhenti tidak penuhi syarat objektif; WP OP tanpa usaha tidak penuhi syarat objektif/penghasilan di bawah PTKP; WP OP WNI berniat jadi SPLN tapi belum penuhi syarat; WP OP WNI sudah jadi SPLN; WP OP wanita kawin pilih gabung suami tapi masih punya NIK; WP Badan tidak penuhi syarat subjektif/objektif tapi belum dihapus NPWP-nya; Instansi Pemerintah tidak penuhi syarat pemotong/pemungut tapi belum dihapus NPWP.</p>", "id": "pengawasan_r_92"}, {"heading": "Penetapan WP Non-Aktif Secara Jabatan", "p": 0, "page": "hlm 795", "html": "<p>Berdasarkan PER-7/PJ/2025, WP ditetapkan Non-Aktif secara jabatan jika memenuhi 6 kriteria sekaligus: (a) tidak melaporkan SPT Masa/Tahunan berturut-turut 5 tahun terakhir; (b) tidak dipotong/dipungut pihak ketiga berturut-turut 5 tahun terakhir; (c) tidak melakukan pembayaran pajak berturut-turut 5 tahun terakhir; (d) tidak memiliki tunggakan pajak dan/atau tidak sedang melakukan upaya hukum; (e) tidak sedang dilakukan pemeriksaan pajak/bukper/penyidikan; (f) tidak mendapatkan fasilitas/insentif perpajakan.</p>", "id": "pengawasan_r_93"}, {"heading": "Imbauan Massal dan Pengaktifan Kembali WP Non-Aktif Otomatis", "p": 0, "page": "hlm 797-798", "html": "<p>PMK 111/2025 memungkinkan pengawasan otomatis via sistem informasi (Surat Teguran/Imbauan Massal), termasuk program prioritas <strong>NATD</strong> (WP Non-Aktif Terdapat Data). Proses: Penyusunan Daftar Nominatif & penerbitan Imbauan oleh Kantor Pusat DJP → disampaikan via Akun WP/Email/pos/kunjungan → Tanggapan WP → case closed atau lanjut Teguran/SP2DK. Pengaktifan kembali WP Non-Efektif (NE) otomatis <em>by system</em> (SE-27/PJ/2020) terjadi saat pelaporan SPT dengan kriteria: formulir 1770S/1770SS, tidak lewat batas waktu, bukan SPT pembetulan, menyatakan nihil/kurang bayar, dan tidak disampaikan dalam bentuk e-SPT.</p>", "id": "pengawasan_r_94"}, {"heading": "Kewenangan, Tujuan, dan Tipe Pemeriksaan (PMK 15/2025)", "p": 0, "page": "hlm 800-802", "html": "<p>Dirjen Pajak berwenang melakukan Pemeriksaan untuk (1) menguji kepatuhan dan (2) tujuan lain, dengan kewenangan dilimpahkan secara delegasi ke pejabat DJP. Tiga tipe pemeriksaan:</p><ul><li><strong>Pemeriksaan Lengkap</strong>: mencakup seluruh pos dalam SPT/SPOP secara mendalam</li><li><strong>Pemeriksaan Terfokus</strong>: satu/beberapa pos secara mendalam</li><li><strong>Pemeriksaan Spesifik</strong>: satu/beberapa pos secara sederhana (termasuk pemeriksaan atas data konkret)</li></ul>", "id": "pengawasan_r_95"}, {"heading": "Kriteria Pemeriksaan untuk Menguji Kepatuhan", "p": 0, "page": "hlm 803, 816", "html": "<p>Pasal 4 PMK 15/2025, pemeriksaan uji kepatuhan dilakukan dalam 14 kriteria (a-n), antara lain: pengembalian LB Pasal 17B KUP, SPT LB selain Pasal 17B, SPT menyatakan rugi, telah diberikan pengembalian pendahuluan, perubahan tahun buku/metode pembukuan, penilaian kembali aktiva tetap, WP merger/likuidasi/bubar/tinggalkan Indonesia selamanya, PKP tidak serahkan BKP/JKP tapi sudah restitusi (Pasal 9 ayat 6e UU PPN), WP terpilih berdasarkan risiko kepatuhan, pihak lain tidak laksanakan kewajiban potput (Pasal 32A UU KUP — kriteria baru), terdapat data konkret, WP tidak sampaikan SPOP, dan indikasi PBB lebih besar dari SPOP.</p>", "id": "pengawasan_r_96"}, {"heading": "Kriteria Pemeriksaan untuk Tujuan Lain", "p": 0, "page": "hlm 804", "html": "<p>Pasal 4 PMK 15/2025 menetapkan 25 kriteria (a-y) pemeriksaan tujuan lain, di antaranya: pemberian/penghapusan NPWP secara jabatan, pengukuhan/pencabutan PKP, pendaftaran objek PBB jabatan, penyelesaian keberatan, pencocokan data, penentuan tempat terutang PPN, penyelesaian penagihan, pemberian fasilitas perpajakan, pertukaran informasi internasional, penyelesaian MAP, permohonan APA, pengujian UU Akses Informasi Keuangan, penetapan biaya eksplorasi, pemeriksaan fisik endorsement, perluasan basis data, dan pengujian pihak lain atas kewajiban Pasal 32A UU KUP. Banyak kriteria ditandai label &ldquo;NEW&rdquo; sebagai ketentuan yang baru ditambahkan.</p>", "id": "pengawasan_r_97"}, {"heading": "Jangka Waktu Pemeriksaan", "p": 0, "page": "hlm 806-807", "html": "<p>Untuk uji kepatuhan, dihitung sejak Surat Pemberitahuan Pemeriksaan disampaikan — <strong>jangka waktu pengujian</strong>: Lengkap 5 bulan, Terfokus 3 bulan, Spesifik 1 bulan, Dakon (data konkret) 10 hari kerja. <strong>Jangka waktu PAHP &amp; pelaporan</strong> (sejak SPHP disampaikan): Lengkap/Terfokus/Spesifik 30 hari kerja, Dakon 10 hari kerja. Untuk pemeriksaan <strong>Tujuan Lain</strong>, jangka waktu paling lama <strong>4 bulan</strong> sejak Surat Pemberitahuan Pemeriksaan disampaikan. WP K3S Migas mengikuti pedoman pemeriksaan bersama atas kontrak kerja sama (PSC Cost Recovery).</p>", "id": "pengawasan_r_98"}, {"heading": "Pemeriksaan PBB", "p": 0, "page": "hlm 808-809", "html": "<p>Kriteria pemeriksaan uji kepatuhan PBB sama dengan kriteria umum ditambah: WP tidak menyampaikan SPOP setelah ditegur, dan terdapat indikasi PBB lebih besar dari yang dihitung dari SPOP. Terbagi dua: <strong>Pemeriksaan Rutin</strong> berdasarkan Daftar Nominatif, dan <strong>Pemeriksaan Khusus</strong> berdasarkan Jalur Proses (Jopro) CRM PBB (misal sektor batubara).</p>", "id": "pengawasan_r_99"}, {"heading": "Siklus Penatausahaan PBB P5L", "p": 0, "page": "hlm 809", "html": "<p>Alur: WP lapor SPOP via CoreTax → Penelitian Material (sesuai → lanjut Penilaian; belum sesuai → Surat Teguran 7 hari → Klarifikasi → Pembetulan SPOP 7 hari) → Penilaian (Kantor 5 hari / Lapangan 15 hari) → Penetapan NJOP → SPPT. Jika teguran tidak ditanggapi → Anris Pemeriksaan → <strong>Pemeriksaan PBB</strong> → SKP PBB. Auto creation SPOP: Periode I (Kebun, Migas, Pabum) 1 Februari; Periode II (Hutan, Minerba, Lainnya) 31 Maret.</p>", "id": "pengawasan_r_100"}, {"heading": "Bantuan Ahli dalam Pemeriksaan", "p": 0, "page": "hlm 811", "html": "<p>Tim Pemeriksa Pajak dapat dibantu satu/lebih ahli tertentu dari dalam/luar DJP berdasarkan Surat Tugas Membantu Pelaksanaan Pemeriksaan. Khusus Pemeriksaan PBB, Kepala UP2 melibatkan <strong>Penilai Pajak</strong> sebagai pihak berkeahlian khusus untuk menetapkan NJOP — baik sebagai Bantuan Peni
