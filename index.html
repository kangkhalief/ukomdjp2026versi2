uan Pajak Terhutang (SPPT)"], "c": 0, "e": "Tiga jenis Data Konkret: Faktur Pajak yang disetujui sistem tapi belum/tidak dilaporkan dalam SPT Masa PPN, Bukti Potput PPh yang belum/tidak dilaporkan penerbitnya, dan Bukti Transaksi/Data Perpajakan.", "p": 0, "topic": "Pemeriksaan", "id": "pengawasan_q_124"}, {"q": "Bukti Transaksi/Data Perpajakan sebagai salah satu jenis Data Konkret dapat berupa hal-hal berikut, KECUALI...", "o": ["Kelebihan kompensasi pada SPT Masa PPN yang tidak didukung kelebihan bayar pada SPT Masa PPN sebelumnya", "Penghasilan yang tidak atau kurang dilaporkan berdasarkan data bukti potong yang dimiliki DJP", "Keputusan pengangkatan pejabat struktural DJP", "Data dan/atau keterangan yang bersumber dari ketetapan/putusan sengketa perpajakan yang bersifat inkrah"], "c": 2, "e": "Keputusan pengangkatan pejabat struktural DJP bukan termasuk Bukti Transaksi/Data Perpajakan dalam definisi Data Konkret Pasal 2 ayat (1) huruf c PER-18/PJ/2025.", "p": 0, "topic": "Pemeriksaan", "id": "pengawasan_q_125"}, {"q": "LHP2DK dalam proses Pengawasan berpeluang menjadi salah satu bentuk Data Konkret apabila...", "o": ["WP mengajukan keberatan atas LHP2DK", "Data dan/atau keterangan telah diterbitkan surat permintaan penjelasan dan dibuat BA yang disetujui WP, namun pemenuhan kewajiban perpajakan belum/tidak dipenuhi sampai batas waktu yang disetujui", "LHP2DK diterbitkan lebih dari 1 tahun yang lalu", "WP menyatakan tidak keberatan secara lisan"], "c": 1, "e": "Bukti transaksi/data perpajakan huruf h mensyaratkan: telah diterbitkan surat permintaan penjelasan dan dibuat BA yang memuat persetujuan WP, namun pemenuhan kewajiban belum/tidak dipenuhi sampai batas waktu yang disetujui — LHP2DK dalam Pengawasan berpeluang masuk kategori ini.", "p": 0, "topic": "Pemeriksaan", "id": "pengawasan_q_126"}, {"q": "Tim Pemeriksa Pajak yang terdiri dari Pejabat Fungsional Pemeriksa Pajak bertanggung jawab atas pemeriksaan jenis apa?", "o": ["Pemeriksaan PBB saja", "Pemeriksaan restitusi PPN tahun berjalan, ruang lingkup seluruh jenis pajak, dan pemeriksaan ulang", "Pemeriksaan khusus berdasarkan data konkret saja", "Pemeriksaan SPT Masa Pengungkapan Aset Sukarela"], "c": 1, "e": "Tim dengan Pejabat Fungsional Pemeriksa Pajak bertanggung jawab atas pemeriksaan restitusi PPN tahun berjalan, pemeriksaan ruang lingkup seluruh jenis pajak, dan pemeriksaan ulang.", "p": 0, "topic": "Pemeriksaan", "id": "pengawasan_q_127"}, {"q": "Manakah yang BUKAN termasuk kriteria Pemeriksaan Efektif menurut SE-15/PJ/2018?", "o": ["Pemeriksaan selesai dan pencairan optimal", "Upaya hukum minimal", "Jumlah pemeriksaan sebanyak-banyaknya tanpa memperhatikan kualitas", "Menciptakan kepatuhan berkelanjutan"], "c": 2, "e": "Empat kriteria pemeriksaan efektif adalah: pemeriksaan selesai & pencairan optimal, upaya hukum minimal, restitusi terkendali, dan menciptakan kepatuhan berkelanjutan — bukan sekadar jumlah pemeriksaan sebanyak-banyaknya.", "p": 0, "topic": "Pemeriksaan", "id": "pengawasan_q_128"}, {"q": "Pemeriksaan khusus berdasarkan data konkret atas WP Strategis untuk tahun pajak berjalan dapat diusulkan apabila...", "o": ["Telah dilakukan penelitian satu/beberapa jenis pajak dan/atau satu/beberapa masa pajak serta kegiatan P2DK selesai", "WP mengajukan permohonan secara sukarela", "Tanpa syarat apapun, dapat langsung diusulkan", "Hanya dapat diusulkan untuk tahun pajak sebelumnya"], "c": 0, "e": "Untuk tahun pajak berjalan, pemeriksaan atas WP Strategis berdasarkan data konkret dapat diusulkan setelah dilakukan penelitian satu/beberapa jenis pajak dan/atau satu/beberapa masa pajak serta kegiatan P2DK selesai.", "p": 0, "topic": "Pemeriksaan", "id": "pengawasan_q_129"}, {"q": "Pemeriksaan khusus berdasarkan analisis risiko (baik satu/beberapa jenis pajak maupun all taxes) atas WP Strategis untuk TAHUN PAJAK BERJALAN...", "o": ["Dapat diusulkan tanpa syarat", "Tidak dapat diusulkan", "Dapat diusulkan hanya dengan persetujuan Dirjen Pajak", "Dapat diusulkan setelah penelitian sederhana"], "c": 1, "e": "Untuk tahun pajak berjalan, pemeriksaan khusus berdasarkan analisis risiko atas WP Strategis — baik satu/beberapa jenis pajak maupun all taxes — TIDAK DAPAT diusulkan; hanya dapat diusulkan untuk tahun pajak sebelum tahun berjalan dengan penelitian komprehensif dan P2DK selesai.", "p": 0, "topic": "Pemeriksaan", "id": "pengawasan_q_130"}, {"q": "Penggalian potensi pajak dalam tahun berjalan pada setiap KPP hanya dapat dilakukan terhadap Wajib Pajak yang...", "o": ["Telah terdapat dalam Daftar Sasaran Penggalian Potensi Pajak (DSP3)", "Memiliki NPWP aktif lebih dari 5 tahun", "Mengajukan permohonan pemeriksaan sendiri", "Berlokasi di wilayah kerja KPP Pratama"], "c": 0, "e": "Penggalian potensi dalam tahun berjalan pada setiap KPP hanya dapat dilakukan terhadap WP yang telah terdapat dalam DSP3, kecuali KPP memperoleh keterangan lain berupa data konkret yang dapat ditindaklanjuti tersendiri.", "p": 0, "topic": "Pemeriksaan", "id": "pengawasan_q_131"}, {"q": "Kepala KPP bertanggung jawab atas penerbitan persetujuan/penugasan pemeriksaan untuk hal-hal berikut, KECUALI...", "o": ["Penugasan pemeriksaan rutin berdasarkan Daftar Nominatif", "Persetujuan pemeriksaan khusus berdasarkan keterangan lain berupa data konkret", "Penugasan pemeriksaan tujuan lain yang bersifat administratif", "Penetapan sanksi pidana perpajakan"], "c": 3, "e": "Penetapan sanksi pidana perpajakan bukan kewenangan persetujuan pemeriksaan Kepala KPP, melainkan ranah penyidikan dan proses hukum pidana.", "p": 0, "topic": "Pemeriksaan", "id": "pengawasan_q_132"}, {"q": "Tujuan utama kegiatan pengumpulan data lapangan (KPDL) menurut SE-11/PJ/2020 mencakup hal-hal berikut, KECUALI...", "o": ["Memperoleh data/informasi baru terkait Wajib Pajak dan potensi pajak", "Menindaklanjuti dan/atau memutakhirkan data/informasi yang telah dimiliki DJP", "Memetakan Wajib Pajak serta mengidentifikasi potensi pajak dalam wilayah kerja KPP", "Menetapkan sanksi administrasi atas pelanggaran Wajib Pajak"], "c": 3, "e": "Tiga tujuan KPDL: memperoleh data baru, pemutakhiran data, dan pemetaan WP — bukan menetapkan sanksi administrasi.", "p": 0, "topic": "Profiling", "id": "pengawasan_q_133"}, {"q": "KPDL yang dilakukan oleh Petugas Pengawasan berdasarkan zona pengawasan atau WP yang diampu, dengan cara menyisir bidang/persil/lokasi WP di wilayah kerja KPP, termasuk jenis...", "o": ["KPD Analisis", "KPD Berbasis Kewilayahan", "KPD Eksternal", "KPD Non TUSI"], "c": 1, "e": "KPD Berbasis Kewilayahan dilakukan oleh Petugas Pengawasan berdasarkan Zona Pengawasan dan/atau WP yang diampu, atau Tim KPD berdasarkan Peta Kerja, menyisir bidang/persil/unit/lokasi WP.", "p": 0, "topic": "Profiling", "id": "pengawasan_q_134"}, {"q": "KPD yang dapat dilaksanakan oleh seluruh pegawai DJP saat menemukan data terkait WP di luar pelaksanaan tugas dan fungsinya disebut...", "o": ["KPD TUSI Lainnya", "KPD Non TUSI", "KPD Analisis", "KPD Eksternal"], "c": 1, "e": "KPD Non TUSI dapat dilaksanakan oleh pegawai DJP pada saat menemukan data dan/atau informasi terkait WP di luar pelaksanaan tugas dan fungsinya.", "p": 0, "topic": "Profiling", "id": "pengawasan_q_135"}, {"q": "KPDL yang dilakukan oleh pihak eksternal berdasarkan perjanjian kerja sama dengan DJP (contoh: kerja sama dengan PT Pos Indonesia) termasuk jenis...", "o": ["KPD Berbasis Kewilayahan", "KPD Analisis", "KPD Eksternal", "KPD TUSI Lainnya"], "c": 2, "e": "KPD Eksternal dilakukan oleh pihak eksternal berdasarkan perjanjian kerja sama dengan DJP, dengan mempertimbangkan efektivitas, kompetensi, kerahasiaan data, dan jangka waktu pelaksanaan.", "p": 0, "topic": "Profiling", "id": "pengawasan_q_136"}, {"q": "Dalam pelaksanaan KPDL, jumlah pegawai minimal yang harus terlibat dalam satu kegiatan KPDL adalah...", "o": ["1 orang", "2 orang", "3 orang", "5 orang"], "c": 1, "e": "KPDL dilaksanakan minimal oleh 2 orang pegawai, dengan menggunakan pakaian kerja dan dilengkapi tanda pengenal, Surat Tugas, serta dokumen terkait.", "p": 0, "topic": "Profiling", "id": "pengawasan_q_137"}, {"q": "Prinsip Continuous Supervision dalam kegiatan KPD berarti bahwa KPD...", "o": ["Hanya digunakan untuk mengumpulkan data tanpa tindak lanjut", "Dapat langsung menindaklanjuti update data profil WP atau tindakan lain secara jabatan jika ditemukan kondisi tertentu", "Harus dilakukan setiap hari tanpa henti", "Hanya berlaku untuk WP Badan, tidak untuk WP OP"], "c": 1, "e": "Continuous Supervision berarti KPD tidak hanya untuk mengumpulkan data, tapi juga dapat langsung menindaklanjuti update data profil WP atau action lain secara jabatan (misal perubahan data, pengukuhan PKP, aktivasi NIK) yang ditemukan selama KPD.", "p": 0, "topic": "Profiling", "id": "pengawasan_q_138"}, {"q": "Profil Wajib Pajak didefinisikan sebagai rangkaian data dan informasi fiskal yang memuat identitas dan kegiatan usaha serta riwayat perpajakan WP secara...", "o": ["Berkesinambungan, dapat diklasifikasikan atas data permanen, data akumulatif, dan data lainnya", "Acak dan tidak terstruktur", "Hanya untuk satu tahun pajak berjalan", "Rahasia yang tidak dapat diakses pegawai DJP lain"], "c": 0, "e": "Profil WP adalah rangkaian data dan informasi fiskal WP yang memuat identitas, kegiatan usaha, dan riwayat perpajakan secara berkesinambungan, diklasifikasikan atas data permanen, data akumulatif, dan data lainnya.", "p": 0, "topic": "Profiling", "id": "pengawasan_q_139"}, {"q": "Manakah yang BUKAN merupakan komponen minimum yang wajib termuat dalam Profil Wajib Pajak?", "o": ["Identitas Wajib Pajak", "Profil risiko ketertagihan", "Daftar harga saham perusahaan di bursa efek", "Riwayat keberatan dan banding"], "c": 2, "e": "Komponen minimum Profil WP meliputi Identitas, Kegiatan Usaha, Daftar Keluarga/Keterkaitan, Profil Risiko (CRM), Riwayat Pengawasan, Riwayat Pemeriksaan, Riwayat Keberatan & Banding, dan Profil Risiko Ketertagihan — bukan daftar harga saham di bursa efek.", "p": 0, "topic": "Profiling", "id": "pengawasan_q_140"}, {"q": "Dalam langkah-langkah metodologi profiling WP (Approach One), pengecekan terhadap alamat Masterfile dibandingkan dengan alamat usaha saat ini termasuk dalam langkah...", "o": ["Pengumpulan data Wajib Pajak", "Identitas Wajib Pajak", "Proses bisnis Wajib Pajak", "Teliti kepatuhan formal Wajib Pajak"], "c": 1, "e": "Langkah 'Identitas Wajib Pajak' mencakup pengecekan alamat Masterfile vs alamat usaha, pemegang saham AHU vs SPT, KLU Masterfile vs lapangan, pohon kepemilikan, struktur organisasi, dan posisi CRM WP.", "p": 0, "topic": "Profiling", "id": "pengawasan_q_141"}, {"q": "Teknik ekualisasi dalam kegiatan profiling antara lain membandingkan hal-hal berikut, KECUALI...", "o": ["Omzet PPN dengan PPh Badan/OP", "Biaya gaji dengan jumlah penghasilan di SPT PPh Pasal 21", "Biaya sewa dengan pemotongan PPh 23/PPh Final", "Jumlah karyawan dengan luas kantor perusahaan"], "c": 3, "e": "Teknik ekualisasi membandingkan data fiskal lintas jenis pajak (omzet PPN vs PPh, biaya gaji vs PPh21, biaya sewa vs PPh23/Final, dan 28 data pemicu lain) — bukan membandingkan jumlah karyawan dengan luas kantor.", "p": 0, "topic": "Profiling", "id": "pengawasan_q_142"}, {"q": "Langkah 'jembreng SPT PPN' dalam metodologi profiling WP termasuk dalam pendekatan...", "o": ["Approach One, langkah 1", "Approach Two, langkah 6", "Approach One, langkah 5", "Approach Two, langkah 9"], "c": 1, "e": "Approach Two terdiri dari langkah 6-9: jembreng SPT PPN (langkah 6), lakukan ekualisasi (langkah 7), analisis laporan keuangan menyeluruh (langkah 8), dan pemanfaatan data eksternal (langkah 9).", "p": 0, "topic": "Profiling", "id": "pengawasan_q_143"}]}, "mansoskul": {"file": "mansoskul", "label": "Mansoskul", "ringkasan": [{"heading": "Level Kemahiran Kompetensi (Permenpan 38/2017)", "p": 0, "page": "hlm 2", "html": "<p>Setiap kompetensi (Manajerial maupun Sosial Kultural) diukur dalam 5 level kemahiran sesuai Permenpan 38/2017:</p><ul><li><strong>Level 1</strong> – Paham/dalam pengembangan</li><li><strong>Level 2</strong> – Dasar</li><li><strong>Level 3</strong> – Menengah</li><li><strong>Level 4</strong> – Mumpuni</li><li><strong>Level 5</strong> – Ahli</li></ul><p>Semakin tinggi jenjang jabatan, semakin tinggi pula level kompetensi yang dipersyaratkan (SKJ).</p>", "id": "mansoskul_r_0"}, {"heading": "SKJ Kompetensi Manajerial per Jenjang Jabatan", "p": 0, "page": "hlm 3", "html": "<p>Standar Kompetensi Jabatan (SKJ) adalah persyaratan kompetensi minimal yang harus dimiliki ASN sesuai jabatannya. Untuk Jabatan Fungsional (termasuk JF Pengawas Keuangan Negara):</p><table><tr><th>Kompetensi</th><th>Ahli Pertama</th><th>Ahli Muda</th><th>Ahli Madya</th><th>Ahli Utama</th></tr><tr><td>Integritas</td><td>2</td><td>3</td><td>4</td><td>5</td></tr><tr><td>Kerjasama</td><td>2</td><td>3</td><td>4</td><td>4</td></tr><tr><td>Komunikasi</td><td>2</td><td>3</td><td>4</td><td>4</td></tr><tr><td>Orientasi pada Hasil</td><td>2</td><td>3</td><td>4</td><td>4</td></tr><tr><td>Pelayanan Publik</td><td>2</td><td>3</td><td>4</td><td>4</td></tr><tr><td>Pengembangan Diri & Orang Lain</td><td>2</td><td>3</td><td>4</td><td>4</td></tr><tr><td>Mengelola Perubahan</td><td>2</td><td>3</td><td>4</td><td>4</td></tr><tr><td>Pengambilan Keputusan</td><td>2</td><td>3</td><td>4</td><td>4</td></tr><tr><td>Perekat Bangsa</td><td>2</td><td>3</td><td>4</td><td>5</td></tr></table><p>Catatan: hanya <strong>Integritas</strong> dan <strong>Perekat Bangsa</strong> yang menuntut Level 5 di jenjang Ahli Utama — 7 kompetensi lainnya cukup Level 4.</p>", "id": "mansoskul_r_1"}, {"heading": "Integritas", "p": 0, "page": "hlm 4", "html": "<p><strong>Definisi:</strong> Konsisten berperilaku selaras dengan nilai, norma dan/atau etika organisasi, jujur dalam hubungan dengan manajemen, rekan kerja, bawahan langsung, dan pemangku kepentingan; menciptakan budaya etika tinggi; bertanggung jawab atas tindakan/keputusan beserta risikonya.</p><ul><li><strong>L1</strong> – Bertindak sesuai nilai/norma/etika dalam kapasitas pribadi.</li><li><strong>L2</strong> – Mengingatkan & mengajak rekan kerja bertindak sesuai nilai/etika.</li><li><strong>L3</strong> – Memastikan & menanamkan keyakinan bersama agar anggota yang dipimpin bertindak sesuai nilai/etika (lingkup formal); memberi apresiasi/teguran; monitoring-evaluasi.</li><li><strong>L4</strong> – Menciptakan situasi kerja yang mendorong kepatuhan pada nilai/etika; berani mengoreksi penyimpangan meski ada risiko.</li><li><strong>L5</strong> – Role model standar keadilan & etika di tingkat nasional; membuat kebijakan/strategi penerapan integritas.</li></ul>", "id": "mansoskul_r_2"}, {"heading": "Kerjasama", "p": 0, "page": "hlm 5", "html": "<p><strong>Definisi:</strong> Kemampuan menjalin, membina, mempertahankan hubungan kerja yang efektif, berkomitmen saling membantu penyelesaian tugas, dan mengoptimalkan sumberdaya untuk tujuan strategis organisasi.</p><ul><li><strong>L1</strong> – Berpartisipasi dalam kelompok kerja.</li><li><strong>L2</strong> – Menumbuhkan tim kerja partisipatif & efektif.</li><li><strong>L3</strong> – Efektif membangun tim kerja untuk peningkatan kinerja organisasi (melihat kekuatan/kelemahan anggota, negosiasi, membangun aliansi).</li><li><strong>L4</strong> – Membangun komitmen tim & sinergi antar unit kerja di lingkup instansi.</li><li><strong>L5</strong> – Menciptakan situasi kerja sama konsisten di dalam & luar instansi; membangun konsensus menggabungkan sumberdaya lintas pihak.</li></ul>", "id": "mansoskul_r_3"}, {"heading": "Komunikasi", "p": 0, "page": "hlm 6", "html": "<p><strong>Definisi:</strong> Kemampuan menerangkan pandangan/gagasan secara jelas, sistematis, argumentasi logis (lisan/tertulis); memastikan pemahaman; mendengarkan aktif; mempersuasi & meyakinkan demi tujuan organisasi.</p><ul><li><strong>L1</strong> – Menyampaikan informasi dengan jelas, lengkap, pemahaman yang sama; membuat memo/surat sederhana.</li><li><strong>L2</strong> – Mendengarkan aktif, menginterpretasikan pesan, menyiapkan materi presentasi/pidato/laporan.</li><li><strong>L3</strong> – Berkomunikasi asertif untuk informasi sensitif/rumit/kompleks; membuat laporan tahunan, surat resmi, proposal rinci.</li><li><strong>L4</strong> – Mengemukakan pemikiran multidimensi lisan/tertulis untuk mendorong kesepakatan demi kinerja keseluruhan.</li><li><strong>L5</strong> – Menggagas sistem komunikasi terbuka secara strategis untuk isu berisiko tinggi tingkat nasional.</li></ul>", "id": "mansoskul_r_4"}, {"heading": "Orientasi pada Hasil", "p": 0, "page": "hlm 7", "html": "<p><strong>Definisi:</strong> Kemampuan mempertahankan komitmen pribadi tinggi untuk menyelesaikan tugas, dapat diandalkan, bertanggung jawab, mengidentifikasi risiko & peluang secara sistematis demi keberhasilan organisasi.</p><ul><li><strong>L1</strong> – Bertanggung jawab memenuhi standar kerja.</li><li><strong>L2</strong> – Berupaya meningkatkan hasil kerja pribadi di atas standar; mencari metode alternatif.</li><li><strong>L3</strong> – Menetapkan target menantang bagi unit kerja; memberi apresiasi/teguran untuk dorong kinerja.</li><li><strong>L4</strong> – Mendorong unit kerja mencapai/melebihi target tingkat instansi.</li><li><strong>L5</strong> – Meningkatkan mutu pencapaian kerja organisasi demi target prioritas nasional.</li></ul>", "id": "mansoskul_r_5"}, {"heading": "Pelayanan Publik", "p": 0, "page": "hlm 8", "html": "<p><strong>Definisi:</strong> Kemampuan melaksanakan tugas pemerintahan, pembangunan, dan pemenuhan kebutuhan pelayanan publik secara profesional, transparan, objektif, netral, tidak memihak, tidak diskriminatif, tidak terpengaruh kepentingan pribadi/kelompok/golongan/partai politik.</p><ul><li><strong>L1</strong> – Menjalankan tugas mengikuti standar pelayanan.</li><li><strong>L2</strong> – Menjelaskan proses pelaksanaan tugas pemerintahan/pelayanan publik secara transparan.</li><li><strong>L3</strong> – Memanfaatkan kekuatan kelompok & memperbaiki standar pelayanan di lingkup unit kerja.</li><li><strong>L4</strong> – Memonitor/mengevaluasi dampak isu jangka panjang/politik terhadap pelayanan publik.</li><li><strong>L5</strong> – Memastikan kebijakan pelayanan publik objektif-netral di tingkat instansi/nasional.</li></ul>", "id": "mansoskul_r_6"}, {"heading": "Pengembangan Diri dan Orang Lain", "p": 0, "page": "hlm 9", "html": "<p><strong>Definisi:</strong> Kemampuan meningkatkan pengetahuan & menyempurnakan keterampilan diri; menginspirasi orang lain untuk belajar sepanjang hidup; memberi saran/bantuan/umpan balik/bimbingan untuk mengembangkan potensi orang lain.</p><ul><li><strong>L1</strong> – Pengembangan diri (identifikasi kebutuhan belajar).</li><li><strong>L2</strong> – Meningkatkan kemampuan bawahan dengan contoh & penjelasan praktis.</li><li><strong>L3</strong> – Memberikan umpan balik & membimbing (tugas menantang, diskusi, kepercayaan diri bawahan).</li><li><strong>L4</strong> – Menyusun program pengembangan jangka panjang & manajemen pembelajaran unit kerja.</li><li><strong>L5</strong> – Menciptakan budaya belajar berkelanjutan tingkat instansi.</li></ul>", "id": "mansoskul_r_7"}, {"heading": "Mengelola Perubahan", "p": 0, "page": "hlm 10", "html": "<p><strong>Definisi:</strong> Kemampuan menyesuaikan diri dengan situasi baru/berubah, tidak bergantung berlebihan pada metode lama, mendukung & melaksanakan inisiatif perubahan, memimpin usaha perubahan secara efektif.</p><ul><li><strong>L1</strong> – Mengikuti perubahan dengan arahan.</li><li><strong>L2</strong> – Mengikuti perubahan secara mandiri.</li><li><strong>L3</strong> – Membantu orang lain mengikuti perubahan & mengantisipasi perubahan secara tepat.</li><li><strong>L4</strong> – Memimpin perubahan pada unit kerja, memitigasi risiko.</li><li><strong>L5</strong> – Memimpin & menggalang dukungan perubahan berkelanjutan tingkat instansi/nasional.</li></ul>", "id": "mansoskul_r_8"}, {"heading": "Pengambilan Keputusan", "p": 0, "page": "hlm 11", "html": "<p><strong>Definisi:</strong> Kemampuan membuat keputusan tepat waktu & yakin diri setelah mempertimbangkan kehati-hatian, dirumuskan sistematis & seksama berdasarkan berbagai informasi, alternatif, konsekuensi; bertanggung jawab atas keputusan.</p><ul><li><strong>L1</strong> – Mengumpulkan informasi untuk bertindak sesuai kewenangan.</li><li><strong>L2</strong> – Menganalisis masalah secara mendalam.</li><li><strong>L3</strong> – Membandingkan alternatif, menyeimbangkan risiko-keberhasilan implementasi.</li><li><strong>L4</strong> – Menyelesaikan masalah berisiko tinggi, mengantisipasi dampak, membuat mitigasi risiko.</li><li><strong>L5</strong> – Menghasilkan solusi & keputusan strategis berdampak nasional.</li></ul>", "id": "mansoskul_r_9"}, {"heading": "Kompetensi Sosial Kultural — Pengantar", "p": 0, "page": "hlm 12", "html": "<p>Kompetensi Sosial Kultural adalah pengetahuan, keterampilan, dan sikap/perilaku terkait pengalaman berinteraksi dengan masyarakat majemuk. Terdapat <strong>12 dimensi keberagaman</strong> yang perlu dipahami pegawai: Agama/Kepercayaan, Suku dan Budaya, Gender, Latar Belakang Individu, Sosial Ekonomi, Etika, Wawasan Kebangsaan, Nilai-nilai, Moral, Emosi, Prinsip, dan Preferensi Politik.</p><p>Permenpan 38/2017 hanya menetapkan <strong>satu</strong> kompetensi Sosial Kultural, yaitu <strong>Perekat Bangsa</strong>.</p>", "id": "mansoskul_r_10"}, {"heading": "Perekat Bangsa — Definisi & Komponen", "p": 0, "page": "hlm 13", "html": "<p><strong>Definisi:</strong> Kemampuan pegawai dalam: (1) mempromosikan sikap toleransi & keterbukaan; (2) peka terhadap perbedaan individu/kelompok masyarakat; (3) mampu menjadi perpanjangan tangan pemerintah dalam mempersatukan masyarakat; (4) membangun hubungan sosial psikologis dengan masyarakat di tengah kemajemukan Indonesia.</p>", "id": "mansoskul_r_11"}, {"heading": "Perekat Bangsa — SKJ per Jenjang Jabatan", "p": 0, "page": "hlm 14", "html": "<ul><li><strong>L1 (Paham)</strong> – Pelaksana/JF Pemula: peka, memahami, menerima kemajemukan; terbuka belajar perbedaan; bekerja bersama individu berbeda latar belakang.</li><li><strong>L2 (Dasar)</strong> – Jabatan Pengawas/JF Pertama-Mahir-Terampil: aktif mengembangkan sikap saling menghargai; membangun hubungan baik; mengendalikan emosi menghadapi pertentangan.</li><li><strong>L3 (Menengah)</strong> – Jabatan Administrator/Penyelia/JF Muda: mempromosikan & mengembangkan sikap toleransi-persatuan; pemetaan sosial; mediator konflik.</li><li><strong>L4 (Mumpuni)</strong> – JPT Pratama/JF Madya: mendayagunakan perbedaan secara konstruktif-kreatif; representasi pemerintah di lingkungan kerja & masyarakat.</li><li><strong>L5 (Ahli)</strong> – JPT Madya/JF Utama: wakil pemerintah membangun hubungan sosial-psikologis; mengkomunikasikan risiko & rekomendasi tindakan korektif; kebijakan berdampak nasional.</li></ul>", "id": "mansoskul_r_12"}, {"heading": "Nilai-nilai Kemenkeu dalam Konteks Sosial Kultural", "p": 0, "page": "hlm 15", "html": "<p>5 Nilai Kemenkeu sebagai \"way of life\", sejalan dengan Kode Etik, Kode Perilaku, dan Bela Negara:</p><ul><li><strong>Integritas</strong> – Menjaga martabat, tidak melakukan hal tercela (toleransi, bijak bermedsos, tidak bullying).</li><li><strong>Profesionalisme</strong> – Bekerja dengan hati (peka & empati terhadap perbedaan, bersikap tenang menghadapi konflik, kepentingan bangsa di atas pribadi).</li><li><strong>Sinergi</strong> – Memiliki sangka baik, saling percaya, menghormati (perbedaan politik, ras, agama, status, dll).</li><li><strong>Pelayanan</strong> – Melayani berorientasi kepuasan pemangku kepentingan, tidak membeda-bedakan stakeholder.</li><li><strong>Kesempurnaan</strong> – Mengembangkan inovasi & kreativitas, terbuka terhadap informasi baru.</li></ul>", "id": "mansoskul_r_13"}, {"heading": "Contoh Kegiatan dalam Keberagaman", "p": 0, "page": "hlm 16", "html": "<p><strong>Kegiatan Sosial Kemenkeu:</strong> Kemenkeu Mengajar, Seminggu Bersama Keluarga Kemenkeu (SBKK).</p><p><strong>Kegiatan sosial di lingkungan masyarakat (contoh indikator Perekat Bangsa dalam praktik):</strong> menjadi ketua RT/RW, relawan kerja bakti, terlibat kegiatan bantuan sosial (renovasi fasilitas umum/ibadah, dll).</p>", "id": "mansoskul_r_14"}, {"heading": "Resume Contoh Perilaku Kompetensi — Level 2 (Dasar)", "p": 0, "page": "hlm 27", "html": "<p>Contoh perilaku Level 2 untuk kesembilan kompetensi (ciri khas: mandiri, informal, belum lintas unit):</p><ul><li><strong>Integritas</strong> – Konsisten mengingatkan tim bertindak sesuai aturan; berani menekankan integritas secara informal.</li><li><strong>Kerjasama</strong> – Memotivasi anggota tim berkontribusi aktif; memberi contoh & mengajak anggota tim.</li><li><strong>Komunikasi</strong> – Memberi tanggapan sesuai saat ditanya; menyelesaikan dokumen tertulis secara mandiri.</li><li><strong>Orientasi pada Hasil</strong> – Evaluasi & perbaikan proses kerja sendiri; menerapkan metode baru yang terbukti efektif.</li><li><strong>Pelayanan Publik</strong> – Belajar dari rekan lebih berpengalaman; membangun forum komunikasi formal/informal.</li><li><strong>Pengembangan Diri & Orang Lain</strong> – Memberi tanggung jawab & memonitor bawahan; one-on-one coaching.</li><li><strong>Mengelola Perubahan</strong> – Antusias merespon perubahan cara kerja secara mandiri; mengimplementasikan hal baru.</li><li><strong>Pengambilan Keputusan</strong> – Memastikan kebenaran informasi via konfirmasi; review alternatif solusi sesuai ketentuan.</li><li><strong>Perekat Bangsa</strong> – Berperan aktif memberi teladan nilai keberagaman; tetap ramah & menahan diri menghadapi pertentangan.</li></ul>", "id": "mansoskul_r_15"}, {"heading": "Resume Contoh Perilaku Kompetensi — Level 3 (Menengah)", "p": 0, "page": "hlm 26", "html": "<p>Contoh perilaku Level 3 untuk kesembilan kompetensi (ciri khas: lingkup formal/unit kerja, mulai mengelola orang lain):</p><ul><li><strong>Integritas</strong> – Mengecek proses kerja bawahan sesuai nilai/etika; mengoreksi pelanggaran kode etik bawahan.</li><li><strong>Kerjasama</strong> – Membentuk tim lintas bidang; mendorong anggota tim memberi usulan untuk keputusan tim.</li><li><strong>Komunikasi</strong> – Berkomunikasi efektif dengan tetap mengendalikan emosi & empati untuk info sensitif.</li><li><strong>Orientasi pada Hasil</strong> – Menyusun program kerja prioritas; monitoring & umpan balik capaian bawahan.</li><li><strong>Pelayanan Publik</strong> – Mengenali karakteristik pemangku kepentingan untuk penyesuaian layanan; membangun kerja sama lintas organisasi.</li><li><strong>Pengembangan Diri & Orang Lain</strong> – Mendelegasikan peran ke bawahan untuk tantangan lebih tinggi.</li><li><strong>Mengelola Perubahan</strong> – Menginisiasi perubahan; membentuk tim kecil untuk perbaikan proses kerja.</li><li><strong>Pengambilan Keputusan</strong> – Memilih keputusan terbaik dengan mempertimbangkan implikasi & rencana mitigasi.</li><li><strong>Perekat Bangsa</strong> – Membuat kegiatan bertema kebersamaan lintas latar belakang di unit kerja.</li></ul>", "id": "mansoskul_r_16"}, {"heading": "Laporan Individual Assessment Center (LIAC) — Definisi & Pemanfaatan", "p": 0, "page": "hlm 20", "html": "<p><strong>Definisi:</strong> LIAC adalah laporan hasil pengolahan data Assessment Center terhadap Assessee, dibuat Assessor berdasarkan bukti perilaku dari Pengambilan Data (Intake) dan hasil Assessor Meeting.</p><p><strong>Pemanfaatan:</strong> mengetahui skor Job Person Match (JPM) AC beserta skor kompetensi tiap level; digunakan menentukan rencana pengembangan sesuai kebutuhan organisasi & minat pegawai.</p><p><strong>Akses:</strong> melalui HRIS masing-masing pegawai (hris.e-prime.kemenkeu.go.id).</p>", "id": "mansoskul_r_17"}, {"heading": "Laporan Individual Assessment Center — Contoh Hasil & Job Person Match", "p": 0, "page": "hlm 21", "html": "<p>Contoh Laporan Hasil AC membandingkan Level hasil Assessment Center vs Level persyaratan SKJ untuk 9 kompetensi, menghasilkan deskripsi gap (\"Memenuhi level\" / \"Kurang 1 level dari persyaratan SKJ\") dan skor <strong>Job Person Match (JPM)</strong> dalam persentase (mis. 77,78%).</p><p>Laporan Saran Pengembangan memuat: Level Hasil AC, Level SKJ, Level Pengembangan, Indikator Perilaku Pengembangan, Saran Penugasan (Experience), Saran Coaching, Saran Pelatihan, Saran Pembelajaran — untuk setiap kompetensi yang masih memiliki gap.</p>", "id": "mansoskul_r_18"}, {"heading": "Self-Assessment — Definisi & Tujuan", "p": 0, "page": "hlm 23", "html": "<p><strong>Definisi:</strong> Self-assessment (penilaian diri) adalah teknik penilaian yang dilakukan individu untuk menggali, menemukan, dan mengemukakan kelebihan & kekurangan dirinya, serta menyikapi/memperbaiki kekurangan dan mengembangkan kelebihannya.</p><p><strong>Tujuan:</strong></p><ol><li>Individu dapat mengetahui Gap Kompetensi.</li><li>Individu dapat mengetahui cara menyelesaikan masalah (teknik & strategi).</li><li>Individu dapat mengukur kualitas pekerjaannya.</li><li>Individu dapat mengukur tingkat pencapaian kinerjanya.</li></ol>", "id": "mansoskul_r_19"}, {"heading": "Langkah-langkah Self-Assessment", "p": 0, "page": "hlm 24", "html": "<ol><li>Memahami Standar Kompetensi Jabatan (SKJ).</li><li>Memahami definisi kompetensi dan indikatornya.</li><li>Mengidentifikasi evidence yang dimiliki dan membandingkan dengan indikator perilaku pada kamus kompetensi sesuai tuntutan SKJ jabatannya, serta mempertimbangkan faktor \"lack\".</li><li>Mengamati apakah indikator perilaku pada level SKJ tersebut terpenuhi — termasuk memastikan indikator pada level di bawahnya juga sudah terpenuhi.</li></ol>", "id": "mansoskul_r_20"}, {"heading": "Faktor Penyebab Gap Kompetensi", "p": 0, "page": "hlm 25", "html": "<p>3 faktor utama penyebab gap (kesenjangan) kompetensi:</p><ul><li><strong>Lack of Opportunity</strong> – Tidak ada kesempatan atau tidak dituntut dalam tugasnya.</li><li><strong>Lack of Knowledge</strong> – Belum memahami, relatif baru di tugasnya.</li><li><strong>Lack of Motivation</strong> – Hambatan personal.</li></ul>", "id": "mansoskul_r_21"}, {"heading": "Model Pengembangan Kompetensi 70:20:10 (PMK 216/2018)", "p": 0, "page": "hlm 27", "html": "<ul><li><strong>Experiential Learning (70%)</strong> – Pembelajaran terintegrasi di tempat kerja melalui praktik langsung. Contoh: assignment, secondment, job enlargement, job enrichment.</li><li><strong>Social Learning (20%)</strong> – Pembelajaran kolaboratif dalam komunitas/bimbingan. Contoh: coaching, mentoring, benchmarking, community of practice (CoP), feedback, network and sharing (peers).</li><li><strong>Formal Learning (10%)</strong> – Pembelajaran terstruktur formal. Contoh: diklat, self-study, e-learning, workshop.</li></ul>", "id": "mansoskul_r_22"}], "soal": [{"q": "Berdasarkan Permenpan 38/2017, Level kemahiran kompetensi yang disebut \"Menengah\" berada pada level berapa?", "o": ["Level 2", "Level 3", "Level 4", "Level 5"], "c": 1, "e": "Level 3 = Menengah. Urutannya: L1 Paham/dalam pengembangan, L2 Dasar, L3 Menengah, L4 Mumpuni, L5 Ahli.", "p": 0, "topic": "Level Kemahiran", "id": "mansoskul_q_0"}, {"q": "Sebutan untuk Level 1 kemahiran kompetensi ASN adalah...", "o": ["Dasar", "Paham/dalam pengembangan", "Menengah", "Mumpuni"], "c": 1, "e": "Level 1 disebut \"Paham/dalam pengembangan\", level paling awal sebelum Dasar (L2).", "p": 0, "topic": "Level Kemahiran", "id": "mansoskul_q_1"}, {"q": "Jenjang jabatan Ahli Madya dipersyaratkan berada pada level kompetensi manajerial berapa (untuk 7 dari 8 kompetensi manajerial)?", "o": ["Level 2", "Level 3", "Level 4", "Level 5"], "c": 2, "e": "Ahli Madya dipersyaratkan Level 4 untuk sebagian besar kompetensi manajerial (kecuali Integritas yang tetap mengikuti pola sama di level ini, baru di Ahli Utama Integritas naik ke 5).", "p": 0, "topic": "SKJ", "id": "mansoskul_q_2"}, {"q": "Di antara 9 kompetensi dalam SKJ, kompetensi manakah yang dipersyaratkan Level 5 pada jenjang Ahli Utama (selain Integritas)?", "o": ["Kerjasama", "Komunikasi", "Perekat Bangsa", "Pengambilan Keputusan"], "c": 2, "e": "Hanya Integritas dan Perekat Bangsa yang menuntut Level 5 di jenjang Ahli Utama; 7 kompetensi manajerial lainnya cukup Level 4.", "p": 0, "topic": "SKJ", "id": "mansoskul_q_3"}, {"q": "Berapa persyaratan level kompetensi Kerjasama untuk jenjang Ahli Pertama?", "o": ["Level 1", "Level 2", "Level 3", "Level 4"], "c": 1, "e": "Ahli Pertama dipersyaratkan Level 2 untuk seluruh kompetensi manajerial maupun Perekat Bangsa.", "p": 0, "topic": "SKJ", "id": "mansoskul_q_4"}, {"q": "\"Konsisten berperilaku selaras dengan nilai, norma dan/atau etika organisasi, dan jujur dalam hubungan dengan manajemen, rekan kerja, bawahan langsung, dan pemangku kepentingan\" adalah definisi kompetensi...", "o": ["Integritas", "Kerjasama", "Komunikasi", "Pelayanan Publik"], "c": 0, "e": "Ini adalah definisi kompetensi Integritas.", "p": 0, "topic": "Integritas", "id": "mansoskul_q_5"}, {"q": "Perilaku \"menjadi role model dalam penerapan standar keadilan dan etika di tingkat nasional\" merupakan indikator Integritas pada level...", "o": ["Level 2", "Level 3", "Level 4", "Level 5"], "c": 3, "e": "Itu indikator Level 5 (Ahli) untuk kompetensi Integritas.", "p": 0, "topic": "Integritas", "id": "mansoskul_q_6"}, {"q": "Pada kompetensi Integritas Level 3, seorang pejabat diharapkan mampu...", "o": ["Bertindak sesuai nilai dalam kapasitas pribadi saja", "Memastikan & menanamkan keyakinan bersama agar anggota yang dipimpin bertindak sesuai nilai/etika dalam lingkup formal", "Mengingatkan rekan kerja secara informal", "Membuat kebijakan integritas tingkat nasional"], "c": 1, "e": "Level 3 Integritas: memastikan/menanamkan keyakinan bersama pada anggota yang dipimpin, dalam lingkup formal, serta monitoring-evaluasi penerapan integritas.", "p": 0, "topic": "Integritas", "id": "mansoskul_q_7"}, {"q": "Definisi kompetensi \"kemampuan menjalin, membina, mempertahankan hubungan kerja yang efektif, memiliki komitmen saling membantu dalam penyelesaian tugas\" adalah...", "o": ["Kerjasama", "Komunikasi", "Orientasi pada Hasil", "Perekat Bangsa"], "c": 0, "e": "Ini definisi kompetensi Kerjasama.", "p": 0, "topic": "Kerjasama", "id": "mansoskul_q_8"}, {"q": "\"Efektif membangun tim kerja untuk peningkatan kinerja organisasi\" (melihat kekuatan/kelemahan anggota, negosiasi, membangun aliansi) adalah indikator Kerjasama pada level...", "o": ["Level 1", "Level 2", "Level 3", "Level 4"], "c": 2, "e": "Ini adalah deskripsi Level 3 kompetensi Kerjasama.", "p": 0, "topic": "Kerjasama", "id": "mansoskul_q_9"}, {"q": "Pada kompetensi Kerjasama Level 1, perilaku yang diharapkan adalah...", "o": ["Membangun aliansi dengan pemangku kepentingan", "Berpartisipasi dalam kelompok kerja", "Membangun sinergi antar unit kerja", "Membangun konsensus lintas organisasi"], "c": 1, "e": "Level 1 Kerjasama: berpartisipasi sebagai anggota tim yang baik, mendukung keputusan tim.", "p": 0, "topic": "Kerjasama", "id": "mansoskul_q_10"}, {"q": "Kemampuan \"menerangkan pandangan dan gagasan secara jelas, sistematis, disertai argumentasi logis\" baik lisan maupun tertulis adalah definisi kompetensi...", "o": ["Komunikasi", "Kerjasama", "Pelayanan Publik", "Pengembangan Diri dan Orang Lain"], "c": 0, "e": "Ini definisi kompetensi Komunikasi.", "p": 0, "topic": "Komunikasi", "id": "mansoskul_q_11"}, {"q": "Kemampuan \"berkomunikasi secara asertif untuk menyampaikan informasi yang sensitif/rumit/kompleks\" dan membuat laporan/proposal rinci adalah indikator Komunikasi level...", "o": ["Level 2", "Level 3", "Level 4", "Level 5"], "c": 1, "e": "Ini adalah indikator Level 3 kompetensi Komunikasi.", "p": 0, "topic": "Komunikasi", "id": "mansoskul_q_12"}, {"q": "Level tertinggi (Level 5) kompetensi Komunikasi menuntut kemampuan...", "o": ["Membuat memo sederhana", "Mendengarkan pihak lain secara aktif", "Menggagas sistem komunikasi terbuka secara strategis untuk isu berisiko tinggi tingkat nasional", "Membuat materi presentasi sesuai arahan pimpinan"], "c": 2, "e": "Level 5 Komunikasi: menggagas sistem komunikasi terbuka secara strategis, menggalang hubungan skala strategis tingkat nasional.", "p": 0, "topic": "Komunikasi", "id": "mansoskul_q_13"}, {"q": "Kompetensi \"Orientasi pada Hasil\" menekankan pada...", "o": ["Netralitas dalam pelayanan", "Komitmen pribadi tinggi menyelesaikan tugas, dapat diandalkan, bertanggung jawab", "Mempersuasi orang lain", "Toleransi terhadap perbedaan"], "c": 1, "e": "Orientasi pada Hasil = kemampuan mempertahankan komitmen pribadi tinggi, dapat diandalkan & bertanggung jawab menyelesaikan tugas dengan memperhatikan risiko-peluang.", "p": 0, "topic": "Orientasi pada Hasil", "id": "mansoskul_q_14"}, {"q": "\"Mendorong unit kerja di tingkat instansi mencapai kinerja yang melebihi target yang ditetapkan\" adalah indikator Orientasi pada Hasil level...", "o": ["Level 2", "Level 3", "Level 4", "Level 5"], "c": 2, "e": "Ini adalah Level 4 kompetensi Orientasi pada Hasil.", "p": 0, "topic": "Orientasi pada Hasil", "id": "mansoskul_q_15"}, {"q": "Kompetensi yang menekankan \"tidak terpengaruh kepentingan pribadi/kelompok/golongan/partai politik\" dalam pelaksanaan tugas pemerintahan adalah...", "o": ["Pelayanan Publik", "Integritas", "Kerjasama", "Perekat Bangsa"], "c": 0, "e": "Definisi Pelayanan Publik secara eksplisit menyebut objektif, netral, tidak memihak, tidak diskriminatif, dan tidak terpengaruh kepentingan pribadi/kelompok/golongan/partai politik.", "p": 0, "topic": "Pelayanan Publik", "id": "mansoskul_q_16"}, {"q": "Pada Level 1 kompetensi Pelayanan Publik, pejabat diharapkan...", "o": ["Memastikan kebijakan pelayanan publik tingkat nasional", "Menjalankan tugas mengikuti standar pelayanan", "Memanfaatkan kekuatan kelompok untuk perbaikan standar pelayanan", "Memonitor dampak isu politik jangka panjang"], "c": 1, "e": "Level 1 Pelayanan Publik: menjalankan tugas mengikuti standar pelayanan, melayani keluhan pemangku kepentingan.", "p": 0, "topic": "Pelayanan Publik", "id": "mansoskul_q_17"}, {"q": "Kompetensi \"Pengembangan Diri dan Orang Lain\" mencakup kemampuan untuk...", "o": ["Menyelesaikan masalah berisiko tinggi", "Menginspirasi orang lain mengembangkan pengetahuan/keterampilan dan mendorong belajar sepanjang hidup", "Mengelola konflik politik", "Menjaga netralitas pelayanan"], "c": 1, "e": "Definisi kompetensi ini mencakup meningkatkan pengetahuan diri sekaligus menginspirasi & membimbing orang lain untuk berkembang.", "p": 0, "topic": "Pengembangan Diri dan Orang Lain", "id": "mansoskul_q_18"}, {"q": "\"Menyusun program pengembangan jangka panjang bersama bawahan, termasuk penetapan tujuan, bimbingan, dan penugasan\" adalah indikator Pengembangan Diri dan Orang Lain level...", "o": ["Level 2", "Level 3", "Level 4", "Level 5"], "c": 2, "e": "Ini adalah indikator Level 4.", "p": 0, "topic": "Pengembangan Diri dan Orang Lain", "id": "mansoskul_q_19"}, {"q": "Kompetensi \"Mengelola Perubahan\" pada Level 2 menuntut kemampuan...", "o": ["Mengikuti perubahan dengan arahan orang lain", "Mengikuti perubahan secara mandiri sesuai ketentuan yang berlaku", "Memimpin perubahan pada unit kerja", "Menggalang dukungan perubahan tingkat nasional"], "c": 1, "e": "Level 2 Mengelola Perubahan: menyesuaikan cara kerja lama dengan metode baru secara mandiri tanpa arahan orang lain.", "p": 0, "topic": "Mengelola Perubahan", "id": "mansoskul_q_20"}, {"q": "Definisi kompetensi Mengelola Perubahan menekankan pada...", "o": ["Komitmen pribadi menyelesaikan tugas", "Menyesuaikan diri dengan situasi baru, tidak bergantung berlebihan pada metode/proses lama, memimpin usaha perubahan", "Hubungan kerja yang efektif", "Objektivitas dalam pelayanan"], "c": 1, "e": "Ini definisi Mengelola Perubahan: kemampuan beradaptasi dan memimpin inisiatif perubahan secara efektif.", "p": 0, "topic": "Mengelola Perubahan", "id": "mansoskul_q_21"}, {"q": "Kompetensi \"Pengambilan Keputusan\" menuntut keputusan dirumuskan secara sistematis dan seksama berdasarkan...", "o": ["Instruksi atasan semata", "Berbagai informasi, alternatif pemecahan masalah, dan konsekuensinya", "Opini pribadi", "Preferensi politik"], "c": 1, "e": "Definisi Pengambilan Keputusan menekankan perumusan sistematis-seksama berdasarkan berbagai informasi, alternatif, dan konsekuensinya, dengan prinsip kehati-hatian.", "p": 0, "topic": "Pengambilan Keputusan", "id": "mansoskul_q_22"}, {"q": "\"Menyelesaikan masalah yang mengandung risiko tinggi, mengantisipasi dampak keputusan, membuat tindakan pengamanan (mitigasi risiko)\" adalah indikator Pengambilan Keputusan level...", "o": ["Level 2", "Level 3", "Level 4", "Level 5"], "c": 2, "e": "Ini adalah Level 4 kompetensi Pengambilan Keputusan.", "p": 0, "topic": "Pengambilan Keputusan", "id": "mansoskul_q_23"}, {"q": "Berapa jumlah dimensi keberagaman yang digambarkan dalam materi Kompetensi Sosial Kultural?", "o": ["9", "10", "12", "15"], "c": 2, "e": "Terdapat 12 dimensi keberagaman: Agama/Kepercayaan, Suku&Budaya, Gender, Latar Belakang Individu, Sosial Ekonomi, Etika, Wawasan Kebangsaan, Nilai-nilai, Moral, Emosi, Prinsip, Preferensi Politik.", "p": 0, "topic": "Sosial Kultural", "id": "mansoskul_q_24"}, {"q": "Berapa jumlah kompetensi Sosial Kultural yang ditetapkan dalam Permenpan 38/2017?", "o": ["Hanya 1 (Perekat Bangsa)", "3", "5", "9"], "c": 0, "e": "Permenpan 38/2017 hanya menetapkan satu kompetensi Sosial Kultural, yaitu Perekat Bangsa — berbeda dengan Kompetensi Manajerial yang terdiri atas 8 kompetensi.", "p": 0, "topic": "Sosial Kultural", "id": "mansoskul_q_25"}, {"q": "Kompetensi Perekat Bangsa mencakup kemampuan menjadi \"perpanjangan tangan pemerintah\" dalam...", "o": ["Menyusun kebijakan fiskal", "Mempersatukan masyarakat", "Menegakkan sanksi administrasi", "Mengelola anggaran negara"], "c": 1, "e": "Salah satu komponen definisi Perekat Bangsa: mampu menjadi perpanjangan tangan pemerintah dalam mempersatukan masyarakat.", "p": 0, "topic": "Perekat Bangsa", "id": "mansoskul_q_26"}, {"q": "Pada SKJ Perekat Bangsa, jenjang JPT Madya/JF Utama (Level 5/Ahli) dituntut mampu...", "o": ["Sekadar peka terhadap perbedaan individu", "Menjadi wakil pemerintah membangun hubungan sosial-psikologis dan membuat kebijakan berdampak nasional", "Hanya bekerja sama dengan individu berbeda latar belakang", "Mengendalikan emosi menghadapi pertentangan"], "c": 1, "e": "Level 5 Perekat Bangsa: menjadi wakil pemerintah, mengkomunikasikan risiko & rekomendasi korektif, membuat kebijakan berdampak nasional.", "p": 0, "topic": "Perekat Bangsa", "id": "mansoskul_q_27"}, {"q": "Pada jenjang Jabatan Administrator/Penyelia/JF Muda (Level 3), kompetensi Perekat Bangsa menuntut pegawai mampu menjadi...", "o": ["Mediator menyelesaikan konflik/potensi konflik di masyarakat", "Wakil pemerintah tingkat nasional", "Pelaksana pasif tanpa inisiatif", "Pembuat kebijakan fiskal"], "c": 0, "e": "Level 3 Perekat Bangsa mencakup: mempromosikan & mengembangkan sikap toleransi-persatuan, pemetaan sosial, dan menjadi mediator penyelesaian konflik.", "p": 0, "topic": "Perekat Bangsa", "id": "mansoskul_q_28"}, {"q": "Nilai Kemenkeu \"Bekerja dengan hati\" dengan perilaku utama \"peka dan empati terhadap perbedaan serta mengutamakan kepentingan bangsa di atas pribadi\" termasuk nilai...", "o": ["Integritas", "Profesionalisme", "Sinergi", "Pelayanan"], "c": 1, "e": "\"Bekerja dengan hati\" adalah perilaku utama nilai Profesionalisme dalam konteks sosial kultural.", "p": 0, "topic": "Nilai Kemenkeu", "id": "mansoskul_q_29"}, {"q": "Nilai Kemenkeu yang perilaku utamanya adalah \"memiliki sangka baik, saling percaya, dan menghormati perbedaan politik, ras, agama, dsb.\" adalah...", "o": ["Integritas", "Sinergi", "Pelayanan", "Kesempurnaan"], "c": 1, "e": "Nilai Sinergi memiliki perilaku utama: sangka baik, saling percaya, dan menghormati perbedaan (politik, ras, warna kulit, agama, dll).", "p": 0, "topic": "Nilai Kemenkeu", "id": "mansoskul_q_30"}, {"q": "Ada berapa nilai-nilai Kemenkeu yang menjadi \"way of life\" dan sejalan dengan Kode Etik serta Bela Negara?", "o": ["3", "4", "5", "6"], "c": 2, "e": "Ada 5 nilai: Integritas, Profesionalisme, Sinergi, Pelayanan, dan Kesempurnaan.", "p": 0, "topic": "Nilai Kemenkeu", "id": "mansoskul_q_31"}, {"q": "\"Kemenkeu Mengajar\" dan \"Seminggu Bersama Keluarga Kemenkeu (SBKK)\" adalah contoh dari...", "o": ["Program pengembangan karir individu", "Kegiatan sosial Kemenkeu dalam konteks keberagaman", "Program pelatihan teknis perpajakan", "Mekanisme assessment center"], "c": 1, "e": "Keduanya dicontohkan sebagai kegiatan sosial Kemenkeu yang mendukung keberagaman/kompetensi sosial kultural.", "p": 0, "topic": "Kegiatan Keberagaman", "id": "mansoskul_q_32"}, {"q": "Laporan Individual Assessment Center (LIAC) dibuat oleh Assessor berdasarkan bukti perilaku yang diperoleh dari...", "o": ["Hasil ujian tertulis semata", "Pengambilan Data (Intake) dan hasil Assessor Meeting", "Laporan kinerja tahunan", "Survei kepuasan pelanggan"], "c": 1, "e": "LIAC disusun Assessor berdasarkan bukti perilaku dari proses Intake (pengambilan data) dan hasil Assessor Meeting.", "p": 0, "topic": "LIAC", "id": "mansoskul_q_33"}, {"q": "Melalui kanal apa pegawai dapat mengakses Laporan Individual Assessment Center (LIAC)?", "o": ["Portal DJP Online", "HRIS (hris.e-prime.kemenkeu.go.id)", "Aplikasi e-SPT", "Sistem Informasi Keuangan Negara"], "c": 1, "e": "LIAC dapat diakses melalui HRIS masing-masing pegawai di hris.e-prime.kemenkeu.go.id.", "p": 0, "topic": "LIAC", "id": "mansoskul_q_34"}, {"q": "Dalam contoh Laporan Hasil Assessment Center, skor yang menunjukkan kesesuaian keseluruhan profil kompetensi pegawai terhadap persyaratan jabatan disebut...", "o": ["Indeks Kinerja Individu (IKI)", "Job Person Match (JPM)", "Rasio Kesenjangan Kompetensi", "Nilai Prestasi Kerja"], "c": 1, "e": "Job Person Match (JPM) adalah skor persentase yang menggambarkan kesesuaian profil kompetensi pegawai dengan tuntutan jabatan (contoh pada materi: 77,78%).", "p": 0, "topic": "LIAC", "id": "mansoskul_q_35"}, {"q": "Self-assessment adalah teknik penilaian yang dilakukan oleh...", "o": ["Atasan langsung", "Individu itu sendiri", "Tim assessor eksternal", "Inspektorat Jenderal"], "c": 1, "e": "Self-assessment/penilaian diri dilakukan oleh individu itu sendiri untuk menggali kelebihan dan kekurangan dirinya.", "p": 0, "topic": "Self-Assessment", "id": "mansoskul_q_36"}, {"q": "Berikut yang BUKAN merupakan tujuan dari self-assessment adalah...", "o": ["Mengetahui gap kompetensi", "Mengukur kualitas pekerjaan", "Menetapkan sanksi disiplin pegawai lain", "Mengukur tingkat pencapaian kinerja"], "c": 2, "e": "4 tujuan self-assessment: mengetahui gap kompetensi, mengetahui cara menyelesaikan masalah, mengukur kualitas pekerjaan, dan mengukur pencapaian kinerja — tidak termasuk menetapkan sanksi disiplin orang lain.", "p": 0, "topic": "Self-Assessment", "id": "mansoskul_q_37"}, {"q": "Langkah pertama dalam melakukan self-assessment adalah...", "o": ["Mengidentifikasi evidence yang dimiliki", "Memahami Standar Kompetensi Jabatan (SKJ)", "Mengamati indikator perilaku level SKJ", "Membandingkan dengan kamus kompetensi"], "c": 1, "e": "Langkah 1: memahami Standar Kompetensi Jabatan (SKJ) terlebih dahulu, baru dilanjutkan memahami definisi & indikator kompetensi.", "p": 0, "topic": "Self-Assessment", "id": "mansoskul_q_38"}, {"q": "Dalam langkah self-assessment, saat mengamati pemenuhan indikator perilaku pada suatu level SKJ, hal yang juga perlu dipastikan adalah...", "o": ["Indikator level di atasnya sudah terpenuhi", "Indikator level di bawahnya juga sudah terpenuhi", "Hanya level tertinggi yang perlu diperiksa", "Tidak perlu memeriksa level lain"], "c": 1, "e": "Langkah terakhir self-assessment menekankan bahwa indikator-indikator pada level SKJ di bawahnya juga harus sudah terpenuhi (bersifat kumulatif/bertingkat).", "p": 0, "topic": "Self-Assessment", "id": "mansoskul_q_39"}, {"q": "Faktor penyebab gap kompetensi \"Lack of Opportunity\" berarti...", "o": ["Pegawai belum memahami karena relatif baru di tugasnya", "Tidak ada kesempatan atau tidak dituntut dalam tugasnya", "Adanya hambatan personal", "Kurangnya motivasi internal"], "c": 1, "e": "Lack of Opportunity = tidak ada kesempatan atau tidak dituntut dalam tugasnya untuk menunjukkan kompetensi tersebut.", "p": 0, "topic": "Gap Kompetensi", "id": "mansoskul_q_40"}, {"q": "\"Belum memahami, relatif baru di tugasnya\" adalah ciri dari faktor penyebab gap kompetensi...", "o": ["Lack of Opportunity", "Lack of Knowledge", "Lack of Motivation", "Lack of Resource"], "c": 1, "e": "Lack of Knowledge berkaitan dengan belum memahami karena relatif baru pada tugas tersebut.", "p": 0, "topic": "Gap Kompetensi", "id": "mansoskul_q_41"}, {"q": "Ada berapa faktor utama penyebab gap kompetensi yang dijelaskan dalam materi?", "o": ["2", "3", "4", "5"], "c": 1, "e": "Ada 3 faktor: Lack of Opportunity, Lack of Knowledge, dan Lack of Motivation.", "p": 0, "topic": "Gap Kompetensi", "id": "mansoskul_q_42"}, {"q": "Model pengembangan kompetensi 70:20:10 (PMK 216/2018) menetapkan porsi 70% untuk jenis pembelajaran apa?", "o": ["Formal Learning", "Social Learning", "Experiential Learning", "Digital Learning"], "c": 2, "e": "Experiential Learning memiliki porsi terbesar 70%, yaitu pembelajaran terintegrasi di tempat kerja melalui praktik langsung.", "p": 0, "topic": "Model 70:20:10", "id": "mansoskul_q_43"}, {"q": "Contoh aktivitas Social Learning (porsi 20%) dalam model pengembangan kompetensi 70:20:10 adalah...", "o": ["Diklat dan workshop", "Coaching, mentoring, benchmarking, community of practice", "Assignment dan job enlargement", "Self-study dan e-learning"], "c": 1, "e": "Social Learning (20%) mencakup aktivitas kolaboratif seperti coaching, mentoring, benchmarking, CoP, feedback, dan network/sharing dengan peers.", "p": 0, "topic": "Model 70:20:10", "id": "mansoskul_q_44"}, {"q": "Diklat, self-study, dan e-learning adalah contoh dari jenis pembelajaran apa const FILE_META = {
  pemeriksaan: {desc:"Prosedur pemeriksaan, KUP umum, serta materi substantif PPh & PPN.", hasPrioritas:true},
  pengawasan: {desc:"Penyesuaian ketentuan PMK, Transfer Pricing/PKKU, Ekstensifikasi (PMK-111/2025), Pemeriksaan, dan Profiling WP.", hasPrioritas:true},
  mansoskul: {desc:"Kompetensi Manajerial & Sosial Kultural (Permenpan 38/2017). Tidak ada tingkat Prioritas pada file ini.", hasPrioritas:false}
};

let state = {
  file: null,
  ringkasanFilter: 'prioritas',
  qty: 20,
  quiz: { items: [], answers: {}, composition: {p:0,r:0} }
};

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function goTo(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.getElementById('footer-bar').style.display = (id==='screen-kuis-run') ? 'flex' : 'none';
  window.scrollTo({top:0});
}

function renderFileGrid(){
  const grid = document.getElementById('file-grid');
  grid.innerHTML = '';
  Object.keys(DATA).forEach(key=>{
    const d = DATA[key];
    const meta = FILE_META[key];
    const el = document.createElement('div');
    el.className = 'file-card';
    el.onclick = ()=>selectFile(key);
    el.innerHTML = `<h3>${d.label}</h3><p>${meta.desc}</p><span class="tag">${d.soal.length} soal &middot; ${d.ringkasan.length} topik ringkasan</span>`;
    grid.appendChild(el);
  });
}

function selectFile(key){
  state.file = key;
  state.ringkasanFilter = FILE_META[key].hasPrioritas ? 'prioritas' : 'reguler';
  goTo('screen-mode');
}

function openRingkasan(){
  renderRingkasanToggle();
  renderRingkasanList();
  goTo('screen-ringkasan');
}

function renderRingkasanToggle(){
  const holder = document.getElementById('ringkasan-toggle');
  const meta = FILE_META[state.file];
  if(!meta.hasPrioritas){
    holder.innerHTML = `<div class="toggle-btn active reguler" style="cursor:default;">Reguler (Menyeluruh)</div>`;
    return;
  }
  holder.innerHTML = `
    <button class="toggle-btn prioritas ${state.ringkasanFilter==='prioritas'?'active prioritas':''}" onclick="setRingkasanFilter('prioritas')">⚠ Prioritas</button>
    <button class="toggle-btn reguler ${state.ringkasanFilter==='reguler'?'active reguler':''}" onclick="setRingkasanFilter('reguler')">Reguler</button>
  `;
}

function setRingkasanFilter(f){
  state.ringkasanFilter = f;
  renderRingkasanToggle();
  renderRingkasanList();
}

function renderRingkasanList(){
  const list = document.getElementById('ringkasan-list');
  const countHolder = document.getElementById('ringkasan-count');
  const pFlag = state.ringkasanFilter==='prioritas' ? 1 : 0;
  const items = DATA[state.file].ringkasan.filter(r=>r.p===pFlag);
  countHolder.textContent = `${items.length} topik ditemukan`;
  list.innerHTML = items.map(r=>`
    <div class="r-card">
      <div class="r-head">
        <h4>${r.heading}</h4>
        <span class="badge ${r.p===1?'prioritas':'reguler'}">${r.p===1?'⚠ Prioritas':'Reguler'}</span>
      </div>
      <div class="body">${r.html}</div>
      ${r.page? `<div style="margin-top:8px;"><span class="badge page">${r.page}</span></div>`:''}
    </div>
  `).join('') || `<div class="empty-note">Tidak ada materi pada kategori ini.</div>`;
}

function openKuisSetup(){
  const row = document.getElementById('qty-row');
  row.innerHTML = [20,40,60].map(n=>`
    <div class="qty-btn ${state.qty===n?'active':''}" onclick="setQty(${n})">${n}<span>soal</span></div>
  `).join('');
  updateKuisInfo();
  goTo('screen-kuis-setup');
}

function setQty(n){
  state.qty = n;
  openKuisSetup();
}

function updateKuisInfo(){
  const info = document.getElementById('kuis-info');
  const meta = FILE_META[state.file];
  const soal = DATA[state.file].soal;
  const pPool = soal.filter(q=>q.p===1).length;
  const rPool = soal.filter(q=>q.p===0).length;
  if(meta.hasPrioritas){
    const targetP = Math.round(state.qty*0.6);
    const targetR = state.qty - targetP;
    const effP = Math.min(targetP, pPool);
    const effR = state.qty - effP;
    info.innerHTML = `Target komposisi: <strong>${targetP} Prioritas</strong> / <strong>${targetR} Reguler</strong>.`+
      (effP < targetP ? ` <br>Catatan: pool Prioritas file ini hanya ${pPool} soal, sehingga komposisi aktual akan menjadi ~${effP} Prioritas / ${effR} Reguler.` : '');
  } else {
    info.innerHTML = `File ini tidak memiliki tingkat Prioritas — seluruh ${state.qty} soal akan diambil dari pool Reguler (${rPool} soal tersedia).`;
  }
}

function usedKey(file, tier){ return `ukom2_used_${file}_${tier}`; }
function getUsed(file, tier){
  try{ return new Set(JSON.parse(localStorage.getItem(usedKey(file,tier))||'[]')); }catch(e){ return new Set(); }
}
function saveUsed(file, tier, set){
  try{ localStorage.setItem(usedKey(file,tier), JSON.stringify(Array.from(set))); }catch(e){}
}

function pickFromPool(file, tier, pool, needed){
  if(needed<=0 || pool.length===0) return [];
  needed = Math.min(needed, pool.length);
  let usedSet = getUsed(file, tier);
  let unused = pool.filter(q=>!usedSet.has(q.id));
  shuffle(unused);
  let picks = [];
  let repeats = new Set();
  if(unused.length >= needed){
    picks = unused.slice(0, needed);
  } else {
    picks = unused.slice();
    usedSet = new Set();
    let remaining = pool.filter(q=>!picks.some(p=>p.id===q.id));
    shuffle(remaining);
    const extra = remaining.slice(0, needed - picks.length);
    extra.forEach(q=>repeats.add(q.id));
    picks = picks.concat(extra);
  }
  picks.forEach(q=>usedSet.add(q.id));
  saveUsed(file, tier, usedSet);
  return picks.map(q=>({...q, _repeat: repeats.has(q.id)}));
}

function buildQuiz(){
  const file = state.file;
  const meta = FILE_META[file];
  const soal = DATA[file].soal;
  const pPool = soal.filter(q=>q.p===1);
  const rPool = soal.filter(q=>q.p===0);
  let targetP = meta.hasPrioritas ? Math.round(state.qty*0.6) : 0;
  let targetR = state.qty - targetP;
  const effP = Math.min(targetP, pPool.length);
  let effR = state.qty - effP;
  effR = Math.min(effR, rPool.length);
  const picksP = pickFromPool(file, 'p1', pPool, effP);
  const picksR = pickFromPool(file, 'p0', rPool, effR);
  let items = shuffle(picksP.concat(picksR));
  state.quiz = { items, answers:{}, composition:{p:picksP.length, r:picksR.length, target:state.qty} };
}

function startKuis(){
  buildQuiz();
  renderKuis();
  goTo('screen-kuis-run');
}

function regenKuis(){
  buildQuiz();
  renderKuis();
  goTo('screen-kuis-run');
}

function renderKuis(){
  const list = document.getElementById('quiz-list');
  const comp = state.quiz.composition;
  document.getElementById('quiz-composition').textContent = `${comp.p} Prioritas · ${comp.r} Reguler`;
  const noteHolder = document.getElementById('empty-note-holder');
  if(comp.p + comp.r < comp.target){
    noteHolder.innerHTML = `<div class="empty-note">Jumlah soal tersedia (${comp.p+comp.r}) kurang dari target (${comp.target}) karena pool soal file ini terbatas.</div>`;
  } else {
    noteHolder.innerHTML = '';
  }
  list.innerHTML = state.quiz.items.map((q,idx)=>`
    <div class="q-card" id="qcard-${idx}">
      <div class="q-head">
        <span class="q-num">Soal ${idx+1}/${state.quiz.items.length}</span>
        <span class="badge ${q.p===1?'prioritas':'reguler'}">${q.p===1?'⚠ Prioritas':'Reguler'}</span>
        ${q._repeat? `<span class="badge sama">🔁 Sama (pernah muncul)</span>`:''}
      </div>
      <div class="q-text">${q.q}</div>
      <div class="opts" id="opts-${idx}">
        ${q.o.map((opt,oi)=>`<button class="opt" onclick="answerQuiz(${idx},${oi})">${String.fromCharCode(65+oi)}. ${opt}</button>`).join('')}
      </div>
      <div class="explain" id="explain-${idx}">${q.e}</div>
    </div>
  `).join('');
  updateProgress();
}

function answerQuiz(idx, oi){
  if(state.quiz.answers[idx] !== undefined) return;
  state.quiz.answers[idx] = oi;
  const q = state.quiz.items[idx];
  const optsHolder = document.getElementById('opts-'+idx);
  const btns = optsHolder.querySelectorAll('.opt');
  btns.forEach((btn,bi)=>{
    btn.classList.add('disabled-opt');
    btn.onclick = null;
    if(bi===q.c) btn.classList.add('correct');
    else if(bi===oi) btn.classList.add('wrong');
  });
  document.getElementById('explain-'+idx).classList.add('show');
  updateProgress();
}

function updateProgress(){
  const total = state.quiz.items.length;
  const answered = Object.keys(state.quiz.answers).length;
  document.getElementById('quiz-progress-text').textContent = `${answered}/${total} terjawab`;
  document.getElementById('quiz-progress-fill').style.width = total? `${(answered/total*100)}%` : '0%';
  document.getElementById('footer-status').textContent = `${answered}/${total} terjawab`;
}

function finishKuis(){
  const items = state.quiz.items;
  const answers = state.quiz.answers;
  let correct = 0;
  items.forEach((q,idx)=>{ if(answers[idx]===q.c) correct++; });
  const total = items.length;
  const pct = total? Math.round(correct/total*100) : 0;
  document.getElementById('modal-score').textContent = pct+'%';
  document.getElementById('modal-sub').textContent = `${correct} dari ${total} benar`;
  let title = 'Hasil Kuis';
  if(pct>=85) title='🎉 Luar Biasa!';
  else if(pct>=70) title='👍 Bagus!';
  else if(pct>=50) title='💪 Terus Berlatih';
  else title='📚 Perlu Pendalaman Lagi';
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-result').classList.add('show');
}

function closeModal(){
  document.getElementById('modal-result').classList.remove('show');
}

renderFileGrid();
</script>
