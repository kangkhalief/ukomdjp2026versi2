laian (jika ada Penilai Pajak/Petugas Penilai pada Unit Pelaksana Pemeriksaan) maupun Bantuan Penilai (jika tidak ada).</p>", "id": "pengawasan_r_101"}, {"heading": "Data Konkret (PER-18/PJ/2025)", "p": 0, "page": "hlm 812-814", "html": "<p>Data Konkret adalah data yang dimiliki/diperoleh DJP, terdiri 3 jenis:</p><ul><li><strong>Faktur Pajak</strong> yang disetujui sistem tapi belum/tidak dilaporkan dalam SPT Masa PPN</li><li><strong>Bukti Potput PPh</strong> yang belum/tidak dilaporkan penerbitnya pada SPT Masa PPh</li><li><strong>Bukti Transaksi/Data Perpajakan</strong> (8 sub-jenis): kelebihan kompensasi PPN tanpa LB sebelumnya, penghitungan kembali PM oleh pihak tidak berhak, PPN disetor dimuka kurang bayar, pemanfaatan insentif tidak sesuai, pengkreditan PM tidak sesuai ketentuan, penghasilan tidak/kurang dilaporkan dari bukti potong DJP, data dari ketetapan/putusan inkrah, serta data P2DK yang tidak ditindaklanjuti tepat waktu (LHP2DK berpeluang jadi data konkret kategori ini)</li></ul><p>Data Konkret memerlukan pengujian sederhana sehingga diarahkan ke Pemeriksaan Spesifik.</p>", "id": "pengawasan_r_102"}, {"heading": "Kebijakan Umum Tanggung Jawab Tim Pemeriksa", "p": 0, "page": "hlm 821", "html": "<p>Tim Pemeriksa Pajak yang terdiri dari <strong>Pejabat Fungsional Pemeriksa Pajak</strong> bertanggung jawab atas pemeriksaan restitusi PPN tahun berjalan, pemeriksaan ruang lingkup seluruh jenis pajak, dan pemeriksaan ulang. Tim yang terdiri dari <strong>Petugas Pemeriksa Pajak</strong> bertanggung jawab atas pemeriksaan ruang lingkup satu/beberapa jenis pajak, termasuk pemeriksaan khusus berdasarkan data konkret, pemeriksaan PBB, dan pemeriksaan SPT Masa Pengungkapan Aset Sukarela dengan Tarif Final.</p>", "id": "pengawasan_r_103"}, {"heading": "Kriteria Pemeriksaan Efektif (SE-15/PJ/2018)", "p": 0, "page": "hlm 822", "html": "<p>Empat kriteria pemeriksaan dinilai efektif:</p><ol><li><strong>Pemeriksaan selesai dan pencairan optimal</strong>: upaya minimalisasi jangka waktu agar Pemeriksa dapat optimal mengerjakan pemeriksaan di tahun berjalan</li><li><strong>Upaya hukum minimal</strong>: kualitas pemeriksaan ditingkatkan agar hasil lebih baik</li><li><strong>Restitusi terkendali</strong>: melalui optimalisasi pengembalian pendahuluan bagi WP sesuai kriteria Pasal 17C/17D UU KUP dan Pasal 9 ayat (4c) UU PPN</li><li><strong>Menciptakan kepatuhan berkelanjutan</strong>: tidak hanya kepatuhan sesaat, terlihat dari dinamisasi SPT tahun-tahun setelah pemeriksaan</li></ol>", "id": "pengawasan_r_104"}, {"heading": "Pengusulan Pemeriksaan (SE 05/2022)", "p": 0, "page": "hlm 823-824", "html": "<p>Pengusulan pemeriksaan terbagi: pemeriksaan tujuan lain; pemeriksaan khusus berdasarkan data konkret; pemeriksaan khusus berdasarkan analisis risiko (satu/beberapa jenis pajak); dan pemeriksaan khusus berdasarkan analisis risiko seluruh jenis pajak (<em>all taxes</em>).</p>", "id": "pengawasan_r_105"}, {"heading": "Ketentuan Pemeriksaan atas WP Strategis", "p": 0, "page": "hlm 823-825", "html": "<p><strong>Berdasarkan data konkret</strong>: tahun pajak berjalan <em>dapat</em> diusulkan setelah penelitian satu/beberapa jenis pajak dan/atau satu/beberapa masa pajak serta kegiatan P2DK selesai; tahun pajak sebelum tahun berjalan <em>dapat</em> diusulkan setelah penelitian komprehensif dan P2DK selesai.</p><p><strong>Berdasarkan analisis risiko</strong>: tahun pajak berjalan <em>tidak dapat</em> diusulkan (baik satu/beberapa jenis pajak maupun all taxes); tahun pajak sebelum tahun berjalan <em>dapat</em> diusulkan setelah penelitian komprehensif dan P2DK selesai.</p><p>Penggalian potensi tahun berjalan di setiap KPP hanya dapat dilakukan terhadap WP yang telah terdapat dalam <strong>DSP3</strong>, kecuali KPP memperoleh keterangan lain berupa data konkret yang dapat ditindaklanjuti tersendiri.</p>", "id": "pengawasan_r_106"}, {"heading": "Persetujuan/Penugasan Pemeriksaan oleh Kepala KPP", "p": 0, "page": "hlm 826", "html": "<p>Kepala KPP bertanggung jawab atas penerbitan persetujuan/penugasan pemeriksaan untuk: (1) penugasan rutin berdasarkan Daftar Nominatif (kriteria SPT LB, merger/likuidasi/pembubaran, WP OP akan meninggalkan Indonesia selamanya, WP tidak sampaikan SPOP PBB; ruang lingkup satu/seluruh jenis pajak); (2) persetujuan pemeriksaan khusus berdasarkan keterangan lain berupa data konkret; (3) penugasan pemeriksaan tujuan lain administratif (NPWP/PKP jabatan, Pemeriksaan Fisik Barang dalam rangka Pencocokan Data/TLDDP ke Kawasan Bebas).</p>", "id": "pengawasan_r_107"}, {"heading": "Tujuan dan Jenis KPDL (Kegiatan Pengumpulan Data Lapangan)", "p": 0, "page": "hlm 824-825", "html": "<p>Tujuan KPDL (SE-11/PJ/2020): (1) memperoleh data/informasi baru, (2) pemutakhiran data yang sudah dimiliki, (3) pemetaan WP dan potensi pajak di wilayah kerja KPP. Lima jenis KPD:</p><ul><li><strong>KPD Berbasis Kewilayahan</strong>: oleh AR berdasarkan zona/WP yang diampu, atau Tim KPD berdasarkan Peta Kerja</li><li><strong>KPD Analisis</strong>: oleh AR dalam rangka pengawasan berbasis risiko (analisis laporan keuangan/fasilitas)</li><li><strong>KPD TUSI Lainnya</strong>: oleh petugas saat menjalankan fungsi (pendaftaran, pelayanan, penyuluhan, pemeriksaan, penyidikan, intelijen, penilaian, penagihan, dll)</li><li><strong>KPD Non TUSI</strong>: oleh pegawai DJP saat menemukan data secara nyata di lapangan, di luar tusi</li><li><strong>KPD Eksternal</strong>: oleh pihak eksternal berdasarkan perjanjian kerja sama dengan DJP</li></ul>", "id": "pengawasan_r_108"}, {"heading": "KPDL Eksternal dan Hal yang Diperhatikan dalam KPDL", "p": 0, "page": "hlm 827, 833", "html": "<p>KPDL Eksternal mempertimbangkan efektivitas/efisiensi, kompetensi pihak eksternal, kerahasiaan data, jangka waktu, dan pertimbangan lain (dasar SE-19/PJ/2014, contoh kerja sama DJP dengan Pos Indonesia). Hal yang diperhatikan dalam pelaksanaan KPDL: koordinasi dengan pemda/Babinsa/Bhabinkamtibmas; membekali pengetahuan teknik & data wilayah; dilaksanakan minimal 2 pegawai dengan pakaian kerja, tanda pengenal, dan Surat Tugas; dilakukan pada hari &amp; jam kerja (dapat di luar jika ada penugasan pimpinan); mengutamakan nilai Kemenkeu, kehati-hatian, dan mitigasi konflik kepentingan.</p>", "id": "pengawasan_r_109"}, {"heading": "Tahapan Proses Bisnis KPD", "p": 0, "page": "hlm 829-830", "html": "<p>Tiga tahap: <strong>Perencanaan</strong> (penyusunan rencana, PZP/Peta Kerja, penyusunan Daftar Prioritas KPD); <strong>Pelaksanaan</strong> (4 jenis KPD lapangan/kantor, Action Selection seperti permintaan bantuan penilaian/intelijen, pembuatan profil WP, berbagai ex-officio, input Formulir KPD); <strong>Tindak Lanjut</strong> (Penjaminan Kualitas Data: Validasi Material oleh atasan langsung, Validasi Formal oleh Kasi Penjaminan Kualitas Data).</p><p>Prinsip <strong>Continuous Supervision</strong>: KPD tidak hanya mengumpulkan data, tapi dapat langsung menindaklanjuti update data profil WP atau tindakan lain secara jabatan (perubahan data/status WP, pengukuhan PKP, pendaftaran PBB, aktivasi NIK, usulan pencabutan fasilitas) jika ditemukan kondisi tertentu saat KPD.</p>", "id": "pengawasan_r_110"}, {"heading": "Definisi, Maksud, dan Tujuan Profil Wajib Pajak", "p": 0, "page": "hlm 835", "html": "<p>Profil WP adalah <strong>rangkaian data dan informasi fiskal</strong> yang memuat identitas, kegiatan usaha, dan riwayat perpajakan WP secara berkesinambungan, diklasifikasikan atas data permanen, data akumulatif, dan data lainnya. Tujuannya: mendapatkan data lengkap WP, menyempurnakan &amp; memperbaiki basis data DJP, pertukaran data internal, pondasi penggalian potensi pajak, penghitungan potensi &amp; tax gap, serta sebagai alat ukur kepatuhan WP.</p>", "id": "pengawasan_r_111"}, {"heading": "Komponen Minimum Profil Wajib Pajak", "p": 0, "page": "hlm 836", "html": "<p>Profil WP memuat paling sedikit: Identitas WP, Kegiatan Usaha WP, Daftar Keluarga/Keterkaitan WP, Profil Risiko (CRM), Riwayat Pengawasan, Riwayat Pemeriksaan, Riwayat Keberatan dan Banding, serta Profil Risiko Ketertagihan.</p>", "id": "pengawasan_r_112"}, {"heading": "Langkah-Langkah Metodologi Profiling WP", "p": 0, "page": "hlm 838, 846", "html": "<p>Metodologi profiling terdiri 9 langkah dalam 2 pendekatan:</p><p><strong>Approach One</strong>: (1) pengumpulan data WP, (2) identitas WP (alamat masterfile vs usaha, pemegang saham AHU vs SPT, KLU masterfile vs lapangan, pohon kepemilikan, struktur organisasi, posisi CRM), (3) proses bisnis WP (arus dokumen/uang vs arus barang: supplier-WP-customer via gudang/toko/outlet cabang), (4) teliti kepatuhan formal WP (riwayat pelaporan masa/tahunan/pemeriksaan), (5) supplier dan customer utama.</p><p><strong>Approach Two</strong>: (6) jembreng SPT PPN, (7) lakukan ekualisasi, (8) analisis laporan keuangan menyeluruh, (9) pemanfaatan data eksternal (jika ada).</p>", "id": "pengawasan_r_113"}, {"heading": "Teknik Ekualisasi dalam Profiling", "p": 0, "page": "hlm 845", "html": "<p>Ekualisasi membandingkan data lintas jenis pajak untuk mendeteksi ketidaksesuaian, antara lain: Omzet PPN vs PPh Badan/OP, Biaya Gaji vs penghasilan pada SPT PPh Pasal 21, Biaya Sewa vs pemotongan PPh 23/PPh Final, serta ekualisasi-ekualisasi lain (termasuk 28 data pemicu).</p>", "id": "pengawasan_r_114"}], "soal": [{"q": "Kepala KPP telah melampaui jangka waktu yang ditentukan untuk memutuskan permohonan penghapusan NPWP Wajib Pajak Badan tanpa menerbitkan keputusan. Apa akibat hukumnya?", "o": ["Permohonan WP dianggap ditolak secara otomatis", "Permohonan WP dianggap dikabulkan, dan Kepala KPP wajib menerbitkan SK Penghapusan paling lama 1 bulan sejak jangka waktu berakhir", "Proses penghapusan batal dan WP harus mengajukan ulang", "Kewenangan beralih ke Kantor Wilayah DJP"], "c": 1, "e": "Ini adalah mekanisme deemed approval: keterlambatan keputusan oleh Kepala KPP mengakibatkan permohonan dianggap dikabulkan, dan SK tetap wajib diterbitkan paling lama 1 bulan setelah jangka waktu berakhir.", "p": 1, "topic": "Penghapusan WP Badan", "id": "pengawasan_q_0"}, {"q": "Berapa lama jangka waktu maksimal bagi Kepala KPP untuk menerbitkan Surat Keputusan Penghapusan NPWP Wajib Pajak Badan setelah jangka waktu penyelesaian permohonan berakhir (dalam kondisi deemed approval)?", "o": ["7 hari kerja", "14 hari kerja", "1 bulan", "3 bulan"], "c": 2, "e": "Kepala KPP wajib menerbitkan Surat Keputusan Penghapusan NPWP paling lama 1 bulan setelah jangka waktu penyelesaian berakhir, meskipun permohonan telah dianggap dikabulkan.", "p": 1, "topic": "Penghapusan WP Badan", "id": "pengawasan_q_1"}, {"q": "Dalam perhitungan PPN atas Kegiatan Membangun Sendiri (KMS) sesuai PMK 61/PMK.03/2022, bagaimana perlakuan biaya-biaya administrasi terhadap dasar pengenaan pajak?", "o": ["Biaya administrasi dikurangkan sebelum dikenakan tarif KMS", "PPN KMS dikenakan tanpa pengurangan biaya-biaya administrasi dari total biaya membangun", "Biaya administrasi dikenakan tarif tersendiri sebesar 5%", "Biaya administrasi dibebaskan dari PPN KMS"], "c": 1, "e": "PMK 61/PMK.03/2022 menegaskan PPN KMS dikenakan tanpa pengurangan biaya-biaya administrasi — DPP dihitung dari total biaya membangun (tidak termasuk tanah) apa adanya.", "p": 1, "topic": "PPN KMS", "id": "pengawasan_q_2"}, {"q": "PPN atas Kegiatan Membangun Sendiri (KMS) wajib disetor paling lambat kapan?", "o": ["Tanggal 10 bulan berikutnya", "Tanggal 15 bulan berikutnya", "Akhir bulan berikutnya setelah berakhirnya masa pajak dibangunnya bangunan", "Sebelum bangunan selesai dibangun"], "c": 2, "e": "Sesuai materi KMS, PPN KMS wajib disetor paling lambat akhir bulan berikutnya setelah berakhirnya masa pajak saat bangunan tersebut dibangun.", "p": 1, "topic": "PPN KMS", "id": "pengawasan_q_3"}, {"q": "Dalam ketentuan pengecualian PPN KMS pada PMK 61/PMK.03/2022, syarat apa yang harus dipenuhi oleh pihak yang membangunkan agar terbebas dari kewajiban PPN KMS?", "o": ["Membayar PPN di muka sebesar 50%", "Memberikan data/informasi paling sedikit identitas dan alamat pihak lain yang sesungguhnya membangun bangunan tersebut kepada DJP", "Mendapatkan izin tertulis dari Kepala KPP terlebih dahulu", "Menyampaikan laporan keuangan yang telah diaudit"], "c": 1, "e": "Pengecualian berlaku sepanjang pihak yang membangunkan memberikan data/informasi paling sedikit berupa identitas dan alamat pihak lain yang sesungguhnya membangun bangunan — tanggung jawab PPN KMS kemudian beralih ke pihak tersebut.", "p": 1, "topic": "PPN KMS", "id": "pengawasan_q_4"}, {"q": "Fasilitas Tax Allowance (PPh Pasal 31A UU PPh) diberikan kepada Wajib Pajak Badan yang menanamkan modal dengan kriteria tertentu. Manakah yang BUKAN merupakan bentuk fasilitas Tax Allowance?", "o": ["Pengurangan penghasilan neto", "Penyusutan/amortisasi dipercepat", "Perpanjangan kompensasi kerugian", "Pembebasan total PPh selama 20 tahun"], "c": 3, "e": "Tax Allowance mencakup pengurangan penghasilan neto, penyusutan/amortisasi dipercepat, perpanjangan kompensasi kerugian, dan penurunan tarif PPh dividen WPLN — bukan pembebasan total PPh (itu karakteristik Tax Holiday).", "p": 1, "topic": "Tax Allowance", "id": "pengawasan_q_5"}, {"q": "Sesuai Pasal 421 PMK 11/PMK.010/2020 tentang fasilitas Tax Allowance, apa akibatnya jika aktiva tetap berwujud yang telah mendapatkan fasilitas dialihkan untuk tujuan selain yang diberikan fasilitas dalam jangka waktu tertentu?", "o": ["Tidak ada konsekuensi apapun", "Fasilitas dicabut dan dikenakan sanksi", "WP wajib membayar denda administrasi tetap sebesar 2%", "Hanya perlu melapor ke KPP tanpa sanksi"], "c": 1, "e": "Aktiva yang telah mendapat fasilitas Tax Allowance dilarang dialihkan/digunakan untuk tujuan selain yang diberikan fasilitas dalam jangka waktu tertentu — pelanggaran mengakibatkan fasilitas dicabut dan dikenakan sanksi.", "p": 1, "topic": "Tax Allowance", "id": "pengawasan_q_6"}, {"q": "Larangan pengalihan aktiva yang mendapat fasilitas berlaku serupa pada fasilitas Tax Holiday (PMK 16/PMK.010/2020). Apa prinsip dasar yang mendasari larangan ini?", "o": ["Fasilitas fiskal terikat pada penggunaan aktiva sesuai tujuan pemberian fasilitas", "Aktiva tersebut menjadi milik negara", "WP dilarang menjual aktiva apapun selama 50 tahun", "Larangan hanya berlaku untuk aktiva impor"], "c": 0, "e": "Baik Pasal 421 PMK 11/2020 (Tax Allowance) maupun ketentuan serupa pada PMK 16/2020 (Tax Holiday) didasarkan pada prinsip bahwa fasilitas fiskal terikat pada penggunaan aktiva sesuai tujuan pemberian fasilitas tersebut.", "p": 1, "topic": "Tax Holiday", "id": "pengawasan_q_7"}, {"q": "Fasilitas pengurangan penghasilan bruto untuk kegiatan penelitian dan pengembangan (litbang) sesuai PMK 153/PMK.010/2020 TIDAK berlaku bagi Wajib Pajak badan dalam negeri yang menjalankan usaha berdasarkan apa?", "o": ["Kontrak bagi hasil, kontrak karya, atau perjanjian kerja sama pengusahaan pertambangan", "Perjanjian waralaba internasional", "Kontrak kerja sama dengan BUMN", "Perjanjian sewa guna usaha (leasing)"], "c": 0, "e": "Pasal 434 & 437 PMK 153/PMK.010/2020 mengecualikan fasilitas litbang bagi WP badan DN yang usahanya berdasarkan kontrak bagi hasil, kontrak karya, atau perjanjian kerja sama pengusahaan pertambangan — karena rezim fiskal sektor tersebut sudah diatur tersendiri.", "p": 1, "topic": "Fasilitas Litbang", "id": "pengawasan_q_8"}, {"q": "Mengapa Wajib Pajak badan dalam negeri yang menjalankan usaha berdasarkan kontrak karya atau kontrak bagi hasil dikecualikan dari fasilitas pengurangan penghasilan bruto untuk litbang?", "o": ["Karena rezim fiskal sektor tersebut sudah diatur tersendiri dalam kontrak/perjanjiannya", "Karena sektor tersebut tidak melakukan kegiatan litbang", "Karena fasilitas litbang hanya untuk perusahaan rintisan (startup)", "Karena nilai investasinya dianggap terlalu kecil"], "c": 0, "e": "Pengecualian ini konsisten dengan prinsip bahwa WP dengan kontrak karya/kontrak bagi hasil pertambangan sudah memiliki rezim fiskal tersendiri yang diatur dalam kontrak/perjanjiannya, sehingga tidak tunduk pada fasilitas pengurangan penghasilan bruto litbang yang bersifat umum.", "p": 1, "topic": "Fasilitas Litbang", "id": "pengawasan_q_9"}, {"q": "Pasal 3 PMK-111/2025 tentang Pengawasan Kepatuhan Wajib Pajak menegaskan ruang lingkup pengawasan mencakup kolom apa sebagai salah satu sasaran utama pengawasan kepatuhan?", "o": ["WP Terdaftar", "WP yang baru lahir", "WP yang telah meninggal dunia", "WP badan usaha milik asing saja"], "c": 0, "e": "Pasal 3 PMK-111/2025 menegaskan ruang lingkup pengawasan kepatuhan mencakup kolom \"WP Terdaftar\" sebagai sasaran utama, dibedakan dari pengawasan ekstensifikasi atas WP yang belum terdaftar.", "p": 1, "topic": "PMK-111/2025 Ruang Lingkup", "id": "pengawasan_q_10"}, {"q": "Seorang wanita yang menikah dapat menggunakan NPWP suaminya sendiri KECUALI dalam kondisi berikut, yaitu...", "o": ["Suami meninggal dan meninggalkan warisan yang belum terbagi", "Menghendaki penggabungan pelaksanaan perpajakan", "Hidup terpisah berdasarkan keputusan hakim", "Baru menikah pada tahun pajak berjalan"], "c": 2, "e": "Wanita kawin menggunakan NPWP sendiri (bukan suami) jika hidup terpisah berdasarkan putusan hakim, melakukan pemisahan harta/penghasilan tertulis, atau menghendaki pemisahan kewajiban perpajakan tanpa keputusan hakim.", "p": 0, "topic": "NPWP Wanita Kawin", "id": "pengawasan_q_11"}, {"q": "Warisan Belum Terbagi (WBT) menggunakan NPWP dari pihak mana?", "o": ["NPWP salah satu ahli waris yang paling tua", "NPWP Wajib Pajak orang pribadi yang meninggalkan warisan tersebut", "NPWP baru yang diajukan oleh notaris", "NPWP pengadilan negeri setempat"], "c": 1, "e": "WBT menggunakan NPWP dari WP OP yang meninggalkan warisan tersebut; jika belum memiliki NPWP, wakil WBT wajib mendaftarkan diri pada KPP.", "p": 0, "topic": "NPWP WBT", "id": "pengawasan_q_12"}, {"q": "Sejak kapan NIK diterapkan sebagai NPWP bagi Wajib Pajak orang pribadi penduduk Indonesia?", "o": ["1 Januari 2021", "14 Juli 2022", "1 Juli 2024", "17 Agustus 2023"], "c": 1, "e": "Pasal 2 ayat (1a) UU KUP mengatur penerapan NIK sebagai NPWP sejak 14 Juli 2022, dengan penerapan penuh (termasuk di luar DJP Online) mulai 1 Juli 2024 sesuai PMK-112/PMK.03/2022 stdd PMK-136/PMK.03/2023.", "p": 0, "topic": "NIK sebagai NPWP", "id": "pengawasan_q_13"}, {"q": "Jangka waktu maksimal bagi Direktur Jenderal Pajak untuk memberikan keputusan atas permohonan pencabutan pengukuhan PKP sejak permohonan diterima secara lengkap adalah...", "o": ["1 bulan", "3 bulan", "6 bulan", "12 bulan"], "c": 2, "e": "Direktur Jenderal Pajak harus memberikan keputusan atas permohonan pencabutan pengukuhan PKP dalam jangka waktu 6 bulan sejak tanggal permohonan diterima secara lengkap.", "p": 0, "topic": "Pencabutan PKP", "id": "pengawasan_q_14"}, {"q": "Badan usaha wajib mendaftarkan diri untuk memperoleh NPWP paling lama berapa lama setelah saat pendirian?", "o": ["15 hari", "1 bulan", "2 bulan", "3 bulan"], "c": 1, "e": "Badan wajib mendaftarkan diri paling lama 1 (satu) bulan setelah saat pendirian, berbeda dengan WP OP yang berbatas waktu lain tergantung kondisinya.", "p": 0, "topic": "Jangka Waktu Pendaftaran NPWP", "id": "pengawasan_q_15"}, {"q": "Buku, catatan, dan dokumen dasar pembukuan atau pencatatan wajib disimpan di Indonesia selama berapa tahun?", "o": ["5 tahun", "7 tahun", "10 tahun", "15 tahun"], "c": 2, "e": "Pasal 28 UU KUP mewajibkan penyimpanan buku, catatan, dan dokumen dasar pembukuan/pencatatan selama 10 tahun di Indonesia, di tempat kegiatan/tinggal WP OP atau tempat kedudukan WP Badan.", "p": 0, "topic": "Pembukuan", "id": "pengawasan_q_16"}, {"q": "WP orang pribadi yang ingin menggunakan Norma Penghitungan Penghasilan Neto (NPPN) harus memberitahukan kepada Dirjen Pajak dalam jangka waktu berapa bulan pertama dari Tahun Pajak yang bersangkutan? Apa akibatnya jika tidak memberitahukan?", "o": ["1 bulan; dianggap memilih NPPN otomatis", "3 bulan; dianggap memilih Pembukuan", "6 bulan; dianggap memilih pencatatan biasa", "3 bulan; dianggap memilih tarif final UMKM"], "c": 1, "e": "WP OP wajib memberitahukan penggunaan NPPN dalam 3 bulan pertama Tahun Pajak; jika tidak memberitahukan, WP dianggap memilih menyelenggarakan Pembukuan.", "p": 0, "topic": "NPPN", "id": "pengawasan_q_17"}, {"q": "Manakah pernyataan yang BENAR mengenai syarat penggunaan Norma Penghitungan Penghasilan Neto (NPPN)?", "o": ["Dapat digunakan oleh WP Badan dan OP tanpa batasan peredaran bruto", "Hanya untuk WP OP dengan peredaran bruto kurang dari Rp4,8 miliar setahun", "Hanya untuk WP yang bergerak di sektor pertambangan", "Dapat digunakan tanpa pemberitahuan kepada Dirjen Pajak"], "c": 1, "e": "NPPN hanya dapat digunakan oleh WP OP dengan peredaran bruto kurang dari Rp4,8 miliar dalam satu tahun, dengan syarat pemberitahuan dalam 3 bulan pertama Tahun Pajak dan wajib menyelenggarakan pencatatan.", "p": 0, "topic": "NPPN", "id": "pengawasan_q_18"}, {"q": "Batas waktu penyetoran PPh Pasal 21 yang dipotong adalah...", "o": ["Tanggal 10 bulan berikutnya", "Tanggal 15 bulan berikutnya", "Tanggal 20 bulan berikutnya", "Akhir bulan berikutnya"], "c": 0, "e": "PPh Pasal 4(2), Pasal 15, dan Pasal 21 yang dipotong wajib disetor paling lama tanggal 10 bulan berikutnya.", "p": 0, "topic": "Batas Waktu Pembayaran", "id": "pengawasan_q_19"}, {"q": "STP, SKPKB, SKPKBT, SK Keberatan, SK Pembetulan, Putusan Banding, dan Putusan PK wajib dilunasi dalam jangka waktu berapa sejak tanggal diterbitkan (Pasal 9 ayat (3) UU KUP)?", "o": ["15 hari sejak diterbitkan", "1 bulan sejak diterbitkan", "2 bulan sejak diterbitkan", "3 bulan sejak diterbitkan"], "c": 1, "e": "STP dan ketetapan/keputusan sejenis wajib dilunasi dalam 1 bulan sejak diterbitkan, kecuali bagi WP usaha kecil/di daerah tertentu yang dapat diperpanjang maksimal 2 bulan berdasarkan PMK.", "p": 0, "topic": "Batas Waktu Pembayaran", "id": "pengawasan_q_20"}, {"q": "Rumus sanksi bunga atas keterlambatan pembayaran pajak adalah Pajak Kurang Bayar dikali tarif bunga per bulan dikali jumlah bulan. Berapa lama maksimal periode pengenaan sanksi bunga tersebut dihitung?", "o": ["12 bulan", "24 bulan", "36 bulan", "48 bulan"], "c": 1, "e": "Sanksi bunga keterlambatan pembayaran dikenakan paling lama 24 bulan, dengan bagian dari bulan dihitung penuh 1 bulan.", "p": 0, "topic": "Sanksi Bunga", "id": "pengawasan_q_21"}, {"q": "SPT Masa PPh Pasal 21/26 wajib dilaporkan paling lama berapa hari setelah Masa Pajak berakhir?", "o": ["10 hari", "15 hari", "20 hari", "30 hari"], "c": 2, "e": "SPT Masa PPh (termasuk Pasal 21/26) wajib disampaikan paling lama 20 hari setelah Masa Pajak berakhir, berbeda dengan SPT Masa PPN yang jatuh tempo akhir bulan berikutnya.", "p": 0, "topic": "Batas Waktu SPT", "id": "pengawasan_q_22"}, {"q": "SPT Masa PPN wajib disampaikan paling lama...", "o": ["10 hari setelah Masa Pajak berakhir", "15 hari setelah Masa Pajak berakhir", "20 hari setelah Masa Pajak berakhir", "Akhir bulan berikutnya setelah berakhirnya Masa Pajak"], "c": 3, "e": "Berbeda dengan SPT Masa PPh yang jatuh tempo 20 hari, SPT Masa PPN jatuh tempo akhir bulan berikutnya setelah berakhirnya Masa Pajak sesuai Pasal 15A ayat (2) UU PPN.", "p": 0, "topic": "Batas Waktu SPT", "id": "pengawasan_q_23"}, {"q": "SPT Tahunan PPh Wajib Pajak Badan wajib disampaikan paling lama berapa bulan setelah akhir Tahun Pajak?", "o": ["2 bulan", "3 bulan", "4 bulan", "6 bulan"], "c": 2, "e": "SPT Tahunan PPh Badan wajib disampaikan paling lama 4 bulan setelah akhir Tahun Pajak, berbeda dengan SPT Tahunan PPh OP yang berbatas 3 bulan.", "p": 0, "topic": "Batas Waktu SPT", "id": "pengawasan_q_24"}, {"q": "Manakah yang TIDAK termasuk kondisi di mana SPT dianggap tidak disampaikan?", "o": ["SPT tidak ditandatangani", "SPT disampaikan setelah dilakukan pemeriksaan atau diterbitkan SKP", "SPT Lebih Bayar disampaikan dalam jangka waktu 3 tahun sejak berakhirnya Masa/Tahun Pajak dan belum ditegur tertulis", "SPT tidak sepenuhnya dilampiri keterangan/dokumen yang disyaratkan"], "c": 2, "e": "SPT dianggap tidak disampaikan jika SPT Lebih Bayar disampaikan SETELAH 3 tahun dan WP telah ditegur tertulis — bukan jika masih dalam jangka waktu 3 tahun dan belum ditegur.", "p": 0, "topic": "SPT Dianggap Tidak Disampaikan", "id": "pengawasan_q_25"}, {"q": "Sanksi administrasi berupa denda atas SPT Masa PPN yang terlambat/tidak dilaporkan sesuai Pasal 7 ayat (1) UU KUP adalah...", "o": ["Rp100.000", "Rp500.000", "Rp1.000.000", "Rp1.500.000"], "c": 1, "e": "Denda atas SPT Masa PPN yang terlambat/tidak dilaporkan adalah Rp500.000, berbeda dari SPT Masa lainnya (Rp100.000) dan SPT Tahunan Badan (Rp1.000.000).", "p": 0, "topic": "Sanksi SPT", "id": "pengawasan_q_26"}, {"q": "Sanksi administrasi berupa denda atas SPT Tahunan Wajib Pajak Badan yang terlambat/tidak dilaporkan adalah...", "o": ["Rp100.000", "Rp500.000", "Rp1.000.000", "Rp2.000.000"], "c": 2, "e": "Denda SPT Tahunan WP Badan adalah Rp1.000.000, jauh lebih besar dibanding SPT Tahunan WP OP (Rp100.000).", "p": 0, "topic": "Sanksi SPT", "id": "pengawasan_q_27"}, {"q": "Manakah pihak yang DIKECUALIKAN dari sanksi administrasi denda atas keterlambatan/tidak menyampaikan SPT?", "o": ["WP Badan yang terlambat menyampaikan SPT Tahunan 3 tahun berturut-turut", "WP orang pribadi yang telah meninggal dunia dan tidak meninggalkan warisan yang belum terbagi", "WP yang baru pindah alamat KPP", "WP yang memiliki lebih dari 1 NPWP"], "c": 1, "e": "WP OP yang telah meninggal dunia dan tidak meninggalkan warisan belum terbagi termasuk dalam daftar pihak yang dikecualikan dari sanksi denda, bersama WP yang sudah tidak berusaha, WNA yang sudah pindah, BUT yang tidak beroperasi, dan WP terkena bencana.", "p": 0, "topic": "Pengecualian Sanksi SPT", "id": "pengawasan_q_28"}, {"q": "Pembetulan SPT yang mengakibatkan utang pajak menjadi lebih besar dikenai sanksi administrasi berupa apa, dan berdasarkan pasal berapa?", "o": ["Denda, Pasal 7 ayat (1) UU KUP", "Bunga, Pasal 8 UU KUP", "Kenaikan, Pasal 13 ayat (3) UU KUP", "Bunga, Pasal 9 ayat (2a) UU KUP"], "c": 1, "e": "WP yang membetulkan SPT sehingga utang pajak menjadi lebih besar dikenai sanksi administrasi berupa bunga sesuai Pasal 8 UU KUP, dihitung dari Pajak Kurang Bayar dikali tarif bunga per bulan dikali jumlah bulan.", "p": 0, "topic": "Pembetulan SPT", "id": "pengawasan_q_29"}, {"q": "Syarat utama agar Wajib Pajak dapat membetulkan SPT-nya sendiri (secara sukarela) adalah...", "o": ["Belum dilakukan Pemeriksaan atau Pemeriksaan Bukti Permulaan secara terbuka", "Harus mendapat izin tertulis dari Kepala Kanwil DJP", "SPT yang dibetulkan harus berstatus Lebih Bayar", "Hanya dapat dilakukan maksimal 1 kali dalam setahun"], "c": 0, "e": "Pembetulan SPT atas kemauan sendiri hanya dapat dilakukan sepanjang Direktur Jenderal Pajak belum melakukan Pemeriksaan atau Pemeriksaan Bukti Permulaan secara terbuka kepada WP/wakil/kuasa/pegawai/anggota keluarga dewasa dari WP.", "p": 0, "topic": "Pembetulan SPT", "id": "pengawasan_q_30"}, {"q": "Subjek Pajak Dalam Negeri (SPDN) bagi orang pribadi mencakup kondisi-kondisi berikut KECUALI...", "o": ["Tinggal di Indonesia", "Berada di Indonesia lebih dari 183 hari dalam 12 bulan", "WNA di Indonesia kurang dari 183 hari dalam 12 bulan", "Dalam 1 Tahun Pajak berada dan berniat tinggal di Indonesia"], "c": 2, "e": "WNA yang berada di Indonesia KURANG dari 183 hari dalam 12 bulan termasuk SPLN, bukan SPDN. SPDN mensyaratkan tinggal di Indonesia, >183 hari dalam 12 bulan, atau berniat tinggal dalam 1 Tahun Pajak.", "p": 0, "topic": "Subjek Pajak", "id": "pengawasan_q_31"}, {"q": "Manakah yang termasuk unit/badan yang DIKECUALIKAN dari Subjek Pajak Penghasilan sesuai Pasal 3 UU PPh?", "o": ["Semua instansi pemerintah tanpa terkecuali", "Unit tertentu badan pemerintah yang dibentuk berdasarkan UU, dibiayai APBN/APBD, dan diaudit aparat pengawasan fungsional negara", "Seluruh BUMN dan BUMD", "Yayasan dan organisasi massa"], "c": 1, "e": "Pasal 3 UU PPh mengecualikan unit tertentu badan pemerintah dengan kriteria: dibentuk berdasarkan UU, dibiayai APBN/APBD, penerimaannya masuk anggaran pemerintah, dan pembukuannya diaudit aparat pengawasan fungsional negara — bukan seluruh instansi/BUMN/BUMD secara umum.", "p": 0, "topic": "Non Subjek Pajak", "id": "pengawasan_q_32"}, {"q": "Pejabat perwakilan diplomatik negara asing dikecualikan dari Subjek Pajak dengan syarat...", "o": ["Harus WNI dan tinggal permanen di Indonesia", "Bukan WNI, tidak menerima penghasilan lain di luar jabatannya di Indonesia, dan ada perlakuan timbal balik dari negaranya", "Memiliki izin tinggal tetap", "Bekerja lebih dari 5 tahun di Indonesia"], "c": 1, "e": "Syarat pengecualian bagi pejabat diplomatik: bukan WNI, di Indonesia tidak menerima/memperoleh penghasilan di luar jabatan/pekerjaannya tersebut, dan negara yang bersangkutan memberikan perlakuan timbal balik (resiprositas).", "p": 0, "topic": "Non Subjek Pajak", "id": "pengawasan_q_33"}, {"q": "Penghasilan dengan karakteristik PPh Final memiliki ciri-ciri berikut, KECUALI...", "o": ["Digabungkan dengan penghasilan yang dikenakan tarif umum", "Tarif pajak bersifat khusus", "Biayanya tidak dapat dikurangkan", "Tetap dikenakan walaupun WP mengalami rugi usaha"], "c": 0, "e": "Justru sebaliknya — penghasilan PPh Final TIDAK digabungkan dengan penghasilan yang dikenakan tarif umum (Pasal 17); ini adalah ciri utama yang membedakannya dari penghasilan tidak final.", "p": 0, "topic": "PPh Final", "id": "pengawasan_q_34"}, {"q": "Manakah yang termasuk dalam daftar penghasilan yang DIKECUALIKAN dari objek Pajak Penghasilan?", "o": ["Laba usaha", "Keuntungan penjualan harta", "Warisan", "Royalti"], "c": 2, "e": "Warisan termasuk dalam daftar bukan objek pajak (Pasal 4 ayat (3) UU PPh), bersama bantuan/sumbangan/zakat, harta hibah, dan beberapa kategori lain — berbeda dari laba usaha, keuntungan penjualan harta, dan royalti yang merupakan objek pajak tarif umum.", "p": 0, "topic": "Objek Pajak", "id": "pengawasan_q_35"}, {"q": "Biaya manakah yang TIDAK DAPAT dikurangkan dari penghasilan bruto sesuai Pasal 9 UU PPh?", "o": ["Biaya penyusutan dan amortisasi", "Biaya litbang di Indonesia", "Pembagian laba dengan nama dan bentuk apapun seperti dividen", "Biaya beasiswa, magang, dan pelatihan"], "c": 2, "e": "Pembagian laba/dividen termasuk biaya non-fiskal (Pasal 9) karena merupakan pembagian hasil usaha, bukan biaya untuk mendapatkan/menagih/memelihara penghasilan — berbeda dengan penyusutan, litbang, dan beasiswa yang merupakan biaya fiskal (Pasal 6).", "p": 0, "topic": "Biaya Non Fiskal", "id": "pengawasan_q_36"}, {"q": "Kerugian fiskal suatu usaha dapat dikompensasikan dengan penghasilan tahun-tahun berikutnya selama berapa tahun berturut-turut?", "o": ["3 tahun", "5 tahun", "7 tahun", "10 tahun"], "c": 1, "e": "Pasal 6 ayat (2) UU PPh mengatur kompensasi kerugian fiskal dapat dilakukan selama 5 tahun berturut-turut, dimulai sejak tahun berikutnya sesudah tahun didapatnya kerugian.", "p": 0, "topic": "Kompensasi Kerugian", "id": "pengawasan_q_37"}, {"q": "Kompensasi kerugian horizontal TIDAK berlaku bagi kerugian dari sumber penghasilan berikut, KECUALI...", "o": ["Penghasilan yang dikenai pajak final", "Penghasilan yang bukan objek PPh", "Kerugian yang diderita di luar negeri", "Penghasilan dari usaha dagang dalam negeri"], "c": 3, "e": "Kompensasi kerugian horizontal berlaku untuk kerugian usaha dalam negeri yang dikenai tarif umum (seperti usaha dagang); kerugian dari penghasilan final, bukan objek, atau yang diderita di luar negeri dikecualikan.", "p": 0, "topic": "Kompensasi Kerugian", "id": "pengawasan_q_38"}, {"q": "Sejak Tahun Pajak 2022, untuk bangunan permanen dengan masa manfaat lebih dari 20 tahun, Wajib Pajak dapat memilih antara...", "o": ["Metode garis lurus atau saldo menurun saja", "Masa manfaat 20 tahun atau masa manfaat sebenarnya sesuai pembukuan WP", "Penyusutan dipercepat atau ditangguhkan", "Tidak ada pilihan, wajib menggunakan 20 tahun"], "c": 1, "e": "Pasal 11 ayat (6a) dan 11A ayat (2a) UU PPh (mulai berlaku Tahun Pajak 2022) memberi pilihan bagi bangunan permanen/harta tak berwujud kelompok 4 (masa manfaat >20 tahun) untuk menggunakan masa manfaat 20 tahun ATAU masa manfaat sebenarnya sesuai pembukuan WP.", "p": 0, "topic": "Penyusutan Amortisasi", "id": "pengawasan_q_39"}, {"q": "Metode penyusutan untuk harta berwujud berupa bangunan sesuai Pasal 11 UU PPh adalah...", "o": ["Garis lurus saja", "Saldo menurun saja", "Garis lurus atau saldo menurun, bebas pilih", "Satuan produksi"], "c": 0, "e": "Untuk bangunan, metode penyusutan yang digunakan hanya garis lurus; sedangkan untuk harta berwujud bukan bangunan, WP dapat memilih garis lurus atau saldo menurun.", "p": 0, "topic": "Penyusutan Amortisasi", "id": "pengawasan_q_40"}, {"q": "Fasilitas Pasal 31E berupa pengurangan tarif 50% diberikan kepada WP Badan dalam negeri dengan peredaran bruto sampai dengan berapa, dan dikenakan atas bagian peredaran bruto sampai berapa?", "o": ["Rp4,8 miliar; dikenakan atas seluruh PKP", "Rp50 miliar; dikenakan atas bagian peredaran bruto sampai Rp4,8 miliar", "Rp10 miliar; dikenakan atas bagian peredaran bruto sampai Rp1 miliar", "Rp100 miliar; dikenakan atas seluruh PKP"], "c": 1, "e": "Fasilitas Pasal 31E berlaku bagi WP Badan DN dengan peredaran bruto sampai Rp50 miliar, dengan pengurangan tarif 50% yang dikenakan hanya atas bagian Penghasilan Kena Pajak dari peredaran bruto sampai Rp4,8 miliar.", "p": 0, "topic": "Fasilitas Pasal 31E", "id": "pengawasan_q_41"}, {"q": "Apakah fasilitas pengurangan tarif Pasal 31E bersifat pilihan (opsional) bagi Wajib Pajak yang memenuhi kriteria?", "o": ["Ya, WP bebas memilih menggunakan atau tidak", "Tidak, fasilitas ini bukan pilihan dan otomatis berlaku bagi Subjek Pajak DN yang memenuhi kriteria (kecuali BUT)", "Hanya berlaku jika WP mengajukan permohonan tertulis", "Hanya berlaku bagi perusahaan terbuka (go public)"], "c": 1, "e": "Fasilitas Pasal 31E bukan merupakan pilihan — otomatis berlaku bagi Subjek Pajak Dalam Negeri yang memenuhi kriteria batasan peredaran bruto, kecuali BUT.", "p": 0, "topic": "Fasilitas Pasal 31E", "id": "pengawasan_q_42"}, {"q": "Besaran PTKP untuk diri Wajib Pajak orang pribadi (belum menikah, tanpa tanggungan) adalah...", "o": ["Rp36.000.000", "Rp48.000.000", "Rp54.000.000", "Rp60.000.000"], "c": 2, "e": "PTKP untuk diri WP OP sendiri adalah Rp54.000.000, ditambah Rp4.500.000 jika kawin, Rp54.000.000 tambahan jika penghasilan istri digabung, dan Rp4.500.000 per tanggungan (maks. 3 orang).", "p": 0, "topic": "PTKP", "id": "pengawasan_q_43"}, {"q": "Notasi PTKP \"K/I/2\" menunjukkan kondisi Wajib Pajak sebagai...", "o": ["Tidak kawin dengan 2 tanggungan", "Kawin, penghasilan istri TIDAK digabung, dengan 2 tanggungan", "Kawin, penghasilan istri digabung dengan penghasilan suami, dengan 2 tanggungan", "Kawin dengan status hidup berpisah dan 2 tanggungan"], "c": 2, "e": "Notasi K/I/(jumlah tanggungan) menunjukkan status kawin dengan penghasilan istri digabung dengan penghasilan suami, sehingga PTKP dasarnya Rp54.000.000 + Rp54.000.000 ditambah tanggungan.", "p": 0, "topic": "PTKP", "id": "pengawasan_q_44"}, {"q": "Dalam ketentuan PPh Final atas penghasilan WP dengan peredaran bruto tertentu (PP 55/2022), berapa jangka waktu pemanfaatan tarif final bagi Wajib Pajak orang pribadi?", "o": ["3 tahun", "4 tahun", "5 tahun", "7 tahun"], "c": 3, "e": "Jangka waktu pemanfaatan PPh Final UMKM bagi WP OP adalah 7 tahun, sedangkan untuk PT 3 tahun, dan CV/Firma/Koperasi/BUMDes 4 tahun, dihitung sejak terdaftar atau sejak PP berlaku (untuk WP yang sudah terdaftar sebelumnya).", "p": 0, "topic": "PPh Final UMKM", "id": "pengawasan_q_45"}, {"q": "Khusus bagi Wajib Pajak orang pribadi yang dikenai PPh Final UMKM, bagian peredaran bruto sampai dengan berapa dalam 1 Tahun Pajak tidak dikenai PPh?", "o": ["Rp100 juta", "Rp300 juta", "Rp500 juta", "Rp1 miliar"], "c": 2, "e": "Khusus WP OP, bagian peredaran bruto dari usaha sampai dengan Rp500 juta dalam 1 Tahun Pajak tidak dikenai PPh, dihitung secara kumulatif sejak Masa Pajak pertama dalam Tahun Pajak atau bagian Tahun Pajak.", "p": 0, "topic": "PPh Final UMKM", "id": "pengawasan_q_46"}, {"q": "Manakah pihak yang TIDAK dapat memanfaatkan PPh Final dengan tarif 0,5% berdasarkan PP 55/2022?", "o": ["WP OP dengan peredaran bruto Rp2 miliar/tahun", "CV yang dibentuk oleh beberapa WP OP dengan keahlian khusus yang menyerahkan jasa sejenis pekerjaan bebas", "Koperasi dengan peredaran bruto Rp3 miliar/tahun", "Firma dengan peredaran bruto Rp1 miliar/tahun"], "c": 1, "e": "CV/Firma yang dibentuk oleh beberapa WP OP yang memiliki keahlian khusus dan menyerahkan jasa sejenis dengan jasa sehubungan pekerjaan bebas termasuk dalam daftar pihak yang DIKECUALIKAN dari PPh Final UMKM, bersama WP yang memilih tarif umum, mendapat fasilitas Pasal 31A, dan BUT.", "p": 0, "topic": "PPh Final UMKM", "id": "pengawasan_q_47"}, {"q": "Pemberian makanan dan minuman bagi seluruh pegawai di tempat kerja termasuk natura/kenikmatan yang...", "o": ["Merupakan objek pajak penuh", "Bukan objek pajak (dikecualikan)", "Dikenakan PPh Final 0,5%", "Hanya dikecualikan untuk pegawai golongan tertentu"], "c": 1, "e": "Makanan/minuman/bahan makanan bagi seluruh pegawai di tempat kerja termasuk salah satu dari 5 kategori natura/kenikmatan yang dikecualikan dari objek PPh.", "p": 0, "topic": "Natura", "id": "pengawasan_q_48"}, {"q": "Biaya pemberian natura/kenikmatan oleh pemberi kerja dapat dibiayakan (deductible) sepanjang...", "o": ["Diberikan kepada seluruh direksi perusahaan", "Merupakan biaya untuk mendapatkan, menagih, dan memelihara penghasilan (3M)", "Nilainya di bawah Rp10 juta per tahun", "Disetujui oleh pemegang saham mayoritas"], "c": 1, "e": "Biaya natura/kenikmatan dapat dikurangkan dari penghasilan bruto sepanjang merupakan biaya untuk mendapatkan, menagih, dan memelihara penghasilan (prinsip 3M), terlepas dari status pajaknya bagi penerima.", "p": 0, "topic": "Natura", "id": "pengawasan_q_49"}, {"q": "Pengusaha Kecil dalam PPN didefinisikan sebagai pengusaha yang melakukan penyerahan BKP/JKP dalam satu tahun buku dengan jumlah peredaran bruto tidak lebih dari...", "o": ["Rp1,8 miliar", "Rp2,4 miliar", "Rp4,8 miliar", "Rp10 miliar"], "c": 2, "e": "Pengusaha Kecil adalah pengusaha dengan peredaran bruto/penerimaan bruto tidak lebih dari Rp4.800.000.000 (Rp4,8 miliar) dalam satu tahun buku — tidak wajib dikukuhkan sebagai PKP.", "p": 0, "topic": "Pengusaha Kecil", "id": "pengawasan_q_50"}, {"q": "Sejak berlakunya PMK-164/2023, bagaimana hubungan antara saat terbit Surat Pengukuhan PKP (SPPKP) dengan saat mulainya kewajiban pungut, setor, dan lapor PPN?", "o": ["Selalu sama persis seperti rezim PMK lama", "Dapat berbeda — WP dapat memilih saat mulainya kewajiban sebelum awal tahun buku berikutnya dengan menyampaikan pemberitahuan", "Kewajiban selalu dimulai sejak tanggal lahir WP", "Tidak ada hubungan sama sekali"], "c": 1, "e": "Berbeda dari PMK lama (saat terbit SPPKP = saat mulai kewajiban), PMK-164/2023 memberi grace period: WP dapat memilih saat mulainya kewajiban pungut/setor/lapor sebelum awal tahun buku berikutnya, atau default dimulai Masa Pajak pertama tahun buku berikutnya jika tidak memberitahukan.", "p": 0, "topic": "Pengukuhan PKP", "id": "pengawasan_q_51"}, {"q": "PPN atas Kegiatan Membangun Sendiri (Pasal 16C) dikenakan dengan syarat luas bangunan minimal berapa?", "o": ["100 m²", "150 m²", "200 m²", "250 m²"], "c": 2, "e": "KMS dikenakan PPN jika luas bangunan minimal 200 m², dengan tarif 20% × 11% × total biaya membangun (tidak termasuk perolehan tanah).", "p": 0, "topic": "PPN KMS", "id": "pengawasan_q_52"}, {"q": "PPN atas penyerahan aktiva yang semula tidak untuk diperjualbelikan (Pasal 16D UU PPN) dikenakan, KECUALI atas aktiva yang...", "o": ["Nilainya di bawah Rp100 juta", "Pajak Masukannya tidak dapat dikreditkan menurut Pasal 9 ayat (8) huruf b dan c", "Dibeli lebih dari 5 tahun yang lalu", "Berupa kendaraan roda dua"], "c": 1, "e": "Pasal 16D mengecualikan pengenaan PPN atas penyerahan aktiva yang Pajak Masukannya tidak dapat dikreditkan sesuai Pasal 9 ayat (8) huruf b (tidak berhubungan langsung dengan usaha) dan huruf c (kendaraan sedan/station wagon).", "p": 0, "topic": "Penyerahan Aktiva Pasal 16D", "id": "pengawasan_q_53"}, {"q": "Manakah yang termasuk dalam pengertian \"penyerahan Barang Kena Pajak\" sesuai Pasal 1A ayat (1) UU PPN?", "o": ["Penyerahan BKP untuk jaminan utang-piutang", "Penyerahan BKP kepada pedagang perantara atau melalui juru lelang", "Penyerahan BKP dalam rangka pemusatan tempat pajak terutang", "Pengalihan BKP dalam rangka penggabungan usaha dengan nilai buku"], "c": 1, "e": "Penyerahan BKP kepada pedagang perantara atau melalui juru lelang TERMASUK pengertian penyerahan BKP (Pasal 1A ayat (1) huruf c); sementara 3 opsi lainnya justru termasuk kategori yang TIDAK termasuk penyerahan BKP (Pasal 1A ayat (2)).", "p": 0, "topic": "Penyerahan BKP", "id": "pengawasan_q_54"}, {"q": "Pemakaian sendiri BKP/JKP oleh pengusaha, pengurus, atau karyawan (baik produksi sendiri maupun bukan) termasuk dalam pengertian penyerahan BKP yang disebut sebagai...", "o": ["Pemakaian sendiri dan pemberian cuma-cuma", "Penyerahan kepada makelar", "Pemusatan tempat pajak terutang", "Jaminan utang piutang"], "c": 0, "e": "Pemakaian untuk kepentingan pengusaha sendiri, pengurus, atau karyawan baik barang produksi sendiri maupun bukan termasuk kategori \"pemakaian sendiri dan pemberian cuma-cuma\" sesuai Pasal 1A ayat (1) huruf d.", "p": 0, "topic": "Penyerahan BKP", "id": "pengawasan_q_55"}, {"q": "Sejak berlakunya UU HPP, manakah dari daftar berikut yang TETAP menjadi Bukan Barang Kena Pajak (Non-BKP)?", "o": ["Barang hasil pertambangan yang diambil langsung dari sumbernya", "Barang kebutuhan pokok yang sangat dibutuhkan rakyat banyak", "Uang, emas batangan untuk cadangan devisa, dan surat berharga", "Semua barang hasil pertanian"], "c": 2, "e": "Sejak UU HPP, barang tambang dan kebutuhan pokok telah dihapus dari daftar Non-BKP (kini objek PPN). Yang tetap menjadi Non-BKP hanya uang, emas batangan untuk cadangan devisa, dan surat berharga.", "p": 0, "topic": "Non BKP", "id": "pengawasan_q_56"}, {"q": "Sejak berlakunya UU HPP, manakah jasa yang MASIH termasuk Bukan Jasa Kena Pajak (Non-JKP)?", "o": ["Jasa keuangan", "Jasa pelayanan kesehatan medik", "Jasa kesenian dan hiburan", "Jasa pengiriman surat dengan perangko"], "c": 2, "e": "Sejak UU HPP, sebagian besar kategori Non-JKP lama dihapus (jasa keuangan, kesehatan, pengiriman surat berperangko, dll menjadi objek PPN). Yang tetap Non-JKP antara lain: jasa keagamaan, jasa kesenian & hiburan, jasa perhotelan, jasa pemerintahan umum, jasa parkir, dan jasa boga/katering.", "p": 0, "topic": "Non JKP", "id": "pengawasan_q_57"}, {"q": "Tarif PPN yang berlaku sejak 1 April 2022 adalah...", "o": ["10%", "11%", "12%", "15%"], "c": 1, "e": "Tarif PPN naik dari 10% menjadi 11% mulai 1 April 2022, dan direncanakan menjadi 12% paling lambat 1 Januari 2025; untuk ekspor BKP/JKP tetap berlaku tarif 0%.", "p": 0, "topic": "Tarif PPN", "id": "pengawasan_q_58"}, {"q": "Dasar Pengenaan Pajak (DPP) berupa Nilai Lain untuk transaksi pemakaian sendiri BKP/JKP dihitung berdasarkan...", "o": ["Harga Jual atau Penggantian dikurangi laba kotor", "Harga pasar penuh tanpa pengurangan", "20% dari total biaya transaksi", "Nilai impor ditambah bea masuk"], "c": 0, "e": "DPP Nilai Lain untuk pemakaian sendiri maupun pemberian cuma-cuma BKP/JKP adalah Harga Jual atau Penggantian dikurangi laba kotor.", "p": 0, "topic": "DPP PPN", "id": "pengawasan_q_59"}, {"q": "Dalam hal pembayaran atas suatu transaksi BKP diterima SEBELUM penyerahan BKP dilakukan, kapan PPN terutang?", "o": ["Pada saat penyerahan BKP dilakukan", "Pada saat pembayaran diterima", "Pada akhir Masa Pajak yang bersangkutan", "Pada saat Faktur Pajak diterbitkan"], "c": 1, "e": "Dalam hal pembayaran diterima sebelum penyerahan BKP/JKP, saat terutangnya pajak adalah pada saat pembayaran tersebut diterima — bukan menunggu saat penyerahan fisik.", "p": 0, "topic": "Saat Terutang PPN", "id": "pengawasan_q_60"}, {"q": "Terutangnya PPN atas pemanfaatan BKP Tidak Berwujud/JKP dari luar Daerah Pabean ditentukan berdasarkan peristiwa mana yang terjadi lebih dahulu, KECUALI...", "o": ["Saat BKPTB/JKP secara nyata digunakan oleh pihak yang memanfaatkannya", "Saat harga perolehan dinyatakan sebagai utang", "Saat kontrak ditandatangani oleh notaris", "Saat harga perolehan dibayar sebagian/seluruhnya"], "c": 2, "e": "4 peristiwa yang menentukan saat terutang adalah: digunakan secara nyata, dinyatakan sebagai utang, ditagih harga jual/penggantiannya, atau dibayar sebagian/seluruhnya. Penandatanganan kontrak oleh notaris bukan salah satu kriteria tersebut — kontrak hanya relevan jika saat dimulainya pemanfaatan tidak diketahui.", "p": 0, "topic": "Saat Terutang PPN", "id": "pengawasan_q_61"}, {"q": "Pajak Masukan yang dapat dikreditkan tetapi belum dikreditkan pada Masa Pajak yang sama dapat dikreditkan pada Masa Pajak berikutnya paling lama berapa Masa Pajak setelah berakhirnya Masa Pajak saat Faktur Pajak dibuat?", "o": ["1 Masa Pajak", "2 Masa Pajak", "3 Masa Pajak", "6 Masa Pajak"], "c": 2, "e": "Pasal 9 ayat (9) UU PPN mengatur PM yang belum dikreditkan dapat dikreditkan pada Masa Pajak berikutnya paling lama 3 Masa Pajak setelah berakhirnya Masa Pajak saat Faktur Pajak dibuat, sepanjang belum dibebankan sebagai biaya/dikapitalisasi.", "p": 0, "topic": "Pengkreditan PM", "id": "pengawasan_q_62"}, {"q": "Pengkreditan Pajak Masukan TIDAK DAPAT diberlakukan bagi pengeluaran untuk...", "o": ["Perolehan bahan baku produksi", "Perolehan/pemeliharaan kendaraan bermotor sedan dan station wagon (kecuali barang dagangan/disewakan)", "Perolehan mesin produksi", "Perolehan bangunan kantor"], "c": 1, "e": "Pasal 9 ayat (8) huruf c UU PPN melarang pengkreditan PM atas perolehan/pemeliharaan kendaraan bermotor sedan dan station wagon, kecuali digunakan sebagai barang dagangan atau disewakan.", "p": 0, "topic": "PM Tidak Dapat Dikreditkan", "id": "pengawasan_q_63"}, {"q": "Bagi Pengusaha yang belum dikukuhkan sebagai PKP, Pajak Masukan atas perolehan BKP/JKP sebelum dikukuhkan dapat dikreditkan menggunakan pedoman deemed PM sebesar berapa persen dari Pajak Keluaran yang seharusnya dipungut?", "o": ["50%", "60%", "70%", "80%"], "c": 3, "e": "Pengkreditan PM bagi Pengusaha sebelum dikukuhkan PKP menggunakan pedoman deemed PM sebesar 80% dari Pajak Keluaran yang seharusnya dipungut.", "p": 0, "topic": "Deemed PM", "id": "pengawasan_q_64"}, {"q": "Jika sampai dengan 3 tahun pertama sejak mengkreditkan PM, PKP belum melakukan penyerahan BKP/JKP, apa konsekuensinya terhadap PM yang telah dikreditkan tersebut?", "o": ["Tidak ada konsekuensi, PM tetap sah", "PM menjadi tidak dapat dikreditkan (dibatalkan)", "PM otomatis menjadi kredit pajak Tahun berikutnya", "PKP wajib membayar pajak tambahan 10%"], "c": 1, "e": "Jika dalam 3 tahun pertama sejak mengkreditkan PM belum ada penyerahan BKP/JKP, maka PM yang telah dikreditkan menjadi tidak dapat dikreditkan (dibatalkan) sesuai Pasal 9 ayat (6a) UU PPN.", "p": 0, "topic": "Pengkreditan PM Sebelum Penyerahan", "id": "pengawasan_q_65"}, {"q": "PM yang ditagih dengan penerbitan ketetapan pajak dapat dikreditkan oleh PKP sebesar...", "o": ["Jumlah pokok PPN yang tercantum dalam ketetapan pajak, dengan syarat telah dilunasi dan tidak diajukan upaya hukum", "100% dari total ketetapan termasuk sanksi", "50% dari pokok pajak", "Tidak dapat dikreditkan sama sekali"], "c": 0, "e": "PM yang ditagih dengan ketetapan pajak dapat dikreditkan sebesar jumlah pokok PPN dalam ketetapan, dengan syarat ketetapan telah dilunasi dan tidak dilakukan upaya hukum, serta memenuhi ketentuan pengkreditan lainnya.", "p": 0, "topic": "Pengkreditan PM Ketetapan Pajak", "id": "pengawasan_q_66"}, {"q": "SPT Masa PPN bentuk 1111DM digunakan oleh PKP yang...", "o": ["Baru dikukuhkan sebagai PKP", "Menggunakan pedoman penghitungan pengkreditan Pajak Masukan", "Bergerak di sektor ekspor", "Merupakan instansi pemerintah"], "c": 1, "e": "Formulir SPT Masa PPN 1111DM khusus digunakan oleh PKP yang menggunakan pedoman penghitungan pengkreditan Pajak Masukan (deemed PM), berbeda dari 1111 (PKP umum) dan 1107PUT (pemungut PPN).", "p": 0, "topic": "Jenis SPT Masa PPN", "id": "pengawasan_q_67"}, {"q": "Objek Pajak PBB sektor Pertambangan Minyak dan Gas Bumi mencakup Wilayah Kerja sebagaimana tercantum dalam apa?", "o": ["Kontrak Kerja Sama", "Izin Usaha Pertambangan (IUP)", "Hak Guna Usaha (HGU)", "Izin Usaha Perikanan"], "c": 0, "e": "Objek PBB sektor Pertambangan Migas mencakup Wilayah Kerja sebagaimana tercantum dalam Kontrak Kerja Sama, ditambah areal lain yang merupakan satu kesatuan dan secara fisik tidak terpisahkan.", "p": 0, "topic": "Objek PBB Migas", "id": "pengawasan_q_68"}, {"q": "Penilaian objek pajak untuk penetapan NJOP PBB pada seluruh sektor (perkebunan, perhutanan, pertambangan, lainnya) dilakukan oleh siapa?", "o": ["Kepala KPP setempat", "Penilai Pajak", "Notaris yang ditunjuk WP", "Badan Pertanahan Nasional"], "c": 1, "e": "Pada seluruh sektor objek PBB P5L, penilaian objek pajak untuk penetapan NJOP dilakukan oleh Penilai Pajak sesuai Pasal 12 PMK-186/PMK.03/2019.", "p": 0, "topic": "Penetapan NJOP", "id": "pengawasan_q_69"}, {"q": "Nilai Jual Pengganti (NJP) untuk tubuh bumi eksploitasi pertambangan migas dihitung berdasarkan rumus...", "o": ["Luas areal dikali NJOP per meter persegi", "Pendapatan minyak dan/atau gas bumi dikali Angka Kapitalisasi", "Harga jual rata-rata dikali volume produksi", "Biaya investasi dikali tingkat suku bunga acuan"], "c": 1, "e": "NJP tubuh bumi eksploitasi migas = Pendapatan minyak dan/atau gas bumi (dari Financial Quarterly Report triwulan IV) × Angka Kapitalisasi — bukan berdasarkan luas areal seperti pada tahap eksplorasi.", "p": 0, "topic": "NJOP Migas", "id": "pengawasan_q_70"}, {"q": "SPPT PBB wajib dilunasi selambat-lambatnya berapa bulan sejak tanggal diterima oleh Wajib Pajak?", "o": ["3 bulan", "4 bulan", "6 bulan", "12 bulan"], "c": 2, "e": "SPPT wajib dilunasi selambat-lambatnya 6 bulan sejak tanggal SPPT diterima oleh WP; jika tidak/kurang dibayar setelah jatuh tempo, KPP menerbitkan STP PBB.", "p": 0, "topic": "Pelunasan SPPT", "id": "pengawasan_q_71"}, {"q": "Dalam hal SPPT diterbitkan ulang karena adanya Surat Keputusan Keberatan atau Putusan Banding, apa status SPPT yang terbit sebelumnya dan SPPT hasil penerbitan kembali?", "o": ["SPPT sebelumnya tetap berlaku berdampingan dengan SPPT baru", "SPPT sebelumnya dinyatakan tidak berlaku, dan SPPT hasil penerbitan kembali tidak dapat diajukan keberatan", "WP harus membayar kedua SPPT tersebut", "SPPT baru hanya berlaku untuk tahun pajak berikutnya"], "c": 1, "e": "Ketika SPPT diterbitkan kembali akibat SK Keberatan/Pembetulan/Pengurangan/Putusan Banding-Gugatan-PK, SPPT sebelumnya dinyatakan tidak berlaku, dan SPPT hasil penerbitan kembali tidak dapat diajukan keberatan lagi oleh WP.", "p": 0, "topic": "Penerbitan Kembali SPPT", "id": "pengawasan_q_72"}, {"q": "Penandatanganan Dokumen Elektronik oleh Wajib Pajak Badan dilakukan oleh...", "o": ["Hanya oleh notaris yang ditunjuk", "Orang pribadi yang merupakan wakil WP, atau pihak yang ditunjuk wakil WP sesuai ketentuan", "Hanya oleh Direktur Utama secara pribadi", "Pihak ketiga independen tanpa kuasa"], "c": 1, "e": "Bagi Badan/Instansi Pemerintah/WBT, penandatanganan Dokumen Elektronik dilakukan oleh orang pribadi yang merupakan wakil WP, atau orang pribadi selain wakil WP yang ditunjuk oleh wakil WP sesuai ketentuan yang berlaku.", "p": 0, "topic": "Dokumen Elektronik", "id": "pengawasan_q_73"}, {"q": "Dalam PMK-63/2021 tentang Pelaksanaan Hak dan Kewajiban Perpajakan Elektronik, penandatanganan Dokumen Elektronik oleh Wajib Pajak dapat menggunakan sarana berikut, KECUALI...", "o": ["TTE Tersertifikasi dari PSrE", "Kode Otorisasi DJP yang diterbitkan saat aktivasi Akun WP", "Validasi identitas melalui Contact Center dengan afirmasi WP", "Tanda tangan basah yang dipindai (scan) tanpa sertifikat elektronik"], "c": 3, "e": "Sarana penandatanganan dokumen elektronik yang sah meliputi TTE Tersertifikasi, TTE tidak tersertifikasi (Kode Otorisasi DJP), atau afirmasi melalui Contact Center — bukan sekadar scan tanda tangan basah tanpa sertifikat elektronik.", "p": 0, "topic": "Dokumen Elektronik", "id": "pengawasan_q_74"}, {"q": "WP Badan dengan izin pembukuan bahasa Inggris dan mata uang Dolar AS wajib menyampaikan SPT PPh Badan dalam bahasa apa, kecuali untuk lampiran apa?", "o": ["Bahasa Inggris seluruhnya tanpa kecuali", "Bahasa Indonesia, kecuali lampiran berupa laporan keuangan", "Bahasa Indonesia untuk seluruh dokumen tanpa kecuali", "Bahasa campuran sesuai kebijakan internal perusahaan"], "c": 1, "e": "WP Badan dengan izin pembukuan bahasa Inggris & USD wajib menyampaikan SPT PPh Badan dalam bahasa Indonesia, KECUALI lampiran berupa laporan keuangan (yang tetap dalam bahasa Inggris/USD sesuai pembukuannya).", "p": 0, "topic": "Mata Uang SPT", "id": "pengawasan_q_75"}, {"q": "Manakah kriteria yang mewajibkan Wajib Pajak menyampaikan SPT Tahunan PPh dalam bentuk Dokumen Elektronik?", "o": ["WP OP yang berpenghasilan di bawah PTKP", "SPT Tahunan PPh berstatus Lebih Bayar", "WP yang baru pertama kali mendaftar NPWP", "WP yang belum memiliki smartphone"], "c": 1, "e": "Salah satu kriteria wajib SPT elektronik adalah SPT Tahunan PPh berstatus Lebih Bayar, selain WP Badan, pernah/telah menyampaikan SPT elektronik, terdaftar di KPP selain Pratama, memakai jasa konsultan pajak, dan laporan keuangan diaudit akuntan publik.", "p": 0, "topic": "SPT Elektronik", "id": "pengawasan_q_76"}, {"q": "Khusus SPT yang disampaikan melalui pos atau jasa ekspedisi/kurir, dalam kondisi apa SPT dianggap TIDAK disampaikan?", "o": ["Jika dikirim pada hari Jumat", "Jika isi amplop bukan Surat Pemberitahuan atau 1 amplop berisi lebih dari 1 SPT", "Jika dikirim menggunakan jasa kurir swasta", "Jika SPT dicetak berwarna"], "c": 1, "e": "Ketentuan tambahan PMK 243/2014 menyatakan SPT via pos/ekspedisi dianggap tidak disampaikan jika antara lain: isi amplop bukan SPT, 1 amplop berisi lebih dari 1 SPT, NPWP tidak valid, SPT sudah pernah disampaikan sebelumnya, atau ada kesalahan jumlah pembayaran.", "p": 0, "topic": "Penelitian SPT", "id": "pengawasan_q_77"}, {"q": "Tarif PPh Final atas pengalihan hak atas tanah dan/atau bangunan kepada pemerintah/BUMN/BUMD yang mendapat penugasan khusus sesuai PMK 261/2016 adalah...", "o": ["0%", "1%", "2,5%", "5%"], "c": 0, "e": "Tarif 0% berlaku atas PHTB kepada pemerintah, BUMN yang mendapat penugasan khusus, atau BUMD yang mendapat penugasan khusus dari kepala daerah sebagaimana dimaksud dalam UU pengadaan tanah untuk kepentingan umum.", "p": 0, "topic": "PPh Final PHTB", "id": "pengawasan_q_78"}, {"q": "Tarif PPh Final umum atas pengalihan hak atas tanah dan/atau bangunan (selain yang dikenakan tarif 0% dan 1%) adalah...", "o": ["1%", "2%", "2,5%", "5%"], "c": 2, "e": "Tarif umum PPh Final PHTB adalah 2,5% dari nilai pengalihan, berbeda dengan tarif 0% (pengalihan ke pemerintah/BUMN-BUMD tertentu, rumah sederhana) dan 1% (pengalihan umum ke pemerintah).", "p": 0, "topic": "PPh Final PHTB", "id": "pengawasan_q_79"}, {"q": "PHTB yang dikecualikan dari pengenaan PPh Final meliputi, KECUALI...", "o": ["Hibah kepada keluarga sedarah garis lurus satu derajat", "PHTB sehubungan dengan warisan", "Penjualan tanah dan bangunan secara komersial kepada pihak ketiga yang tidak memiliki hubungan istimewa", "Penggabungan usaha dengan nilai buku yang ditetapkan Menteri Keuangan"], "c": 2, "e": "Penjualan tanah/bangunan secara komersial kepada pihak ketiga TETAP dikenakan PPh Final — bukan termasuk pengecualian. Pengecualian hanya untuk kondisi khusus seperti hibah ke keluarga/lembaga tertentu, warisan, dan restrukturisasi usaha dengan nilai buku.", "p": 0, "topic": "Pengecualian PPh Final PHTB", "id": "pengawasan_q_80"}, {"q": "Tarif PPh Final atas penghasilan dari pengalihan Real Estat kepada Special Purpose Company (SPC) atau KIK dalam skema DIRE sesuai PMK 37/2017 adalah...", "o": ["0,5%", "1%", "2,5%", "5%"], "c": 0, "e": "Tarif PPh Final atas pengalihan Real Estat kepada SPC/KIK dalam skema DIRE tertentu adalah 0,5% dari jumlah bruto nilai pengalihan Real Estat, bersifat final.", "p": 0, "topic": "PPh Final DIRE", "id": "pengawasan_q_81"}, {"q": "Agar dapat memanfaatkan tarif PPh Final 0,5% atas pengalihan Real Estat ke DIRE, Wajib Pajak harus memenuhi persyaratan administratif berupa...", "o": ["Hanya cukup membuat akta notaris", "Menyampaikan pemberitahuan ke KPP dilengkapi dokumen OJK dan memenuhi persyaratan Surat Keterangan Fiskal", "Mendapat persetujuan DPR terlebih dahulu", "Membayar uang jaminan sebesar 10% dari nilai transaksi"], "c": 1, "e": "Syarat tarif 0,5% meliputi penyampaian pemberitahuan ke Kepala KPP dengan dokumen pendukung dari OJK (pernyataan efektif DIRE, keterangan transaksi dengan SPC/KIK DIRE) serta pemenuhan persyaratan untuk diberikan Surat Keterangan Fiskal.", "p": 0, "topic": "PPh Final DIRE", "id": "pengawasan_q_82"}, {"q": "Hubungan Istimewa karena kepemilikan modal terjadi apabila penyertaan modal langsung atau tidak langsung paling rendah berapa persen?", "o": ["15%", "20%", "25%", "50%"], "c": 2, "e": "Pasal 2 PMK 172/2023: penyertaan modal paling rendah 25%, atau hubungan dua WP yang sama-sama memiliki penyertaan 25% pada pihak ketiga yang sama.", "p": 0, "topic": "Transfer Pricing", "id": "pengawasan_q_83"}, {"q": "Apa tujuan utama penerapan Prinsip Kewajaran dan Kelaziman Usaha (PKKU)?", "o": ["Meningkatkan penerimaan pajak negara secara langsung", "Menentukan Harga Transfer yang wajar antar pihak afiliasi", "Mencegah seluruh transaksi antar pihak afiliasi", "Menetapkan tarif pajak khusus untuk transaksi afiliasi"], "c": 1, "e": "Pasal 3 PMK 172/2023: PKKU diterapkan untuk menentukan Harga Transfer wajar dengan membandingkan kondisi dan indikator harga transaksi afiliasi dengan transaksi independen sebanding.", "p": 0, "topic": "Transfer Pricing", "id": "pengawasan_q_84"}, {"q": "Penerapan PKKU secara digabungkan untuk dua atau lebih jenis Transaksi Afiliasi dilakukan apabila...", "o": ["WP meminta secara tertulis kepada DJP", "transaksi tersebut saling berkaitan dan mempengaruhi satu sama lain sehingga penerapan terpisah tidak andal/akurat", "jumlah transaksinya melebihi batas tertentu", "pihak afiliasinya berada di luar negeri"], "c": 1, "e": "Pasal 4: penggabungan dilakukan jika dua/lebih jenis transaksi afiliasi saling berkaitan dan mempengaruhi satu sama lain dalam penentuan Harga Transfer, sehingga penerapan terpisah tidak dapat dilakukan secara andal dan akurat.", "p": 0, "topic": "Transfer Pricing", "id": "pengawasan_q_85"}, {"q": "Manakah urutan yang BENAR dari enam tahapan penerapan PKKU?", "o": ["Analisis industri → identifikasi transaksi → metode → analisis kesebandingan", "Identifikasi transaksi & pihak afiliasi → analisis industri → analisis kondisi transaksi → analisis kesebandingan → penentuan metode → penerapan metode", "Penentuan metode → analisis kesebandingan → identifikasi transaksi → analisis industri", "Analisis kesebandingan → identifikasi transaksi → analisis industri → penentuan metode"], "c": 1, "e": "Pasal 4 menetapkan urutan: identifikasi transaksi dan pihak afiliasi, analisis industri, analisis kondisi transaksi, analisis kesebandingan, penentuan metode, lalu penerapan metode.", "p": 0, "topic": "Transfer Pricing", "id": "pengawasan_q_86"}, {"q": "Dalam analisis kondisi transaksi (Pasal 7 PMK 172/2023), berikut ini termasuk salah satu dari 5 faktor kesebandingan, KECUALI...", "o": ["Ketentuan Kontraktual", "Fungsi, Aset, dan Risiko", "Jumlah pegawai perusahaan", "Strategi Bisnis"], "c": 2, "e": "Lima faktor kesebandingan adalah Ketentuan Kontraktual, Fungsi/Aset/Risiko, Karakteristik Produk, Strategi Bisnis, dan Keadaan Ekonomi. Jumlah pegawai bukan salah satu faktor tersebut.", "p": 0, "topic": "Transfer Pricing", "id": "pengawasan_q_87"}, {"q": "Jika tersedia pembanding internal dan eksternal dengan tingkat kesebandingan dan keandalan yang sama, pembanding manakah yang harus dipilih?", "o": ["Pembanding eksternal karena lebih objektif", "Pembanding internal", "Keduanya digunakan sekaligus", "Dipilih berdasarkan keputusan pemeriksa"], "c": 1, "e": "Pasal 8: dalam hal tersedia pembanding internal dan eksternal dengan tingkat kesebandingan dan keandalan yang sama, pembanding internal yang dipilih dan digunakan.", "p": 0, "topic": "Transfer Pricing", "id": "pengawasan_q_88"}, {"q": "Metode Comparable Uncontrolled Price (CUP) paling sesuai digunakan untuk transaksi...", "o": ["Jasa manajemen antar afiliasi", "Produk komoditas atau barang/jasa dengan karakteristik sama/serupa dengan transaksi independen sebanding", "Restrukturisasi usaha", "Harta tidak berwujud yang unik"], "c": 1, "e": "Pasal 9: CUP sesuai untuk transaksi produk komoditas, atau barang/jasa dengan karakteristik yang sama atau serupa dengan barang/jasa pada Transaksi Independen dalam kondisi sebanding.", "p": 0, "topic": "Transfer Pricing", "id": "pengawasan_q_89"}, {"q": "Apabila CUP dan metode lain memiliki tingkat keandalan yang setara, metode manakah yang diutamakan?", "o": ["TNMM", "PSM", "CUP", "CPM"], "c": 2, "e": "Pasal 9: dalam hal CUP dan metode lain yang dapat digunakan memiliki keandalan setara, CUP lebih diutamakan.", "p": 0, "topic": "Transfer Pricing", "id": "pengawasan_q_90"}, {"q": "Resale Price Method (RPM) paling sesuai untuk transaksi yang melibatkan...", "o": ["Pabrikan yang membeli bahan baku", "Distributor/reseller yang menjual kembali tanpa menanggung risiko bisnis signifikan atau nilai tambah signifikan", "Pemberi lisensi harta tidak berwujud", "Pemberi pinjaman antar afiliasi"], "c": 1, "e": "Pasal 9: RPM sesuai untuk transaksi yang melibatkan distributor/reseller yang melakukan penjualan dengan harga sudah memenuhi PKKU, dan tidak menanggung risiko bisnis atau memberikan nilai tambah signifikan.", "p": 0, "topic": "Transfer Pricing", "id": "pengawasan_q_91"}, {"q": "Dalam metode pembagian laba (Profit Split Method) dengan pendekatan residual analysis, laba gabungan dipisah menjadi dua bagian, yaitu...", "o": ["Laba kotor dan laba bersih", "Laba dari kontribusi masing-masing pihak yang dapat dibandingkan secara andal, dan sisa laba gabungan yang dibagi berdasarkan faktor pembagi", "Laba domestik dan laba luar negeri", "Laba tahun berjalan dan laba tahun sebelumnya"], "c": 1, "e": "Pasal 11: residual analysis memisahkan laba gabungan menjadi (a) laba dari kontribusi masing-masing pihak yang dapat diperoleh secara andal pembandingnya dalam Transaksi Independen, dan (b) sisa laba gabungan yang dibagi berdasarkan faktor pembagi.", "p": 0, "topic": "Transfer Pricing", "id": "pengawasan_q_92"}, {"q": "Rentang kewajaran berbentuk interquartile range digunakan apabila pembanding yang tersedia berjumlah...", "o": ["Satu pembanding", "Dua pembanding", "Tiga atau lebih pembanding", "Lima atau lebih pembanding"], "c": 2, "e": "Pasal 12: full range (minimum-maksimum) digunakan jika terbentuk dari dua pembanding; interquartile range (kuartil 1 - kuartil 3) digunakan jika terbentuk dari tiga atau lebih pembanding.", "p": 0, "topic": "Transfer Pricing", "id": "pengawasan_q_93"}, {"q": "Apabila Harga Transfer tidak memenuhi PKKU dan titik paling tepat dalam rentang kewajaran tidak dapat ditentukan, penentuan Harga Transfer menggunakan...", "o": ["Titik maksimum rentang", "Titik minimum rentang", "Titik tengah (median) rentang kewajaran", "Rata-rata aritmatika sederhana"], "c": 2, "e": "Pasal 12: jika titik paling tepat tidak dapat ditentukan, digunakan titik tengah (median) di dalam rentang kewajaran.", "p": 0, "topic": "Transfer Pricing", "id": "pengawasan_q_94"}, {"q": "Untuk transaksi jasa antar pihak afiliasi, pembuktian pada tahapan pendahuluan mensyaratkan bahwa jasa tersebut BUKAN merupakan...", "o": ["Jasa yang nyata diberikan", "Shareholder activity (aktivitas kepentingan pemegang saham)", "Jasa yang dibutuhkan penerima jasa", "Jasa yang memberikan manfaat ekonomis"], "c": 1, "e": "Pasal 13: transaksi jasa harus dibuktikan bukan merupakan shareholder activity (aktivitas untuk kepentingan pemegang saham semata), bukan passive association, bukan duplikasi, dan bukan manfaat insidental.", "p": 0, "topic": "Transfer Pricing", "id": "pengawasan_q_95"}, {"q": "Jika Wajib Pajak tidak dapat membuktikan Transaksi Afiliasi tertentu berdasarkan tahapan pendahuluan (Pasal 13), konsekuensinya adalah...", "o": ["Transaksi tersebut otomatis dikenakan sanksi administrasi", "Transaksi tersebut dianggap tidak memenuhi PKKU", "WP wajib membatalkan transaksi tersebut", "DJP wajib melakukan pemeriksaan khusus"], "c": 1, "e": "Pasal 13: dalam hal WP tidak dapat membuktikan Transaksi Afiliasi tertentu berdasarkan tahapan pendahuluan, transaksi tersebut tidak memenuhi PKKU.", "p": 0, "topic": "Transfer Pricing", "id": "pengawasan_q_96"}, {"q": "Penerapan PKKU atas WPDN yang juga ditetapkan sebagai BUT (Pasal 14) mewajibkan BUT tersebut untuk...", "o": ["Membubarkan usahanya di Indonesia", "Menyampaikan seluruh data dan/atau informasi terkait transaksi Pihak Afiliasi di luar negeri", "Membayar pajak dua kali", "Mengubah statusnya menjadi WP Badan biasa"], "c": 1, "e": "Pasal 14: BUT harus menyampaikan seluruh data/informasi terkait transaksi Pihak Afiliasi di luar negeri; jika tidak disampaikan, nilai transaksi ditentukan dengan menerapkan PKKU.", "p": 0, "topic": "Transfer Pricing", "id": "pengawasan_q_97"}, {"q": "Jalur pengawasan atas WP yang sudah terdaftar namun terindikasi SPT tidak disampaikan sesuai batas waktu, per PMK-111/2025, ditindaklanjuti melalui...", "o": ["Surat Imbauan", "Surat Teguran", "SP2DK langsung", "Pemeriksaan tujuan lain"], "c": 1, "e": "Proses bisnis Pengawasan cfm PMK-111/2025: untuk WP Terdaftar, indikasi SPT tidak disampaikan sesuai batas waktu ditindaklanjuti dengan Surat Teguran, berbeda dengan Surat Imbauan yang menyangkut pengukuhan PKP, pembayaran, pelaporan, dll.", "p": 0, "topic": "Ekstensifikasi", "id": "pengawasan_q_98"}, {"q": "Jalur pengawasan WP belum terdaftar per PMK-111/2025 ditempuh melalui tahapan...", "o": ["Surat Teguran langsung ke NPWP jabatan", "SP2DK - SPHPP", "Surat Imbauan - BAP2DK langsung", "Pemeriksaan - LHP"], "c": 1, "e": "Proses bisnis Pengawasan atas WP Belum Terdaftar cfm PMK-111/2025 ditempuh melalui jalur SP2DK - SPHPP.", "p": 0, "topic": "Ekstensifikasi", "id": "pengawasan_q_99"}, {"q": "Dalam persandingan alur PMK Pengawasan dan PMK Pemeriksaan, dokumen BAP2DK pada jalur Pengawasan setara dengan dokumen apa pada jalur Pemeriksaan?", "o": ["Surat Perintah Pemeriksaan (SP2)", "Risalah/Ikhtisar Pembahasan Akhir Hasil Pemeriksaan (PAHP)", "Laporan Hasil Pemeriksaan (LHP)", "Surat Pemberitahuan Hasil Pemeriksaan (SPHP)"], "c": 1, "e": "Dalam persandingan alur, tahapan Undangan Pembahasan Akhir - BAP2DK pada jalur Pengawasan bersanding dengan Undangan PAHP - Risalah/Ikhtisar PAHP pada jalur Pemeriksaan PMK-15/2025.", "p": 0, "topic": "Ekstensifikasi", "id": "pengawasan_q_100"}, {"q": "Ruang Lingkup Kegiatan Ekstensifikasi 2026 difokuskan pada Aktivasi WP, yang terbagi menjadi dua kategori yaitu...", "o": ["WP Terdaftar dan WP Belum Terdaftar", "WP Baru dan WP NA (Non-Aktif)", "WP Strategis dan WP Non-Strategis", "WP OP dan WP Badan"], "c": 1, "e": "Ruang Lingkup Kegiatan Ekstensifikasi 2026 terfokus pada Aktivasi WP, mencakup WP Baru (melalui DPE dan KPD) dan WP NA (melalui NA TD dan KPD).", "p": 0, "topic": "Ekstensifikasi", "id": "pengawasan_q_101"}, {"q": "Dalam Gambaran Umum Proses Bisnis Pengawasan atas WP belum ber-NPWP, WP yang teridentifikasi berisiko LOW ditindaklanjuti melalui...", "o": ["Analisis/Penelitian Potensi Pajak dan penerbitan SP2DK", "Edukasi", "Langsung diterbitkan NPWP secara jabatan", "Pemeriksaan bukti permulaan"], "c": 1, "e": "Dalam alur Perencanaan Ekstensifikasi: WP risiko High & Medium ditindaklanjuti dengan Analisis/Penelitian Potensi Pajak lalu SP2DK, sedangkan WP risiko Low ditindaklanjuti dengan Edukasi.", "p": 0, "topic": "Ekstensifikasi", "id": "pengawasan_q_102"}, {"q": "Tim Ekstensifikasi yang ditugaskan dalam satu DPE (Daftar Prioritas Ekstensifikasi) terdiri dari berapa orang dengan peran apa?", "o": ["2 orang: Kasi Pengawasan sebagai Supervisor dan 1 AR sebagai Ketua Tim", "3 orang: Kasi Pengawasan sebagai Supervisor, 1 AR pengampu/Kepala KP2KP sebagai Ketua Tim, dan 1 AR lain sebagai Anggota Tim", "4 orang dari seksi yang berbeda-beda", "1 orang yaitu Account Representative pengampu WP"], "c": 1, "e": "Tim ekstensifikasi terdiri dari Kepala Seksi Pengawasan (Supervisor), 1 AR pengampu/Kepala KP2KP (Ketua Tim), dan 1 AR lain dalam satu seksi pengawasan (Anggota Tim).", "p": 0, "topic": "Ekstensifikasi", "id": "pengawasan_q_103"}, {"q": "Berapa lama jangka waktu yang diberikan kepada Wajib Pajak untuk menanggapi SP2DK dalam proses Ekstensifikasi (tanpa perpanjangan)?", "o": ["7 hari kalender", "10 hari kerja", "14 hari kalender", "30 hari kalender"], "c": 2, "e": "WP diberikan jangka waktu 14 hari kalender untuk menyampaikan tanggapan atau klarifikasi atas SP2DK.", "p": 0, "topic": "Ekstensifikasi", "id": "pengawasan_q_104"}, {"q": "Apabila WP mengajukan perpanjangan jangka waktu tanggapan SP2DK, berapa lama maksimal perpanjangan yang dapat diberikan, dan kapan pemberitahuan tersebut harus diterima KPP?", "o": ["Maksimal 7 hari, diterima sebelum jangka waktu 14 hari berakhir", "Maksimal 14 hari, diterima kapan saja", "Maksimal 3 hari, diterima setelah jangka waktu berakhir", "Tidak ada batas perpanjangan"], "c": 0, "e": "WP dapat menyampaikan pemberitahuan perpanjangan secara tertulis maksimal 7 hari, dan pemberitahuan tersebut harus diterima KPP yang menerbitkan SP2DK sebelum jangka waktu 14 hari berakhir.", "p": 0, "topic": "Ekstensifikasi", "id": "pengawasan_q_105"}, {"q": "Dalam penyusunan SPHPP, Tim Ekstensifikasi menggunakan Examination Working Sheet (EWS) untuk masa pajak maksimal berapa tahun sebelum tahun berjalan pelaksanaan ekstensifikasi?", "o": ["2 tahun", "3 tahun", "5 tahun", "10 tahun"], "c": 2, "e": "Penelitian Potensi Pajak dilakukan menggunakan EWS untuk seluruh jenis pajak dengan masa pajak maksimal 5 tahun sebelum tahun berjalan pelaksanaan ekstensifikasi.", "p": 0, "topic": "Ekstensifikasi", "id": "pengawasan_q_106"}, {"q": "Apabila hasil penghitungan menunjukkan tidak ada indikasi kewajiban perpajakan yang masih harus dipenuhi WP, maka setelah SPHPP diterbitkan, proses langsung menuju ke...", "o": ["Undangan Pembahasan dan Surat Undangan Pembahasan Akhir", "BAP2DK", "Pemeriksaan bukti permulaan", "Penerbitan SKPKB"], "c": 1, "e": "Jika tidak ada indikasi kewajiban perpajakan yang masih harus dipenuhi, SPHPP langsung menuju BAP2DK, tanpa melalui Undangan Pembahasan.", "p": 0, "topic": "Ekstensifikasi", "id": "pengawasan_q_107"}, {"q": "Dalam pembahasan dengan WP pada proses Ekstensifikasi, apabila WP tidak hadir dalam pembahasan, maka...", "o": ["Proses ekstensifikasi otomatis dihentikan (case closed)", "Pembahasan dianggap telah dilaksanakan dan kewajiban perpajakan dihitung sendiri oleh DJP", "WP diberi kesempatan hadir hingga 3 kali", "Kasus langsung diusulkan untuk pemeriksaan bukti permulaan"], "c": 1, "e": "Jika WP tidak hadir, pembahasan dianggap telah dilaksanakan dan kewajiban perpajakan yang masih harus dipenuhi WP dihitung oleh DJP.", "p": 0, "topic": "Ekstensifikasi", "id": "pengawasan_q_108"}, {"q": "Jika Wajib Pajak tidak bisa melakukan tanda tangan elektronik (TTE) atas konsep BAP2DK yang disampaikan secara daring, berapa lama batas waktu WP mengirimkan kembali konsep yang telah ditandatangani?", "o": ["Maksimal 3 hari kerja", "Maksimal 5 hari kerja", "Maksimal 7 hari kerja", "Maksimal 14 hari kerja"], "c": 1, "e": "Jika WP tidak bisa TTE, WP mengirim kembali konsep BAP2DK yang telah ditandatangani maksimal 5 hari kerja sejak konsep dikirim oleh AR/Pegawai DJP.", "p": 0, "topic": "Ekstensifikasi", "id": "pengawasan_q_109"}, {"q": "Dokumen LHP2DK (Laporan Hasil Permintaan Penjelasan atas Data dan/atau Keterangan) memuat hal-hal berikut, KECUALI...", "o": ["Informasi profil Wajib Pajak", "Hasil klarifikasi Wajib Pajak", "Putusan pengadilan pajak", "Rekomendasi atau tindak lanjut"], "c": 2, "e": "LHP2DK memuat informasi profil WP, penyampaian SP2DK, hasil klarifikasi WP, indikasi kewajiban perpajakan, tanggapan WP, dan rekomendasi/tindak lanjut — tidak memuat putusan pengadilan pajak.", "p": 0, "topic": "Ekstensifikasi", "id": "pengawasan_q_110"}, {"q": "Manakah yang BUKAN merupakan kriteria Wajib Pajak Non-Aktif sesuai PER-07/PJ/2025?", "o": ["WP OP yang merupakan WNI berstatus Penduduk yang tidak lagi memenuhi persyaratan subjektif dan objektif karena telah menjadi SPLN", "WP OP yang melakukan kegiatan usaha dan rutin membayar pajak setiap bulan", "WP Badan yang tidak memenuhi persyaratan subjektif dan objektif namun masih dalam proses penghapusan NPWP", "Instansi Pemerintah yang tidak memenuhi persyaratan sebagai pemotong/pemungut pajak namun belum dilakukan penghapusan NPWP"], "c": 1, "e": "WP yang aktif melakukan usaha dan rutin membayar pajak bukan kriteria WP Non-Aktif; kriteria WP Non-Aktif justru berkaitan dengan WP yang tidak lagi memenuhi syarat subjektif/objektif atau berstatus SPLN.", "p": 0, "topic": "Ekstensifikasi", "id": "pengawasan_q_111"}, {"q": "Salah satu kriteria penetapan WP Non-Aktif secara jabatan adalah WP tidak melaporkan SPT Masa atau Tahunan secara berturut-turut dalam jangka waktu...", "o": ["2 tahun terakhir", "3 tahun terakhir", "5 tahun terakhir", "10 tahun terakhir"], "c": 2, "e": "Salah satu kriteria penetapan WP Non-Aktif secara jabatan (PER-7/PJ/2025) adalah WP tidak melaporkan SPT Masa/Tahunan berturut-turut dalam 5 tahun terakhir.", "p": 0, "topic": "Ekstensifikasi", "id": "pengawasan_q_112"}, {"q": "Pengaktifan kembali WP Non-Efektif (NE) secara otomatis by system (SE-27/PJ/2020) melalui pelaporan SPT berlaku untuk formulir apa?", "o": ["1770 dan 1771", "1770S atau 1770SS", "Seluruh jenis formulir SPT tanpa kecuali", "1721"], "c": 1, "e": "Pengaktifan otomatis via pelaporan SPT berlaku untuk WP yang menyampaikan formulir 1770S atau 1770SS, tidak melewati batas waktu, bukan pembetulan, nihil/kurang bayar, dan tidak disampaikan dalam bentuk e-SPT.", "p": 0, "topic": "Ekstensifikasi", "id": "pengawasan_q_113"}, {"q": "Dirjen Pajak berwenang melakukan pemeriksaan untuk dua tujuan utama, yaitu...", "o": ["Menguji kepatuhan dan untuk tujuan lain melaksanakan ketentuan peraturan perpajakan", "Menagih utang pajak dan menyita aset WP", "Menerbitkan NPWP dan mencabut NPWP", "Menyidik tindak pidana dan menuntut WP"], "c": 0, "e": "Pasal 2 PMK 15/2025: Dirjen Pajak berwenang melakukan pemeriksaan untuk menguji kepatuhan pemenuhan kewajiban perpajakan dan untuk tujuan lain dalam rangka melaksanakan ketentuan peraturan perundang-undangan perpajakan.", "p": 0, "topic": "Pemeriksaan", "id": "pengawasan_q_114"}, {"q": "Pemeriksaan yang mencakup satu atau beberapa pos dalam SPT dan/atau SPOP secara mendalam disebut...", "o": ["Pemeriksaan Lengkap", "Pemeriksaan Terfokus", "Pemeriksaan Spesifik", "Pemeriksaan Dakon"], "c": 1, "e": "Pemeriksaan Terfokus mencakup satu atau beberapa pos dalam SPT dan/atau SPOP secara mendalam, berbeda dari Pemeriksaan Lengkap (seluruh pos secara mendalam) dan Pemeriksaan Spesifik (satu/beberapa pos secara sederhana).", "p": 0, "topic": "Pemeriksaan", "id": "pengawasan_q_115"}, {"q": "Berikut ini termasuk kriteria pemeriksaan untuk menguji kepatuhan, KECUALI...", "o": ["WP mengajukan permohonan pengembalian kelebihan pembayaran pajak sesuai Pasal 17B KUP", "WP melakukan penggabungan, peleburan, pemekaran, likuidasi, atau pembubaran usaha", "WP mengajukan permohonan Nomor Pokok Wajib Pajak baru secara sukarela", "Terdapat data konkret yang menyebabkan pajak terutang tidak atau kurang dibayar"], "c": 2, "e": "Permohonan NPWP baru secara sukarela bukan kriteria pemeriksaan uji kepatuhan (Pasal 4 ayat 1), melainkan proses pendaftaran administratif biasa.", "p": 0, "topic": "Pemeriksaan", "id": "pengawasan_q_116"}, {"q": "Berapa lama jangka waktu pengujian untuk Pemeriksaan Lengkap, dihitung sejak Surat Pemberitahuan Pemeriksaan disampaikan?", "o": ["1 bulan", "3 bulan", "5 bulan", "10 hari kerja"], "c": 2, "e": "Jangka waktu pengujian: Pemeriksaan Lengkap paling lama 5 bulan, Pemeriksaan Terfokus 3 bulan, Pemeriksaan Spesifik 1 bulan, dan Pemeriksaan Dakon 10 hari kerja.", "p": 0, "topic": "Pemeriksaan", "id": "pengawasan_q_117"}, {"q": "Jangka waktu PAHP dan pelaporan untuk Pemeriksaan Dakon (data konkret), dihitung sejak SPHP disampaikan, adalah paling lama...", "o": ["10 hari kerja", "30 hari kerja", "1 bulan", "3 bulan"], "c": 0, "e": "Jangka waktu PAHP & pelaporan untuk Pemeriksaan Lengkap/Terfokus/Spesifik adalah 30 hari kerja, sedangkan untuk Pemeriksaan Dakon paling lama 10 hari kerja.", "p": 0, "topic": "Pemeriksaan", "id": "pengawasan_q_118"}, {"q": "Jangka waktu Pemeriksaan untuk Tujuan Lain, dihitung sejak Surat Pemberitahuan Pemeriksaan disampaikan, paling lama adalah...", "o": ["1 bulan", "2 bulan", "4 bulan", "6 bulan"], "c": 2, "e": "Jangka waktu Pemeriksaan untuk Tujuan Lain paling lama 4 bulan sejak Surat Pemberitahuan Pemeriksaan disampaikan.", "p": 0, "topic": "Pemeriksaan", "id": "pengawasan_q_119"}, {"q": "Pemeriksaan atas Wajib Pajak Kontraktor Kontrak Kerja Sama (K3S) Migas dengan skema pengembalian biaya operasi (Production Sharing Contract Cost Recovery) mengikuti ketentuan...", "o": ["Jangka waktu Pemeriksaan Lengkap biasa (5 bulan)", "Pedoman pelaksanaan Pemeriksaan bersama atas pelaksanaan kontrak kerja sama minyak dan gas bumi", "Tidak ada jangka waktu khusus, mengikuti kebijakan internal DJP", "Jangka waktu Pemeriksaan Spesifik (1 bulan)"], "c": 1, "e": "Jangka waktu Pemeriksaan atas WP K3S Migas dengan skema PSC Cost Recovery mengikuti ketentuan dalam Peraturan Menteri mengenai pedoman pelaksanaan Pemeriksaan bersama atas pelaksanaan kontrak kerja sama minyak dan gas bumi.", "p": 0, "topic": "Pemeriksaan", "id": "pengawasan_q_120"}, {"q": "Kriteria tambahan pemeriksaan uji kepatuhan khusus untuk PBB, selain kriteria umum, adalah...", "o": ["WP tidak menyampaikan SPOP setelah ditegur, dan indikasi PBB lebih besar dari yang dihitung dari SPOP", "WP tidak membayar PBB tepat waktu", "WP mengajukan keberatan PBB", "WP memindahtangankan objek PBB"], "c": 0, "e": "Kriteria m dan n khusus PBB: WP tidak menyampaikan SPOP (setelah ditegur), dan terdapat indikasi jumlah PBB yang terutang lebih besar daripada PBB yang dihitung berdasarkan SPOP.", "p": 0, "topic": "Pemeriksaan", "id": "pengawasan_q_121"}, {"q": "Dalam siklus penatausahaan PBB P5L, apabila Surat Teguran atas SPOP tidak ditanggapi WP, tahapan berikutnya adalah...", "o": ["Langsung diterbitkan SPPT", "Anris Pemeriksaan lalu Pemeriksaan PBB hingga SKP PBB", "Pembetulan SPOP otomatis oleh sistem", "Pengaktifan kembali NPWP secara jabatan"], "c": 1, "e": "Jika Surat Teguran tidak ditanggapi, alur berlanjut ke Anris Pemeriksaan, kemudian Pemeriksaan PBB, hingga diterbitkan SKP PBB.", "p": 0, "topic": "Pemeriksaan", "id": "pengawasan_q_122"}, {"q": "Pada Pemeriksaan PBB, Kepala Unit Pelaksana Pemeriksaan (UP2) melibatkan pihak yang memiliki keahlian khusus untuk menetapkan NJOP, yaitu...", "o": ["Juru Sita Pajak", "Penilai Pajak", "Account Representative", "Fungsional Penyuluh Pajak"], "c": 1, "e": "Dalam Pemeriksaan PBB, Kepala UP2 melibatkan Penilai Pajak sebagai pihak yang memiliki keahlian khusus untuk menetapkan NJOP PBB.", "p": 0, "topic": "Pemeriksaan", "id": "pengawasan_q_123"}, {"q": "Berdasarkan PER-18/PJ/2025, manakah yang termasuk salah satu dari 3 jenis Data Konkret?", "o": ["Faktur Pajak yang disetujui sistem tetapi belum/tidak dilaporkan dalam SPT Masa PPN", "Surat Keputusan Keberatan", "Laporan Hasil Pemeriksaan tahun sebelumnya", "Surat Pemberitah
